*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;padding:2rem 1rem}
.logo{text-align:center;margin-bottom:2rem}
.logo h1{font-size:22px;font-weight:600}

label{font-size:13px;color:#555;display:block;margin-bottom:5px;margin-top:12px}
label:first-of-type{margin-top:0}
input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;color:#1a1a1a;background:#fff}
input:focus{outline:none;border-color:#378ADD}
.err{font-size:13px;color:#c0392b;margin-top:8px}
.btn-primary{display:inline-block;padding:10px 26px;background:#378ADD;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;margin-top:16px}
.btn-primary:hover{background:#185FA5}
.btn-secondary{display:inline-block;padding:10px 26px;background:#fff;color:#1a1a1a;border:1px solid #ccc;border-radius:8px;font-size:14px;cursor:pointer}
.btn-secondary:hover{background:#f5f5f5}
.intro-box{background:#f0f7ff;border:1px solid #b3d4f5;border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.intro-box h2{font-size:16px;font-weight:600;color:#185FA5;margin-bottom:12px}
.intro-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.intro-icon{width:26px;height:26px;border-radius:50%;background:#378ADD;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

.warning-box strong{font-weight:600}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
.timer{font-size:15px;font-weight:600;padding:4px 12px;border-radius:8px;border:1.5px solid #378ADD;color:#378ADD;background:#eef5fc;min-width:75px;text-align:center}
.timer.warn{border-color:#d35400;color:#d35400;background:#fef5e7}
.timer.danger{border-color:#c0392b;color:#c0392b;background:#fdedec}
.prog-wrap{height:6px;background:#eee;border-radius:3px;margin-bottom:1.5rem;overflow:hidden}
.prog-fill{height:100%;background:#378ADD;border-radius:3px;transition:width 0.3s}
.q-cat{font-size:12px;padding:3px 10px;border-radius:6px;background:#f0f0f0;color:#555;display:inline-block;margin-bottom:12px}

.opt:hover:not(:disabled){background:#eef5fc}
.opt.correct{background:#eafaf1;border-color:#27ae60;color:#1e8449}
.opt.wrong{background:#fdedec;border-color:#e74c3c;color:#c0392b}
.opt:disabled{cursor:default}
.feedback{font-size:13px;color:#555;margin-top:10px;padding:10px 14px;background:#f8f8f8;border-radius:8px;border-left:3px solid #ccc;line-height:1.6}
.nav-row{display:flex;justify-content:flex-end;margin-top:12px}
.score-big{font-size:52px;font-weight:600;text-align:center;line-height:1}
.verdict-badge{display:inline-block;padding:8px 24px;border-radius:999px;font-size:17px;font-weight:700}
.verdict-desc{font-size:13px;color:#555;margin-top:10px;line-height:1.6;text-align:center;max-width:480px;margin-left:auto;margin-right:auto}
.cat-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.cat-pill{flex:1;min-width:110px;background:#f8f8f8;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;text-align:center}
.cat-pill .cl{font-size:11px;color:#888}
.cat-pill .cv{font-size:20px;font-weight:500;margin-top:2px}
.review-item{display:flex;gap:8px;align-items:flex-start}
.rok{font-size:13px;min-width:20px;color:#27ae60;font-weight:600}
.rerr{font-size:13px;min-width:20px;color:#e74c3c;font-weight:600}
.es{margin-top:14px;font-size:13px;padding:8px 14px;border-radius:8px;display:inline-block}
.es-sending{background:#eef5fc;color:#185FA5}
.es-sent{background:#eafaf1;color:#1e8449}
.es-error{background:#fdedec;color:#c0392b}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
.sec-title{font-size:14px;font-weight:500;color:#666;margin-bottom:8px}
@media print{.btn-row,.timer,.prog-wrap{display:none}body{background:#fff}}
</style>

const CATS=["Networking","Inglese Tecnico","Problem Solving"];
const CAT_LABELS={"Networking":"Networking","Inglese Tecnico":"Inglese Tecnico","Problem Solving":"Problem Solving"};

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQ(){return shuffle([...shuffle(NETWORKING_Q).slice(0,10),...shuffle(ENGLISH_Q).slice(0,10),...shuffle(LOGIC_Q).slice(0,10)]);}
function genCode(){return Math.random().toString(36).substr(2,8).toUpperCase();}

const VERDICT=s=>{
  if(s<=10)return{label:"Resisti!",color:"#A32D2D",bg:"#FCEBEB",desc:"Le basi sono ancora da costruire, ma con impegno e dedizione si cresce. Non mollare!"};
  if(s<=18)return{label:"Ci siamo quasi!",color:"#854F0B",bg:"#FAEEDA",desc:"Buona volontà e qualche lacuna da colmare. Il potenziale c'è, continua a lavorarci!"};
  if(s<=24)return{label:"Campione",color:"#3B6D11",bg:"#EAF3DE",desc:"Solide competenze tecniche e buona autonomia operativa. Ottimo lavoro!"};
  return{label:"Leggenda",color:"#0F6E56",bg:"#E1F5EE",desc:"Eccellente preparazione su tutti i fronti. Benvenuto nel team!"};
};

async function sendEmail(params){
  const res=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:EMAILJS_SERVICE,template_id:EMAILJS_TEMPLATE,user_id:EMAILJS_KEY,template_params:params})});
  if(!res.ok)throw new Error("err");
}

function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="className")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v);});
  if(children){if(Array.isArray(children))children.forEach(c=>c&&el.appendChild(typeof c==="string"?document.createTextNode(c):c));else el.appendChild(typeof children==="string"?document.createTextNode(children):children);}
  return el;
}

let state={phase:"intro",form:{nome:"",cognome:"",data:""},questions:[],current:0,answers:{},chosen:null,score:0,code:genCode(),emailStatus:"idle",timeLeft:TOTAL_TIME};
let timerInterval=null;

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    state.timeLeft--;
    updateTimer();
    if(state.timeLeft<=0){clearInterval(timerInterval);handleTimeout();}
  },1000);
}

function updateTimer(){
  const el=document.getElementById("timer");
  if(!el)return;
  const m=Math.floor(state.timeLeft/60).toString().padStart(2,"0");
  const s=(state.timeLeft%60).toString().padStart(2,"0");
  el.textContent="⏱ "+m+":"+s;
  el.className="timer"+(state.timeLeft<300?" danger":state.timeLeft<600?" warn":"");
}

function handleTimeout(){
  const fs=Object.keys(state.answers).filter(i=>state.answers[i]===state.questions[i]?.a).length;
  finishQuiz(fs,state.answers,state.questions,true);
}

function finishQuiz(fs,ans,qs,timeout){
  state.phase="result";
  state.emailStatus="sending";
  render();
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  qs.forEach((q,i)=>{if(cs[q.cat]){cs[q.cat].tot++;if(ans[i]===q.a)cs[q.cat].ok++;}});
  const det=CATS.map(c=>`${CAT_LABELS[c]}: ${cs[c]?.ok||0}/${cs[c]?.tot||0}`).join("\n");
  const vd=VERDICT(fs);
  const note=timeout?" (tempo scaduto)":"";
  sendEmail({nome:state.form.nome,cognome:state.form.cognome,data:state.form.data,codice:state.code,punteggio:fs+note,giudizio:vd.label,dettaglio:det})
    .then(()=>{state.emailStatus="sent";document.getElementById("email-status")&&(document.getElementById("email-status").className="es es-sent",document.getElementById("email-status").textContent="✓ Risultati inviati via email al responsabile");})
    .catch(()=>{state.emailStatus="error";document.getElementById("email-status")&&(document.getElementById("email-status").className="es es-error",document.getElementById("email-status").textContent="⚠ Invio email fallito — salva il PDF manualmente");});
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(state.phase==="intro")app.appendChild(renderIntro());
  else if(state.phase==="info")app.appendChild(renderInfo());
  else if(state.phase==="quiz")app.appendChild(renderQuiz());
  else app.appendChild(renderResult());
}

function renderIntro(){
  const wrap=document.createDocumentFragment();
  const box=h("div",{className:"intro-box"});
  box.appendChild(h("h2",{},"Benvenuto nel Quiz di Valutazione Tecnica Kaplet"));
  const rows=[
    ["📋","Di cosa si tratta","Questo test è pensato per valutare le tue competenze in tre aree fondamentali per lavorare con noi: conoscenze di rete, inglese tecnico e capacità di problem solving sul campo."],
    ["❓","Quante domande","Il quiz è composto da 30 domande a risposta multipla, suddivise in tre categorie da 10 domande ciascuna: Networking, Inglese Tecnico e Problem Solving."],
    ["⏱","Quanto tempo hai","Hai a disposizione 30 minuti per completare il test. Il timer partirà non appena premerai Inizia il quiz. Se il tempo scade, il quiz si chiuderà automaticamente."],
    ["🎯","Come viene valutato","Non ci sono risposte giuste o sbagliate in assoluto: il test serve per capire il tuo livello attuale e vedere in quali aree sei più forte. Sii onesto nelle risposte."],
    ["📧","Cosa succede alla fine","Al termine del test riceverai il tuo punteggio con un dettaglio per categoria. I risultati verranno inviati automaticamente al team Kaplet."],
  ];
  rows.forEach(([icon,title,text])=>{
    const row=h("div",{className:"intro-row"});
    row.appendChild(h("div",{className:"intro-icon"},icon));
    const t=h("div",{className:"intro-text"});
    t.appendChild(h("strong",{},title+": "));
    t.appendChild(document.createTextNode(text));
    row.appendChild(t);
    box.appendChild(row);
  });
  wrap.appendChild(box);
  const warn=h("div",{className:"warning-box"});
  warn.innerHTML="<strong>⚠ Prima di iniziare:</strong> assicurati di avere 30 minuti di tempo libero e una connessione stabile. Una volta avviato il quiz il timer non si ferma.";
  wrap.appendChild(warn);
  const btn=h("button",{className:"btn-primary",onClick:()=>{state.phase="info";render();}});
  btn.textContent="Continua →";
  wrap.appendChild(btn);
  return wrap;
}

function renderInfo(){
  const wrap=h("div",{className:"card"});
  wrap.innerHTML=`<div style="font-size:16px;font-weight:600;margin-bottom:4px">Inserisci i tuoi dati</div><div style="font-size:13px;color:#888;margin-bottom:16px">Questi dati verranno inviati insieme al risultato del test.</div>`;
  const addField=(id,lbl,type,ph)=>{
    const l=h("label",{},lbl);
    const i=document.createElement("input");
    i.type=type||"text";i.id=id;i.placeholder=ph||"";i.value=state.form[id]||"";
    i.style.marginBottom="12px";
    wrap.appendChild(l);wrap.appendChild(i);
  };
  addField("nome","Nome","text","Es. Marco");
  addField("cognome","Cognome","text","Es. Rossi");
  addField("data","Data","date","");
  const err=h("div",{className:"err",id:"f-err",style:"display:none"},"");
  wrap.appendChild(err);
  const btn=h("button",{className:"btn-primary",onClick:()=>{
    const n=document.getElementById("nome").value.trim();
    const c=document.getElementById("cognome").value.trim();
    const d=document.getElementById("data").value;
    if(!n||!c||!d){document.getElementById("f-err").style.display="block";document.getElementById("f-err").textContent="Compila tutti i campi per iniziare.";return;}
    state.form={nome:n,cognome:c,data:d};
    state.questions=pickQ();state.current=0;state.answers={};state.chosen=null;state.score=0;state.timeLeft=TOTAL_TIME;
    state.phase="quiz";render();startTimer();
  }},"Inizia il quiz →");
  wrap.appendChild(btn);
  return wrap;
}

function renderQuiz(){
  const frag=document.createDocumentFragment();
  const q=state.questions[state.current];
  const pct=Math.round((state.current/state.questions.length)*100);
  const topBar=h("div",{className:"top-bar"});
  topBar.appendChild(h("span",{className:"name"},state.form.nome+" "+state.form.cognome));
  const right=h("div",{className:"right"});
  right.appendChild(h("span",{style:"font-size:13px;color:#888"},`${state.current+1}/${state.questions.length}`));
  const timer=h("div",{className:"timer",id:"timer"},"⏱ 30:00");
  right.appendChild(timer);
  topBar.appendChild(right);
  frag.appendChild(topBar);
  frag.appendChild(h("div",{className:"prog-wrap"},[h("div",{className:"prog-fill",style:`width:${pct}%`})]));
  const card=h("div",{className:"card"});
  card.appendChild(h("span",{className:"q-cat"},CAT_LABELS[q.cat]));
  card.appendChild(h("div",{className:"q-text"},q.q));
  q.opts.forEach((o,i)=>{
    let cls="opt";
    if(state.chosen!==null){if(i===q.a)cls+=" correct";else if(i===state.chosen)cls+=" wrong";}
    const btn=h("button",{className:cls,onClick:()=>{
      if(state.chosen!==null)return;
      state.chosen=i;state.answers[state.current]=i;
      if(i===q.a)state.score++;
      render();startTimer();
    }},String.fromCharCode(65+i)+". "+o);
    if(state.chosen!==null)btn.disabled=true;
    card.appendChild(btn);
  });
  if(state.chosen!==null){
    card.appendChild(h("div",{className:"feedback"},(state.chosen===q.a?"✓ Corretto! ":"✗ Risposta errata. ")+q.exp));
    const nav=h("div",{className:"nav-row"});
    nav.appendChild(h("button",{className:"btn-primary",onClick:()=>{
      if(state.current<state.questions.length-1){state.current++;state.chosen=null;render();}
      else{clearInterval(timerInterval);const fs=Object.keys(state.answers).filter(i=>state.answers[i]===state.questions[i]?.a).length;finishQuiz(fs,state.answers,state.questions,false);}
    }},state.current<state.questions.length-1?"Prossima →":"Vedi risultato →"));
    card.appendChild(nav);
  }
  frag.appendChild(card);
  setTimeout(updateTimer,50);
  return frag;
}

function renderResult(){
  const frag=document.createDocumentFragment();
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  state.questions.forEach((q,i)=>{if(cs[q.cat]){cs[q.cat].tot++;if(state.answers[i]===q.a)cs[q.cat].ok++;}});
  const fs=Object.keys(state.answers).filter(i=>state.answers[i]===state.questions[i]?.a).length;
  const vd=VERDICT(fs);
  const top=h("div",{className:"card",style:"text-align:center"});
  top.appendChild(h("div",{style:"font-size:13px;color:#888;margin-bottom:4px"},"Codice sessione: "+state.code));
  top.appendChild(h("div",{style:"font-size:15px;font-weight:600;margin-bottom:2px"},state.form.nome+" "+state.form.cognome));
  top.appendChild(h("div",{style:"font-size:13px;color:#888;margin-bottom:16px"},state.form.data));
  top.appendChild(h("div",{className:"score-big"},[document.createTextNode(fs),h("span",{style:"font-size:28px;color:#888"},"/"+state.questions.length)]));
  top.appendChild(h("div",{style:"font-size:14px;color:#888;margin-top:4px"},Math.round((fs/state.questions.length)*100)+"% di risposte corrette"));
  top.appendChild(h("span",{className:"verdict-badge",style:`background:${vd.bg};color:${vd.color};margin-top:14px;display:inline-block`},vd.label));
  top.appendChild(h("div",{className:"verdict-desc"},vd.desc));
  top.appendChild(h("div",{style:"font-size:11px;color:#aaa;margin-top:8px"},"0–10 Resisti! · 11–18 Ci siamo quasi! · 19–24 Campione · 25–30 Leggenda"));
  const esEl=h("div",{className:"es es-sending",id:"email-status"},"⏳ Invio risultati in corso...");
  top.appendChild(esEl);
  frag.appendChild(top);
  frag.appendChild(h("div",{className:"sec-title"},"Punteggio per categoria"));
  const grid=h("div",{className:"cat-grid"});
  CATS.forEach(c=>{
    const p=h("div",{className:"cat-pill"});
    p.appendChild(h("div",{className:"cl"},CAT_LABELS[c]));
    p.appendChild(h("div",{className:"cv"},(cs[c]?.ok||0)+"/"+(cs[c]?.tot||0)));
    grid.appendChild(p);
  });
  frag.appendChild(grid);
  frag.appendChild(h("div",{className:"sec-title"},"Riepilogo risposte"));
  state.questions.forEach((q,i)=>{
    const ok=state.answers[i]===q.a;
    const card=h("div",{className:"card",style:"padding:0.9rem 1.2rem;margin-bottom:8px"});
    const row=h("div",{className:"review-item"});
    row.appendChild(h("span",{className:ok?"rok":"rerr"},ok?"✓":"✗"));
    const info=h("div",{style:"flex:1"});
    info.appendChild(h("div",{style:"font-size:13px;font-weight:500;margin-bottom:3px"},q.q));
    if(!ok)info.appendChild(h("div",{style:"font-size:12px;color:#e74c3c"},"Risposta data: "+(q.opts[state.answers[i]]||"Non risposta")));
    info.appendChild(h("div",{style:"font-size:12px;color:#27ae60"},"Corretta: "+q.opts[q.a]));
    row.appendChild(info);
    row.appendChild(h("span",{style:"font-size:11px;padding:2px 8px;border-radius:6px;background:#f0f0f0;color:#666;white-space:nowrap"},CAT_LABELS[q.cat]));
    card.appendChild(row);frag.appendChild(card);
  });
  const btnRow=h("div",{className:"btn-row"});
  btnRow.appendChild(h("button",{className:"btn-secondary",onClick:()=>window.print()},"Stampa / Salva PDF"));
  btnRow.appendChild(h("button",{className:"btn-primary",onClick:()=>{clearInterval(timerInterval);state={phase:"intro",form:{nome:"",cognome:"",data:""},questions:[],current:0,answers:{},chosen:null,score:0,code:genCode(),emailStatus:"idle",timeLeft:TOTAL_TIME};render();}},">  Nuovo test"));
  frag.appendChild(btnRow);
  return frag;
}

render();
</script>
