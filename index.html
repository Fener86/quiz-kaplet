<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Valutation — Kaplet</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',sans-serif;background:#f7f8fc;color:#1a1a2e;min-height:100vh}

/* HEADER */
.header{background:#fff;border-bottom:1px solid #e8eaf0;padding:0 2.5rem;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-logo{display:flex;align-items:center;gap:14px}
.header-badge{font-size:11px;font-weight:600;color:#0D1B6E;background:#e8ecf8;padding:5px 14px;border-radius:999px;letter-spacing:1px;text-transform:uppercase}

/* WRAP */
.wrap{max-width:720px;margin:0 auto;padding:2.5rem 1.5rem 4rem}

/* INTRO PAGE */
.intro-hero{text-align:center;padding:2.5rem 0 2rem}
.intro-hero .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#0D1B6E;background:#e8ecf8;padding:5px 16px;border-radius:999px;margin-bottom:20px}
.intro-hero h1{font-size:32px;font-weight:700;color:#0D1B6E;line-height:1.2;margin-bottom:12px}
.intro-hero p{font-size:16px;color:#555;line-height:1.7;max-width:520px;margin:0 auto}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:2rem 0}
.intro-card{background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:1.25rem 1.5rem;display:flex;gap:14px;align-items:flex-start}
.intro-card-icon{width:40px;height:40px;border-radius:10px;background:#e8ecf8;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.intro-card-text h3{font-size:14px;font-weight:600;color:#0D1B6E;margin-bottom:4px}
.intro-card-text p{font-size:13px;color:#666;line-height:1.6}
.warning-strip{background:#fff8e1;border:1px solid #ffe082;border-left:4px solid #f59e0b;border-radius:8px;padding:1rem 1.25rem;font-size:13px;color:#7a5100;line-height:1.6;margin-bottom:2rem}
.warning-strip strong{font-weight:600}
.cta-center{text-align:center}

/* FORM PAGE */
.form-card{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2rem;margin-bottom:1.5rem}
.form-card h2{font-size:20px;font-weight:700;color:#0D1B6E;margin-bottom:6px}
.form-card .sub{font-size:14px;color:#888;margin-bottom:1.5rem}
.field{margin-bottom:16px}
.field label{font-size:13px;font-weight:500;color:#444;display:block;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1.5px solid #dde1ef;border-radius:8px;font-size:14px;font-family:'Roboto',sans-serif;color:#1a1a2e;background:#fff;transition:border-color 0.2s}
.field input:focus{outline:none;border-color:#0D1B6E}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;font-family:'Roboto',sans-serif;cursor:pointer;transition:all 0.2s;border:none}
.btn-primary{background:#0D1B6E;color:#fff}
.btn-primary:hover{background:#0a1558}
.btn-outline{background:#fff;color:#0D1B6E;border:1.5px solid #0D1B6E}
.btn-outline:hover{background:#e8ecf8}
.btn-lg{padding:14px 36px;font-size:15px;border-radius:10px}

/* ERRORS */
.err{font-size:13px;color:#c0392b;margin-top:8px;display:none}

/* QUIZ */
.quiz-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.quiz-name{font-size:14px;color:#666;font-weight:400}
.quiz-right{display:flex;align-items:center;gap:12px}
.quiz-counter{font-size:13px;color:#999}
.timer{font-size:14px;font-weight:700;padding:6px 14px;border-radius:8px;border:2px solid #0D1B6E;color:#0D1B6E;background:#e8ecf8;font-family:'Roboto',sans-serif}
.timer.warn{border-color:#d97706;color:#d97706;background:#fff8e1}
.timer.danger{border-color:#dc2626;color:#dc2626;background:#fef2f2}
.prog-wrap{height:4px;background:#e8eaf0;border-radius:2px;margin-bottom:2rem;overflow:hidden}
.prog-fill{height:100%;background:#0D1B6E;border-radius:2px;transition:width 0.4s}
.q-card{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2rem}
.q-cat-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0D1B6E;background:#e8ecf8;padding:4px 12px;border-radius:999px;margin-bottom:16px}
.q-text{font-size:16px;font-weight:500;color:#1a1a2e;line-height:1.6;margin-bottom:1.5rem}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:10px;background:#f7f8fc;border:1.5px solid #e8eaf0;border-radius:10px;font-size:14px;font-family:'Roboto',sans-serif;color:#1a1a2e;cursor:pointer;transition:all 0.15s;font-weight:400}
.opt:hover:not(:disabled){background:#e8ecf8;border-color:#0D1B6E}
.opt.correct{background:#f0fdf4;border-color:#16a34a;color:#15803d;font-weight:500}
.opt.wrong{background:#fef2f2;border-color:#dc2626;color:#b91c1c;font-weight:500}
.opt:disabled{cursor:default}
.feedback{font-size:13px;color:#444;margin-top:14px;padding:12px 16px;background:#f7f8fc;border-radius:10px;border-left:4px solid #0D1B6E;line-height:1.7}
.feedback.ok{border-left-color:#16a34a;background:#f0fdf4;color:#166534}
.feedback.ko{border-left-color:#dc2626;background:#fef2f2;color:#991b1b}
.nav-row{display:flex;justify-content:flex-end;margin-top:1.5rem}

/* RESULT */
.result-hero{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1.5rem}
.result-code{font-size:12px;color:#aaa;margin-bottom:6px;letter-spacing:1px}
.result-name{font-size:17px;font-weight:600;color:#1a1a2e;margin-bottom:2px}
.result-date{font-size:13px;color:#aaa;margin-bottom:20px}
.result-score{font-size:56px;font-weight:700;color:#0D1B6E;line-height:1}
.result-score span{font-size:30px;color:#aaa;font-weight:400}
.result-pct{font-size:14px;color:#888;margin-top:6px}
.verdict-pill{display:inline-block;margin-top:16px;padding:10px 28px;border-radius:999px;font-size:17px;font-weight:700}
.verdict-desc{font-size:14px;color:#555;margin-top:10px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto}
.verdict-scale{font-size:11px;color:#bbb;margin-top:10px;letter-spacing:0.5px}
.email-banner{margin-top:18px;font-size:13px;padding:10px 18px;border-radius:8px;display:inline-block;font-weight:500}
.eb-sending{background:#e8ecf8;color:#0D1B6E}
.eb-sent{background:#f0fdf4;color:#15803d}
.eb-error{background:#fef2f2;color:#b91c1c}

.cat-section{margin-bottom:1.5rem}
.sec-label{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin-bottom:10px}
.cat-grid{display:flex;gap:10px;flex-wrap:wrap}
.cat-pill{flex:1;min-width:120px;background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:12px 14px;text-align:center}
.cat-pill .cl{font-size:11px;color:#aaa;font-weight:500}
.cat-pill .cv{font-size:22px;font-weight:700;color:#0D1B6E;margin-top:4px}

.review-list{display:flex;flex-direction:column;gap:10px;margin-bottom:2rem}
.review-item{background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:1rem 1.25rem;display:flex;gap:10px;align-items:flex-start}
.ri-icon{font-size:14px;font-weight:700;min-width:20px;margin-top:1px}
.ri-ok{color:#16a34a}
.ri-err{color:#dc2626}
.ri-body{flex:1}
.ri-q{font-size:13px;font-weight:500;color:#1a1a2e;margin-bottom:4px}
.ri-wrong{font-size:12px;color:#dc2626;margin-bottom:2px}
.ri-right{font-size:12px;color:#16a34a}
.ri-cat{font-size:11px;padding:2px 10px;border-radius:999px;background:#e8ecf8;color:#0D1B6E;white-space:nowrap;font-weight:500;align-self:flex-start;flex-shrink:0}

.btn-row{display:flex;gap:12px;justify-content:center;margin-top:2rem;flex-wrap:wrap}

/* FOOTER */
.footer{text-align:center;padding:2rem 0 1rem;font-size:12px;color:#ccc}

@media(max-width:600px){.intro-grid{grid-template-columns:1fr}.btn-row{flex-direction:column;align-items:center}}
@media print{.header,.btn-row,.timer,.prog-wrap,.footer{display:none}body{background:#fff}.wrap{padding:1rem}}
</style>
</head>

<script>
const EMAILJS_SERVICE="service_it8h9pa";
const EMAILJS_TEMPLATE="template_ylarf5y";
const EMAILJS_KEY="BFRiR1c_sncLKV-cp";
const TOTAL_TIME=30*60;

const NETWORKING_Q=[
  {cat:"Networking",q:"Cosa identifica un indirizzo IP all'interno di una rete?",opts:["Un dispositivo connesso alla rete","Il produttore della scheda di rete","La velocità massima di connessione","Il protocollo di trasmissione usato"],a:0,exp:"L'indirizzo IP identifica univocamente un dispositivo all'interno di una rete, permettendo la comunicazione tra dispositivi diversi."},
  {cat:"Networking",q:"Quanti bit compongono un indirizzo IPv4?",opts:["16 bit","32 bit","64 bit","128 bit"],a:1,exp:"IPv4 utilizza indirizzi a 32 bit, rappresentati come 4 ottetti decimali separati da punti (es. 192.168.1.1)."},
  {cat:"Networking",q:"Quanti bit compongono un indirizzo IPv6?",opts:["32 bit","64 bit","128 bit","256 bit"],a:2,exp:"IPv6 utilizza indirizzi a 128 bit, scritti in notazione esadecimale separata da due punti."},
  {cat:"Networking",q:"Quale dei seguenti è un indirizzo IP privato appartenente alla classe A?",opts:["192.168.1.1","172.16.0.1","10.0.0.1","8.8.8.8"],a:2,exp:"Il range 10.0.0.0/8 è il blocco di indirizzi privati di classe A definito dalla RFC 1918."},
  {cat:"Networking",q:"Quale dei seguenti è un indirizzo IP privato appartenente alla classe C?",opts:["10.0.0.1","172.16.0.1","192.168.1.1","169.254.1.1"],a:2,exp:"Il range 192.168.0.0/16 è riservato alle reti private di classe C secondo RFC 1918."},
  {cat:"Networking",q:"Cosa si intende per indirizzo IP pubblico?",opts:["Un IP usato esclusivamente in rete locale","Un IP instradabile e raggiungibile da Internet","Un IP assegnato automaticamente dal router","Un IP riservato al broadcast di rete"],a:1,exp:"Un IP pubblico è un indirizzo instradabile su Internet, assegnato da un ISP o da un registro regionale."},
  {cat:"Networking",q:"Qual è l'indirizzo di loopback standard in IPv4?",opts:["192.168.0.1","0.0.0.0","255.255.255.255","127.0.0.1"],a:3,exp:"127.0.0.1 (localhost) è l'indirizzo di loopback: qualsiasi traffico inviato a questo indirizzo non lascia mai il dispositivo."},
  {cat:"Networking",q:"Cosa indica esattamente il prefisso /24 nella notazione CIDR?",opts:["Il numero massimo di host disponibili","I primi 24 bit dell'indirizzo identificano la rete","Il numero di reti disponibili","I byte di payload del pacchetto"],a:1,exp:"In notazione CIDR, /24 significa che i primi 24 bit identificano la rete, lasciando 8 bit per gli indirizzi host."},
  {cat:"Networking",q:"Qual è l'indirizzo di broadcast di una rete con range 192.168.1.0/24?",opts:["192.168.1.0","192.168.1.1","192.168.1.254","192.168.1.255"],a:3,exp:"L'indirizzo broadcast è sempre l'ultimo indirizzo della sottorete, con tutti i bit host impostati a 1."},
  {cat:"Networking",q:"Cosa si intende con il termine APIPA (Automatic Private IP Addressing)?",opts:["IP assegnato da un server DHCP remoto","IP auto-assegnato nel range 169.254.x.x in assenza di server DHCP","IP riservato esclusivamente ai server aziendali","IP utilizzato per le comunicazioni multicast"],a:1,exp:"APIPA assegna automaticamente un IP nel range 169.254.0.0/16 quando il client non riesce a raggiungere un server DHCP."},
  {cat:"Networking",q:"A quale range di indirizzi appartengono gli indirizzi multicast in IPv4?",opts:["10.0.0.0 - 10.255.255.255","172.16.0.0 - 172.31.255.255","224.0.0.0 - 239.255.255.255","240.0.0.0 - 255.255.255.255"],a:2,exp:"Il range 224.0.0.0 - 239.255.255.255 è riservato agli indirizzi multicast IPv4, classificati come classe D."},
  {cat:"Networking",q:"Cosa fa il NAT (Network Address Translation)?",opts:["Cifra il traffico di rete tra due endpoint","Traduce indirizzi IP privati in IP pubblici per accedere a Internet","Definisce percorsi statici nelle tabelle di routing","Assegna indirizzi MAC univoci ai dispositivi"],a:1,exp:"Il NAT traduce gli indirizzi IP privati della rete locale in uno o più IP pubblici, permettendo a più dispositivi di condividere una singola connessione Internet."},
  {cat:"Networking",q:"Cosa rappresenta il campo TTL (Time To Live) in un pacchetto IP?",opts:["Il tempo totale di latenza della connessione","Il numero massimo di hop che il pacchetto può attraversare prima di essere scartato","Il tipo di protocollo incapsulato nel pacchetto","La dimensione massima consentita per il pacchetto"],a:1,exp:"TTL è un contatore decrementato di 1 da ogni router attraversato. Quando raggiunge 0 il pacchetto viene scartato, evitando loop di routing infiniti."},
  {cat:"Networking",q:"Quanti indirizzi IP totali (inclusi rete e broadcast) contiene una rete /28?",opts:["8","16","32","64"],a:1,exp:"Una rete /28 lascia 4 bit per gli host: 2^4 = 16 indirizzi totali, di cui 14 utilizzabili per gli host."},
  {cat:"Networking",q:"Qual è lo scopo principale della subnet mask in una configurazione di rete?",opts:["Filtrare il traffico indesiderato proveniente da Internet","Separare la parte di rete dalla parte host dell'indirizzo IP","Assegnare automaticamente gli IP ai dispositivi della rete","Cifrare i dati trasmessi tra due host"],a:1,exp:"La subnet mask, applicata con un AND logico all'indirizzo IP, consente di separare la porzione di rete dalla porzione host."},
  {cat:"Networking",q:"Quale subnet mask in formato decimale corrisponde al prefisso /24?",opts:["255.0.0.0","255.255.0.0","255.255.255.0","255.255.255.255"],a:2,exp:"255.255.255.0 ha esattamente 24 bit impostati a 1, corrispondente al prefisso /24 nella notazione CIDR."},
  {cat:"Networking",q:"Quanti host sono effettivamente utilizzabili in una rete con prefisso /24?",opts:["256","255","254","128"],a:2,exp:"Una rete /24 contiene 256 indirizzi totali. Sottraendo 1 per la rete e 1 per il broadcast rimangono 254 host utilizzabili."},
  {cat:"Networking",q:"In una rete 192.168.1.0/25, quanti host sono effettivamente utilizzabili?",opts:["126","128","254","62"],a:0,exp:"Con /25 rimangono 7 bit per gli host: 2^7 = 128 indirizzi totali. Sottraendo rete e broadcast = 126 host utilizzabili."},
  {cat:"Networking",q:"Qual è la caratteristica principale di una rete con notazione 192.168.10.0/30?",opts:["Contiene 30 host utilizzabili","Contiene solo 2 host utilizzabili, ideale per link punto-punto","Contiene 254 host utilizzabili come una /24","È un indirizzo di loopback esteso"],a:1,exp:"Una rete /30 ha 4 indirizzi totali: 1 indirizzo di rete, 1 broadcast e 2 host utilizzabili. È lo standard per i link punto-punto tra router."},
  {cat:"Networking",q:"Qual è la funzione principale del default gateway in una rete locale?",opts:["Fornire indirizzi IP ai client tramite DHCP","Instradare il traffico destinato a reti diverse da quella locale","Risolvere i nomi di dominio in indirizzi IP","Proteggere la rete locale da accessi non autorizzati"],a:1,exp:"Il default gateway è il router a cui vengono inviati tutti i pacchetti destinati a reti diverse da quella locale, fungendo da 'porta di uscita'."},
  {cat:"Networking",q:"Su quale livello del modello OSI operano tipicamente i router?",opts:["Livello 1 — Fisico","Livello 2 — Data Link","Livello 3 — Rete","Livello 4 — Trasporto"],a:2,exp:"I router operano al livello 3 (Rete) del modello OSI, analizzando gli indirizzi IP per prendere decisioni di instradamento."},
  {cat:"Networking",q:"Quale comando Windows permette di visualizzare l'indirizzo del default gateway configurato?",opts:["ping gateway","ipconfig","netstat -r","tracert 8.8.8.8"],a:1,exp:"Il comando 'ipconfig' mostra la configurazione completa delle interfacce di rete del sistema, incluso il default gateway."},
  {cat:"Networking",q:"Qual è la funzione principale del protocollo DNS?",opts:["Assegnare automaticamente indirizzi IP ai dispositivi","Tradurre i nomi di dominio leggibili in indirizzi IP numerici","Cifrare il traffico tra browser e server web","Instradare i pacchetti tra reti diverse"],a:1,exp:"Il DNS (Domain Name System) è il sistema che traduce i nomi di dominio (es. google.com) nei corrispondenti indirizzi IP."},
  {cat:"Networking",q:"Su quale porta di trasporto opera il protocollo DNS per le query standard?",opts:["Porta TCP 80","Porta TCP 443","Porta UDP 53","Porta TCP 25"],a:2,exp:"Il DNS utilizza la porta UDP 53 per le query standard di risoluzione dei nomi. Usa TCP 53 per i trasferimenti di zona."},
  {cat:"Networking",q:"Qual è il ruolo di un server DHCP in una rete?",opts:["Tradurre i nomi di dominio in indirizzi IP","Assegnare automaticamente IP, subnet mask, gateway e DNS ai client","Filtrare il traffico in ingresso e in uscita","Autenticare gli utenti prima dell'accesso alla rete"],a:1,exp:"Il server DHCP (Dynamic Host Configuration Protocol) assegna dinamicamente ai client tutti i parametri di configurazione di rete necessari."},
  {cat:"Networking",q:"Qual è il primo messaggio inviato da un client per iniziare la procedura di assegnazione DHCP?",opts:["DHCP Offer","DHCP Request","DHCP Discover","DHCP Acknowledge"],a:2,exp:"Il client invia un DHCP Discover in broadcast per segnalare la propria presenza e trovare i server DHCP disponibili nella rete."},
  {cat:"Networking",q:"Cos'è un indirizzo MAC e a cosa serve?",opts:["Un indirizzo IP privato usato in reti locali","Un identificatore hardware univoco a 48 bit assegnato alla scheda di rete","Il nome del dispositivo assegnato durante la configurazione","Il numero di serie del router o switch a cui è connesso il dispositivo"],a:1,exp:"Il MAC (Media Access Control) address è un identificatore hardware a 48 bit assegnato in fabbrica alla scheda di rete, usato per la comunicazione al livello Data Link."},
  {cat:"Networking",q:"Cosa testa e misura il comando ping?",opts:["La velocità massima della connessione internet","La raggiungibilità di un host remoto e il tempo di risposta in millisecondi","L'apertura o la chiusura delle porte TCP di un host","La corretta configurazione del server DNS"],a:1,exp:"Il comando ping invia pacchetti ICMP Echo Request e misura il tempo di risposta (RTT), verificando se un host è raggiungibile."},
  {cat:"Networking",q:"Cos'è una VLAN e qual è il suo principale vantaggio?",opts:["Una rete wireless virtuale che non richiede access point fisici","Una segmentazione logica di una rete fisica in più reti virtuali separate","Un tipo di cavo Ethernet schermato per alte velocità","Un protocollo di routing per reti geograficamente distribuite"],a:1,exp:"Una VLAN (Virtual LAN) permette di suddividere logicamente una rete fisica in più reti separate, migliorando sicurezza, gestibilità e performance."},
  {cat:"Networking",q:"Quanti livelli compone il modello OSI (Open Systems Interconnection)?",opts:["4 livelli","5 livelli","7 livelli","10 livelli"],a:2,exp:"Il modello OSI è composto da 7 livelli: Fisico, Data Link, Rete, Trasporto, Sessione, Presentazione e Applicazione."},
  {cat:"Networking",q:"Qual è la differenza fondamentale tra i protocolli TCP e UDP?",opts:["TCP è più veloce di UDP grazie alla compressione dei dati","TCP garantisce la consegna ordinata con controllo degli errori; UDP è più veloce ma senza garanzie","UDP è un protocollo obsoleto sostituito da TCP","Non esiste differenza sostanziale tra i due protocolli"],a:1,exp:"TCP offre connessione affidabile con handshake, controllo degli errori e ritrasmissione; UDP è connectionless, più veloce ma senza garanzie di consegna."},
  {cat:"Networking",q:"Su quale porta TCP opera il protocollo HTTP per le connessioni non cifrate?",opts:["Porta TCP 21","Porta TCP 25","Porta TCP 80","Porta TCP 443"],a:2,exp:"Il protocollo HTTP (HyperText Transfer Protocol) opera sulla porta TCP 80 per le connessioni non cifrate."},
  {cat:"Networking",q:"Su quale porta TCP opera il protocollo HTTPS per le connessioni cifrate?",opts:["Porta TCP 80","Porta TCP 443","Porta TCP 8080","Porta TCP 8443"],a:1,exp:"HTTPS (HTTP Secure) opera sulla porta TCP 443, cifrando il traffico tramite il protocollo TLS."},
  {cat:"Networking",q:"Qual è la funzione principale del protocollo ARP (Address Resolution Protocol)?",opts:["Tradurre nomi di dominio in indirizzi IP","Assegnare indirizzi IP dinamici ai dispositivi","Risolvere un indirizzo IP in un indirizzo MAC nella stessa rete locale","Cifrare il traffico tra due host della stessa rete"],a:2,exp:"ARP risolve un indirizzo IP noto in un indirizzo MAC, consentendo la comunicazione al livello Data Link nella stessa rete locale."},
  {cat:"Networking",q:"Cosa mostra il comando tracert (Windows) o traceroute (Linux/Mac)?",opts:["La velocità attuale della connessione internet","Il percorso completo dei pacchetti, hop per hop, verso la destinazione con i relativi tempi","Il risultato della risoluzione DNS di un hostname","L'elenco delle porte TCP aperte su un host remoto"],a:1,exp:"Tracert/traceroute mostra ogni router attraversato (hop) e il relativo tempo di risposta per raggiungere la destinazione."},
  {cat:"Networking",q:"Quale subnet mask in formato decimale corrisponde al prefisso /16?",opts:["255.255.0.0","255.255.255.0","255.0.0.0","255.255.255.128"],a:0,exp:"255.255.0.0 ha esattamente 16 bit impostati a 1, corrispondente al prefisso /16 nella notazione CIDR."},
  {cat:"Networking",q:"Cos'è una DMZ (DeMilitarized Zone) in un'architettura di rete aziendale?",opts:["Una zona della LAN completamente priva di access point wireless","Una sottorete separata che espone servizi pubblici riducendo il rischio per la rete interna","Un tipo di connessione VPN tra due sedi remote","Un protocollo per la ridondanza dei link di rete"],a:1,exp:"La DMZ è una sottorete intermedia tra Internet e la rete interna, dove si collocano server pubblici (web, mail, FTP) per minimizzare il rischio."},
  {cat:"Networking",q:"Quale comando Windows permette di svuotare la cache DNS locale?",opts:["ipconfig /flushdns","nslookup /clearcache","netstat -flush","ping /cleardns"],a:0,exp:"Il comando 'ipconfig /flushdns' svuota la cache del resolver DNS locale di Windows, forzando nuove query DNS."},
  {cat:"Networking",q:"Qual è la funzione del protocollo ICMP (Internet Control Message Protocol)?",opts:["Trasferire file tra host su reti diverse","Inviare messaggi di controllo, diagnostica ed errore relativi alla rete IP","Assegnare indirizzi IP ai dispositivi della rete","Cifrare le comunicazioni tra due endpoint di rete"],a:1,exp:"ICMP è usato per messaggi diagnostici e di errore come quelli generati da ping (Echo Request/Reply) e traceroute."},
  {cat:"Networking",q:"Quale subnet mask in formato decimale corrisponde al prefisso /8?",opts:["255.255.255.0","255.255.0.0","255.0.0.0","255.128.0.0"],a:2,exp:"255.0.0.0 ha esattamente 8 bit impostati a 1, corrispondente al prefisso /8 in CIDR (tipico delle reti di classe A)."},
  {cat:"Networking",q:"Quante sottoreti /26 si possono ottenere suddividendo una rete /24?",opts:["2 sottoreti","4 sottoreti","8 sottoreti","16 sottoreti"],a:1,exp:"Passando da /24 a /26 si aggiungono 2 bit di rete: 2^2 = 4 sottoreti /26, ciascuna con 62 host utilizzabili."},
];

const ENGLISH_Q=[
  {cat:"Inglese Tecnico",q:"What does 'IP address' stand for and what is its purpose?",opts:["Internet Protocol address — it identifies a device on a network","Internal Protocol address — it encrypts network communications","Input Protocol address — it controls data flow","Interface Protocol address — it defines connection speed"],a:0,exp:"IP stands for Internet Protocol. An IP address uniquely identifies a device on a network."},
  {cat:"Inglese Tecnico",q:"What is a 'subnet mask' used for in network configuration?",opts:["To encrypt all traffic between two hosts","To separate the network portion from the host portion of an IP address","To automatically assign IP addresses to devices","To filter unwanted web content"],a:1,exp:"A subnet mask distinguishes the network part from the host part of an IP address using a bitwise AND operation."},
  {cat:"Inglese Tecnico",q:"What does the acronym 'DHCP' stand for?",opts:["Dynamic Host Configuration Protocol","Direct Host Connection Protocol","Dynamic Host Control Program","Distributed Host Communication Protocol"],a:0,exp:"DHCP stands for Dynamic Host Configuration Protocol. It automatically assigns IP addresses and network parameters to clients."},
  {cat:"Inglese Tecnico",q:"What does the term 'troubleshoot' mean in an IT context?",opts:["To install new software on a workstation","To systematically identify, diagnose and resolve technical problems","To upgrade hardware components to newer versions","To create a backup of important data"],a:1,exp:"Troubleshooting is the systematic process of identifying the root cause of a problem and applying the appropriate fix."},
  {cat:"Inglese Tecnico",q:"What does 'VPN' stand for and what is it used for?",opts:["Virtual Private Network — creates a secure encrypted connection over the internet","Very Protected Node — a type of secure server","Virtual Protocol Network — a network routing standard","Verified Private Node — an authentication system"],a:0,exp:"VPN stands for Virtual Private Network. It creates an encrypted tunnel over the internet, enabling secure remote access."},
  {cat:"Inglese Tecnico",q:"What is 'latency' in the context of network performance?",opts:["The maximum theoretical speed of a network connection","The time delay between sending a packet and receiving a response","The number of packets lost during transmission","The encryption level applied to a connection"],a:1,exp:"Latency is the round-trip delay in data communication, typically measured in milliseconds. High latency causes sluggish response times."},
  {cat:"Inglese Tecnico",q:"What does 'escalate' mean in the context of IT support?",opts:["To immediately close a support ticket","To transfer an unresolved issue to a higher level of technical support","To assign a ticket to a colleague at the same support level","To mark a ticket as low priority and schedule it for later"],a:1,exp:"Escalating means passing an issue to a higher tier of support because the current level lacks the expertise or tools to resolve it."},
  {cat:"Inglese Tecnico",q:"What does 'uptime' refer to in IT infrastructure?",opts:["The average time needed to restart a server after a failure","The continuous period during which a system is fully operational and available","The speed of the internet connection in normal working hours","The time required to configure a new network device"],a:1,exp:"Uptime is the duration a system has been continuously running and available. High uptime percentages (e.g. 99.9%) indicate reliable infrastructure."},
  {cat:"Inglese Tecnico",q:"What does it mean to 'deploy' a system or application?",opts:["To test software in an isolated development environment","To release and make a system or application available for production use","To permanently remove outdated software from a server","To create an encrypted backup of a server"],a:1,exp:"Deploying means releasing software or infrastructure into a production environment so it is available for end users."},
  {cat:"Inglese Tecnico",q:"What is a 'backup' and why is it important?",opts:["A process that removes old files to free disk space","A copy of data stored separately to enable recovery in case of loss or corruption","A method to increase the bandwidth of a network connection","An automatic procedure to restart a service after a failure"],a:1,exp:"A backup is a copy of data stored in a separate location. It is essential for disaster recovery and business continuity."},
  {cat:"Inglese Tecnico",q:"What is the role of a 'firewall' in a network infrastructure?",opts:["A device that amplifies Wi-Fi signal in large buildings","A security system that monitors and controls incoming and outgoing network traffic","A physical barrier that separates network cable runs","A protocol that handles file transfers between remote servers"],a:1,exp:"A firewall enforces security policies by inspecting and filtering network traffic, blocking unauthorized access and threats."},
  {cat:"Inglese Tecnico",q:"What does it mean to 'configure' a device or application?",opts:["To physically install new hardware components","To set up and adjust settings so a device or application works as required","To repair a device that has stopped functioning","To monitor network traffic in real time"],a:1,exp:"Configuring means adjusting the parameters and settings of hardware or software to meet operational requirements."},
  {cat:"Inglese Tecnico",q:"What is 'bandwidth' in networking?",opts:["The physical length of a network cable between two devices","The maximum data transfer rate of a network connection","The total number of devices connected to a network","The encryption strength applied to a secure connection"],a:1,exp:"Bandwidth is the maximum data transfer capacity of a network link, typically measured in Mbps or Gbps."},
  {cat:"Inglese Tecnico",q:"What is a 'patch' in IT and why is it applied?",opts:["A physical repair splice used on damaged network cables","A software update that fixes bugs, security vulnerabilities or improves performance","A type of detailed network topology diagram","A configuration file used to restore a previous system state"],a:1,exp:"A patch is a targeted software update that addresses specific bugs or security vulnerabilities without replacing the entire application."},
  {cat:"Inglese Tecnico",q:"What is an IT 'log' and what is it used for?",opts:["A printed inventory of all hardware components in a data center","A file that automatically records events, errors and activities in a system","A physical cable management document for network racks","A complete backup of the operating system and its configuration"],a:1,exp:"A log file records timestamped events, errors and activities generated by systems and applications, and is essential for troubleshooting and auditing."},
  {cat:"Inglese Tecnico",q:"What does it mean to 'prioritize' tasks effectively in a work environment?",opts:["To handle all tasks simultaneously regardless of urgency or importance","To identify the most important and urgent tasks and address them first","To delegate all tasks to colleagues to avoid delays","To permanently ignore tasks that are rated as low priority"],a:1,exp:"Prioritizing means assessing tasks by urgency and importance, then allocating time and effort to address the most critical ones first."},
  {cat:"Inglese Tecnico",q:"What does 'remote access' mean and when is it used?",opts:["Physically accessing a device in a server room during off-hours","The ability to connect to and control a computer or network from a different location","A specific type of VPN protocol used for site-to-site connections","A method for encrypting emails between remote offices"],a:1,exp:"Remote access allows technicians and users to connect to systems from different physical locations, enabling support and work flexibility."},
  {cat:"Inglese Tecnico",q:"What does 'redundancy' mean in network design?",opts:["Having duplicate components or paths to maintain availability if one fails","Removing unused or inactive network devices to simplify management","Compressing transmitted data to reduce bandwidth consumption","Encrypting all network traffic regardless of sensitivity"],a:0,exp:"Redundancy means building in backup components or paths so the network continues operating even if a failure occurs."},
  {cat:"Inglese Tecnico",q:"A colleague tells you: 'The server is down and I cannot reach it remotely.' What is your first step?",opts:["Immediately reboot your own workstation","Check whether the issue affects other users and verify basic network connectivity","Call the internet service provider immediately","Reinstall the server operating system remotely"],a:1,exp:"Before acting, always check the scope of the issue: is it isolated or widespread? Verify connectivity first to narrow down the root cause."},
  {cat:"Inglese Tecnico",q:"What does 'proactive' mean in a professional IT context?",opts:["Waiting for problems to arise before taking any action","Anticipating potential issues and taking initiative without being asked","Doing only what is explicitly requested in a job description","Avoiding responsibilities that fall outside your defined role"],a:1,exp:"Being proactive means identifying potential problems before they occur and taking initiative to prevent or mitigate them."},
  {cat:"Inglese Tecnico",q:"What does it mean to 'document' work in IT?",opts:["To permanently delete old configuration files from the system","To write down technical details, procedures and changes for future reference","To encrypt all sensitive data before transmitting it","To create a complete backup of a production server"],a:1,exp:"Documentation means recording technical information, configurations and changes in a clear and accessible way so others can understand and reproduce them."},
  {cat:"Inglese Tecnico",q:"A client reports: 'My internet connection is very slow only in the afternoon.' What is the most likely cause?",opts:["The router hardware has developed a fault","Network congestion during peak usage hours","The client's computer is infected with malware","The ethernet cable has been physically damaged"],a:1,exp:"Slowness that occurs only at specific times typically indicates bandwidth saturation or network congestion during peak hours."},
  {cat:"Inglese Tecnico",q:"What does 'SLA' stand for and what does it define?",opts:["System Level Authorization — defines who can access a system","Service Level Agreement — defines the expected service quality between provider and client","Software License Activation — a method for software validation","Standard Login Access — the default credentials for a system"],a:1,exp:"SLA stands for Service Level Agreement, a formal contract that defines expected service levels such as uptime, response time and support availability."},
  {cat:"Inglese Tecnico",q:"What does it mean to 'roll back' a change in IT?",opts:["To apply the next scheduled software update","To revert a system to its previous stable state after a failed change","To permanently delete a configuration file","To restart all affected services after a maintenance window"],a:1,exp:"Rolling back means restoring the system to the state it was in before a change was applied, typically done when a change causes problems."},
  {cat:"Inglese Tecnico",q:"What is 'throughput' and how does it differ from bandwidth?",opts:["Throughput is identical to bandwidth and the two terms are interchangeable","Throughput is the actual data transfer rate achieved, which may be lower than the theoretical bandwidth","Throughput refers to the encryption speed of a VPN connection","Throughput is the number of simultaneous connections a server can handle"],a:1,exp:"While bandwidth is the theoretical maximum capacity, throughput is the actual data transfer rate achieved in real conditions."},
  {cat:"Inglese Tecnico",q:"What does 'downtime' mean and why is it critical to minimize it?",opts:["The time a server takes to reboot after applying an update","The period when a system is unavailable due to failure or maintenance","The scheduled window for applying software patches","The time required to deploy a new application version"],a:1,exp:"Downtime is the period during which a system is unavailable. Minimizing it is critical to business continuity and user productivity."},
  {cat:"Inglese Tecnico",q:"What is a 'workaround' in IT support?",opts:["A permanent and definitive fix applied to resolve a technical problem","A temporary solution that enables work to continue while the permanent fix is being developed","A method used to bypass security controls for testing purposes","An automated script that handles repetitive maintenance tasks"],a:1,exp:"A workaround is a temporary measure that allows operations to continue while the root cause is being investigated and permanently resolved."},
  {cat:"Inglese Tecnico",q:"What does 'end user' mean in IT?",opts:["The IT technician responsible for maintaining the system","The person who uses a system or application in their daily work","The software developer who designed and built the application","The manager who approved the budget for the technology purchase"],a:1,exp:"An end user is the person who actually uses a system or application, as opposed to the IT professionals who build or manage it."},
  {cat:"Inglese Tecnico",q:"What does 'network segmentation' achieve?",opts:["It physically cuts a network into isolated segments using cable splitters","It divides a network into smaller logical parts to improve security and performance","It combines multiple networks into a single larger unified network","It encrypts all traffic traveling between network segments"],a:1,exp:"Network segmentation divides a network into smaller, controlled zones to limit the blast radius of security incidents and improve performance."},
  {cat:"Inglese Tecnico",q:"In a professional context, what does 'accountability' mean?",opts:["Avoiding responsibility when something goes wrong","Taking ownership of your actions and their outcomes, including mistakes","Delegating all responsibility to your team manager","Only being responsible for tasks explicitly listed in your job description"],a:1,exp:"Accountability means taking ownership of your work and its results, being transparent about mistakes and committed to resolving them."},
  {cat:"Inglese Tecnico",q:"What does it mean to 'escalate' a problem to management?",opts:["To resolve the problem independently without informing anyone","To inform your manager or a higher authority when a problem exceeds your ability to resolve it","To transfer the problem to a colleague at the same level","To document the problem and close the ticket without resolving it"],a:1,exp:"Escalating to management means proactively communicating when a problem requires resources, expertise or authority beyond your own."},
];

const LOGIC_Q=[
  {cat:"Problem Solving",q:"Un utente ti chiama e dice: non riesco ad aprire nessun sito web, ma la rete funziona. Qual è la prima cosa che controlli?",opts:["Riavvii subito il router senza fare altre verifiche","Controlli la configurazione DNS del client e testi la risoluzione con nslookup","Reinstalli il browser dell'utente","Chiami direttamente il provider internet"],a:1,exp:"Se la rete funziona (ping 8.8.8.8 risponde) ma i siti non si aprono, il problema è quasi certamente nella risoluzione DNS. Verificare prima la configurazione DNS è il passo corretto."},
  {cat:"Problem Solving",q:"Devi configurare 10 PC in una nuova rete aziendale. Quale approccio garantisce efficienza e coerenza?",opts:["Configurare ogni PC manualmente uno per uno con IP statici","Implementare un server DHCP per automatizzare l'assegnazione di IP e parametri di rete","Assegnare lo stesso indirizzo IP a tutti i PC","Collegare tutti i PC con un hub invece di uno switch"],a:1,exp:"Il DHCP centralizza e automatizza la configurazione di rete, riducendo il rischio di errori e il tempo necessario rispetto alla configurazione manuale."},
  {cat:"Problem Solving",q:"Stai lavorando su un problema tecnico complesso che non riesci a risolvere dopo 2 ore di tentativi. Cosa fai?",opts:["Continui a provare da solo senza informare nessuno, per non sembrare incompetente","Chiedi aiuto a un collega più esperto, documenti il problema e l'approccio seguito","Dici al cliente che il problema non è risolvibile","Aspetti che il problema si risolva spontaneamente"],a:1,exp:"Saper riconoscere i propri limiti e chiedere supporto è una qualità professionale. Documentare il problema accelera la risoluzione e condivide la conoscenza."},
  {cat:"Problem Solving",q:"Due workstation nella stessa rete hanno lo stesso indirizzo IP configurato. Quale problema tecnico si verifica?",opts:["La rete diventa più veloce grazie al bilanciamento del carico","Si genera un conflitto IP con disconnessioni intermittenti per entrambi i dispositivi","Uno dei due dispositivi ottiene automaticamente più banda","Non si verifica nessun problema visibile agli utenti"],a:1,exp:"Un conflitto IP genera comportamenti imprevedibili: disconnessioni intermittenti, errori di comunicazione e impossibilità di raggiungere i dispositivi coinvolti."},
  {cat:"Problem Solving",q:"Un cliente segnala che la connessione internet è lenta esclusivamente nelle ore pomeridiane. Qual è la causa più probabile?",opts:["Il router dell'ufficio ha un guasto hardware intermittente","Congestione della rete o saturazione della banda del provider nelle ore di punta","Il PC del cliente è infettato da un malware che si attiva di pomeriggio","Il cavo Ethernet è danneggiato e degrada le prestazioni progressivamente"],a:1,exp:"La degradazione delle prestazioni limitata a fasce orarie specifiche è tipicamente causata dalla congestione della rete durante le ore di picco."},
  {cat:"Problem Solving",q:"Stai completando un'attività urgente quando arriva un'altra richiesta altrettanto urgente da un cliente diverso. Come gestisci la situazione?",opts:["Abbandoni immediatamente la prima attività per dedicarti alla seconda","Comunichi la situazione al tuo responsabile e chiedi come prioritizzare le due richieste","Ignori la seconda richiesta fino al completamento della prima","Cerchi di gestire entrambe le attività contemporaneamente, rischiando errori su entrambe"],a:1,exp:"Comunicare al responsabile permette di prendere la decisione corretta sulla priorità, evitando di compromettere entrambe le attività."},
  {cat:"Problem Solving",q:"Hai effettuato una modifica di configurazione su un server che ha causato un'interruzione del servizio. Come agisci?",opts:["Cerchi di risolvere il problema in silenzio senza informare nessuno","Comunichi immediatamente l'accaduto al responsabile, ripristini la configurazione precedente e documenti l'evento","Attribuisci il problema a una causa esterna per non assumere responsabilità","Aspetti che qualcun altro si accorga del problema prima di agire"],a:1,exp:"Trasparenza, reazione immediata e documentazione dell'incidente sono le risposte corrette: minimizzano il danno e prevengono la ripetizione dell'errore."},
  {cat:"Problem Solving",q:"Un PC riesce a navigare su Internet ma non riesce a raggiungere un server interno alla rete aziendale. Qual è la causa più probabile?",opts:["Il PC non ha una connessione internet funzionante","Problema di routing interno, firewall o server interno non raggiungibile","Il browser del PC ha un aggiornamento pendente","Il server DNS pubblico non funziona correttamente"],a:1,exp:"Se Internet funziona, il problema è specifico per la rete interna: routing, firewall, IP errato del server o il server stesso non è operativo."},
  {cat:"Problem Solving",q:"Un cliente è visibilmente frustrato per un problema tecnico rimasto irrisolto per diversi giorni. Come gestisci l'interazione?",opts:["Eviti il contatto con il cliente finché non hai la soluzione completa","Ascolti attivamente, riconosci il disagio causato, aggiorni sullo stato e fornisci tempi realistici","Spieghi al cliente che il problema non dipende da voi","Suggerisci al cliente di rivolgersi a un altro fornitore"],a:1,exp:"La gestione della relazione con il cliente richiede empatia, comunicazione proattiva e aggiornamenti regolari, indipendentemente dallo stato della risoluzione tecnica."},
  {cat:"Problem Solving",q:"La stampante di rete ha smesso di funzionare per tutti gli utenti dell'ufficio. Qual è il primo passo diagnostico?",opts:["Reinstallare i driver di stampa su tutti i PC dell'ufficio","Verificare lo stato fisico della stampante, la connettività di rete e il suo indirizzo IP","Ordinare immediatamente una stampante sostitutiva","Riavviare tutti i PC dell'ufficio prima di qualsiasi altra verifica"],a:1,exp:"Prima di qualsiasi intervento su client o infrastruttura, è necessario verificare lo stato operativo del dispositivo centrale che causa il problema."},
  {cat:"Problem Solving",q:"Quale pratica professionale distingue un tecnico IT di qualità da uno mediocre?",opts:["Risolvere i problemi velocemente senza fermarsi a documentare l'intervento","Documentare ogni intervento, configurazione e modifica effettuata in modo dettagliato","Tenere per sé le soluzioni trovate per rendersi indispensabile all'azienda","Non comunicare i problemi aperti finché non sono stati completamente risolti"],a:1,exp:"La documentazione sistematica accelera la risoluzione di problemi futuri, facilita la collaborazione nel team e garantisce la continuità operativa."},
  {cat:"Problem Solving",q:"Un utente descrive il problema in modo vago: 'Il computer non funziona.' Come procedi correttamente?",opts:["Riavvii il PC immediatamente senza raccogliere ulteriori informazioni","Poni domande specifiche per comprendere esattamente cosa non funziona, da quando e in che contesto","Sostituisci direttamente il PC senza ulteriori indagini","Reinstalli il sistema operativo come primo intervento"],a:1,exp:"Raccogliere informazioni precise prima di intervenire è fondamentale per identificare correttamente il problema ed evitare interventi inutili o dannosi."},
  {cat:"Problem Solving",q:"Sei l'unico tecnico disponibile e ricevi simultaneamente tre richieste: server aziendale non raggiungibile, PC lento, stampante non funzionante. Come stabilisci la priorità?",opts:["Inizi dalla stampante perché è fisicamente il dispositivo più semplice da riparare","Inizi dal PC lento perché probabilmente richiede meno tempo","Inizi dal server perché un suo malfunzionamento impatta potenzialmente tutti gli utenti","Gestisci tutte e tre le richieste contemporaneamente per non far aspettare nessuno"],a:2,exp:"La priorità deve sempre essere assegnata al problema con il maggiore impatto sul business. Un server non raggiungibile può bloccare l'intera operatività aziendale."},
  {cat:"Problem Solving",q:"Ti viene assegnata un'attività che non hai mai eseguito prima. Qual è l'approccio professionale corretto?",opts:["Dichiari di non essere in grado di svolgere l'attività e la rifiuti","Cerchi documentazione, consulti colleghi esperti e ti impegni a portare a termine il compito","Aspetti che sia qualcun altro ad assumersi la responsabilità dell'attività","Procedi basandoti su ipotesi senza documentarti, per non perdere tempo"],a:1,exp:"La disponibilità ad apprendere cose nuove, documentarsi e chiedere supporto è una delle caratteristiche fondamentali di un professionista IT efficace."},
  {cat:"Problem Solving",q:"Qual è la descrizione più accurata di un approccio metodico alla risoluzione dei problemi tecnici?",opts:["Applicare soluzioni casuali finché una di esse funziona per tentativi ed errori","Identificare il problema, raccogliere dati, formulare ipotesi, testare soluzioni e documentare il risultato","Riavviare sempre il dispositivo come prima azione diagnostica indipendentemente dal problema","Contattare immediatamente il fornitore del dispositivo senza effettuare verifiche preliminari"],a:1,exp:"Un metodo sistematico — identificare, analizzare, ipotizzare, testare, verificare e documentare — è significativamente più efficace del trial and error casuale."},
  {cat:"Problem Solving",q:"Hai terminato un'attività prima del tempo previsto. Qual è la risposta professionale più appropriata?",opts:["Rimani inattivo fino alla scadenza originale pianificata","Segnali al responsabile il completamento anticipato e chiedi se ci sono attività prioritarie su cui contribuire","Te ne vai prima del termine del turno lavorativo","Navighi liberamente su Internet fino alla scadenza dell'orario di lavoro"],a:1,exp:"Comunicare proattivamente il completamento di un'attività e rendersi disponibile per altre priorità è un segnale chiaro di orientamento al risultato e professionalità."},
  {cat:"Problem Solving",q:"Prima di applicare modifiche significative a un sistema in produzione, qual è la sequenza di azioni corretta?",opts:["Applicare le modifiche direttamente in produzione senza preparazione preventiva","Eseguire un backup completo, definire una finestra di manutenzione comunicata e preparare un piano di rollback","Applicare le modifiche in orario notturno senza comunicarlo preventivamente al team","Testare le modifiche direttamente in ambiente di produzione per validità dei risultati"],a:1,exp:"Backup preventivo, pianificazione della manutenzione e piano di rollback sono pratiche non negoziabili per minimizzare i rischi in produzione."},
  {cat:"Problem Solving",q:"Durante un'attività di manutenzione identifichi una vulnerabilità di sicurezza nel sistema. Come agisci?",opts:["La ignori se non causa problemi visibili agli utenti in questo momento","La segnali immediatamente al responsabile della sicurezza e la documenti dettagliatamente","La risolvi autonomamente senza informare nessuno per gestire il problema prima che altri lo scoprano","Aspetti che qualcun altro la identifichi e la riporti"],a:1,exp:"Le vulnerabilità di sicurezza devono essere segnalate immediatamente. Agire da soli senza comunicarlo può creare responsabilità legali e organizzative."},
  {cat:"Problem Solving",q:"Stai progettando l'infrastruttura di rete per un nuovo ufficio. Qual è il primo elemento da definire?",opts:["Acquistare i cavi e i componenti fisici necessari","Definire lo schema di indirizzamento IP e la topologia di rete prima di qualsiasi acquisto","Procedere all'installazione fisica dei PC e delle workstation","Scegliere il browser web da standardizzare nell'ufficio"],a:1,exp:"Definire l'architettura logica prima di qualsiasi acquisto fisico evita problemi costosi da correggere durante o dopo l'implementazione."},
  {cat:"Problem Solving",q:"Qual è la differenza concettuale tra un sintomo e la causa radice di un problema tecnico?",opts:["Non esiste differenza concettuale: sintomo e causa sono la stessa cosa","Il sintomo è ciò che si osserva (PC lento), la causa radice è il problema sottostante (disco pieno o malware)","La causa radice è sempre evidente nell'osservazione del sintomo","I sintomi sono sempre più gravi e urgenti della causa radice"],a:1,exp:"Distinguere i sintomi dalla causa radice è fondamentale per risolvere i problemi in modo definitivo invece di applicare soluzioni temporanee che non eliminano il problema."},
  {cat:"Problem Solving",q:"Viene introdotto in azienda un nuovo strumento di gestione dei ticket che sostituisce il precedente. Come ti approcci al cambiamento?",opts:["Continui ad usare il vecchio strumento finché non ti viene imposto diversamente","Ti formi attivamente sul nuovo strumento, leggi la documentazione e pratichi per padroneggiarlo rapidamente","Aspetti che qualcuno ti insegni tutto senza prendere iniziativa autonoma","Manifesti apertamente le tue perplessità sul cambiamento rifiutando di utilizzare il nuovo strumento"],a:1,exp:"L'adattabilità tecnologica e la proattività nell'apprendimento sono competenze essenziali in un ambiente IT in continua evoluzione."},
  {cat:"Problem Solving",q:"Un cliente o un collega ti chiede di implementare una soluzione che tecnicamente ritieni scorretta. Come gestisci la situazione?",opts:["La implementi senza sollevare obiezioni per non creare attrito","Spieghi con professionalità le tue preoccupazioni tecniche e proponi un'alternativa migliore motivandola","Rifiuti categoricamente senza offrire alternative o spiegazioni","La implementi così come richiesto senza approfondire le conseguenze"],a:1,exp:"Un buon tecnico comunica le proprie competenze in modo costruttivo, proponendo alternative quando identifica rischi tecnici. È un valore aggiunto, non un ostacolo."},
];

const CATS=["Networking","Inglese Tecnico","Problem Solving"];
const CAT_LABELS={"Networking":"Networking","Inglese Tecnico":"Inglese Tecnico","Problem Solving":"Problem Solving"};

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQ(){return shuffle([...shuffle(NETWORKING_Q).slice(0,10),...shuffle(ENGLISH_Q).slice(0,10),...shuffle(LOGIC_Q).slice(0,10)]);}
function genCode(){return Math.random().toString(36).substr(2,8).toUpperCase();}

const VERDICT=s=>{
  if(s<=10)return{label:"Resisti!",color:"#92400e",bg:"#fef3c7",desc:"Il percorso è ancora lungo, ma ogni esperto è stato un principiante. Con impegno e dedizione si cresce!"};
  if(s<=18)return{label:"Ci siamo quasi!",color:"#1d4ed8",bg:"#dbeafe",desc:"Buone basi e qualche lacuna da colmare. Il potenziale c'è — continua a lavorarci!"};
  if(s<=24)return{label:"Campione",color:"#166534",bg:"#dcfce7",desc:"Solide competenze tecniche e buona capacità operativa. Ottimo lavoro sul serio!"};
  return{label:"Leggenda",color:"#0D1B6E",bg:"#e8ecf8",desc:"Preparazione eccellente su tutti i fronti. Benvenuto nel team Kaplet!"};
};

async function sendEmail(p){
  const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:EMAILJS_SERVICE,template_id:EMAILJS_TEMPLATE,user_id:EMAILJS_KEY,template_params:p})});
  if(!r.ok)throw new Error("err");
}

function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="className")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v);});
  if(children){if(Array.isArray(children))children.forEach(c=>c&&el.appendChild(typeof c==="string"?document.createTextNode(c):c));else el.appendChild(typeof children==="string"?document.createTextNode(children):children);}
  return el;
}

let S={phase:"intro",form:{nome:"",cognome:"",data:""},questions:[],current:0,answers:{},chosen:null,code:genCode(),emailStatus:"idle",timeLeft:TOTAL_TIME};
let timerInt=null;

function startTimer(){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    S.timeLeft--;
    const el=document.getElementById("tmr");
    if(el){
      const m=Math.floor(S.timeLeft/60).toString().padStart(2,"0");
      const s=(S.timeLeft%60).toString().padStart(2,"0");
      el.textContent="⏱ "+m+":"+s;
      el.className="timer"+(S.timeLeft<300?" danger":S.timeLeft<600?" warn":"");
    }
    if(S.timeLeft<=0){clearInterval(timerInt);doFinish(true);}
  },1000);
}

function doFinish(timeout){
  const fs=Object.keys(S.answers).filter(i=>S.answers[i]===S.questions[i]?.a).length;
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  S.questions.forEach((q,i)=>{if(cs[q.cat]){cs[q.cat].tot++;if(S.answers[i]===q.a)cs[q.cat].ok++;}});
  const det=CATS.map(c=>`${CAT_LABELS[c]}: ${cs[c]?.ok||0}/${cs[c]?.tot||0}`).join("\n");
  const vd=VERDICT(fs);
  S.phase="result";S.emailStatus="sending";
  render();
  sendEmail({nome:S.form.nome,cognome:S.form.cognome,data:S.form.data,codice:S.code,punteggio:fs+(timeout?" (tempo scaduto)":""),giudizio:vd.label,dettaglio:det})
    .then(()=>{S.emailStatus="sent";const el=document.getElementById("ebanner");if(el){el.className="email-banner eb-sent";el.textContent="✓ Risultati inviati al team Kaplet";} })
    .catch(()=>{S.emailStatus="error";const el=document.getElementById("ebanner");if(el){el.className="email-banner eb-error";el.textContent="⚠ Invio non riuscito — salva il PDF";} });
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(S.phase==="intro")app.appendChild(renderIntro());
  else if(S.phase==="info")app.appendChild(renderInfo());
  else if(S.phase==="quiz")app.appendChild(renderQuiz());
  else app.appendChild(renderResult());
}

function renderIntro(){
  const f=document.createDocumentFragment();
  const hero=h("div",{className:"intro-hero"});
  hero.appendChild(h("div",{className:"tag"},"Selezione Tecnici"));
  hero.appendChild(h("h1",{},"Onboarding Valutation"));
  hero.appendChild(h("p",{},"Un test strutturato per valutare le tue competenze tecniche, la conoscenza dell'inglese professionale e la capacità di risolvere problemi reali sul lavoro."));
  f.appendChild(hero);
  const grid=h("div",{className:"intro-grid"});
  const cards=[
    ["📋","30 domande","10 di Networking, 10 di Inglese Tecnico e 10 di Problem Solving. Le domande variano ad ogni sessione."],
    ["⏱","30 minuti","Il timer parte non appena inizi il quiz. Se scade, il test si chiude automaticamente con il punteggio raggiunto."],
    ["🎯","Valutazione onesta","Non ci sono risposte giuste o sbagliate in assoluto. Il test serve a capire il tuo livello attuale. Sii sincero."],
    ["📧","Risultati immediati","Al termine vedrai il tuo punteggio con il dettaglio per categoria. I risultati saranno inviati automaticamente al team Kaplet."],
  ];
  cards.forEach(([icon,title,text])=>{
    const c=h("div",{className:"intro-card"});
    c.appendChild(h("div",{className:"intro-card-icon"},icon));
    const t=h("div",{className:"intro-card-text"});
    t.appendChild(h("h3",{},title));
    t.appendChild(h("p",{},text));
    c.appendChild(t);grid.appendChild(c);
  });
  f.appendChild(grid);
  const warn=h("div",{className:"warning-strip"});
  warn.innerHTML="<strong>⚠ Prima di iniziare:</strong> assicurati di avere 30 minuti liberi e una connessione stabile. Una volta avviato il quiz il timer non si ferma e non è possibile metterlo in pausa.";
  f.appendChild(warn);
  f.appendChild(h("div",{className:"cta-center"},[
    h("button",{className:"btn btn-primary btn-lg",onClick:()=>{S.phase="info";render();}},"Inizia ora →")
  ]));
  return f;
}

function renderInfo(){
  const card=h("div",{className:"form-card"});
  card.appendChild(h("h2",{},"I tuoi dati"));
  card.appendChild(h("div",{className:"sub"},"Inserisci nome, cognome e data. Verranno inviati insieme al risultato del test."));
  [["nome","Nome","text","Es. Marco"],["cognome","Cognome","text","Es. Rossi"],["data","Data","date",""]].forEach(([id,lbl,type,ph])=>{
    const fd=h("div",{className:"field"});
    fd.appendChild(h("label",{},lbl));
    const inp=document.createElement("input");
    inp.type=type;inp.id=id;inp.placeholder=ph;inp.value=S.form[id]||"";
    fd.appendChild(inp);card.appendChild(fd);
  });
  const err=h("div",{className:"err",id:"ferr"},"Compila tutti i campi per continuare.");
  card.appendChild(err);
  card.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{
    const n=document.getElementById("nome").value.trim();
    const c=document.getElementById("cognome").value.trim();
    const d=document.getElementById("data").value;
    if(!n||!c||!d){document.getElementById("ferr").style.display="block";return;}
    S.form={nome:n,cognome:c,data:d};
    S.questions=pickQ();S.current=0;S.answers={};S.chosen=null;S.timeLeft=TOTAL_TIME;
    S.phase="quiz";render();startTimer();
  }},"Inizia il quiz →"));
  return card;
}

function renderQuiz(){
  const f=document.createDocumentFragment();
  const q=S.questions[S.current];
  const pct=Math.round((S.current/S.questions.length)*100);
  const top=h("div",{className:"quiz-topbar"});
  top.appendChild(h("span",{className:"quiz-name"},S.form.nome+" "+S.form.cognome));
  const right=h("div",{className:"quiz-right"});
  right.appendChild(h("span",{className:"quiz-counter"},(S.current+1)+"/"+S.questions.length));
  right.appendChild(h("div",{className:"timer",id:"tmr"},"⏱ 30:00"));
  top.appendChild(right);f.appendChild(top);
  f.appendChild(h("div",{className:"prog-wrap"},[h("div",{className:"prog-fill",style:"width:"+pct+"%"})]));
  const card=h("div",{className:"q-card"});
  card.appendChild(h("span",{className:"q-cat-tag"},CAT_LABELS[q.cat]));
  card.appendChild(h("div",{className:"q-text"},q.q));
  q.opts.forEach((o,i)=>{
    let cls="opt";
    if(S.chosen!==null){if(i===q.a)cls+=" correct";else if(i===S.chosen)cls+=" wrong";}
    const btn=h("button",{className:cls,onClick:()=>{
      if(S.chosen!==null)return;
      S.chosen=i;S.answers[S.current]=i;
      render();
    }},String.fromCharCode(65+i)+". "+o);
    if(S.chosen!==null)btn.disabled=true;
    card.appendChild(btn);
  });
  if(S.chosen!==null){
    const ok=S.chosen===q.a;
    card.appendChild(h("div",{className:"feedback "+(ok?"ok":"ko")},(ok?"✓ Corretto! ":"✗ Risposta errata. ")+q.exp));
    const nav=h("div",{className:"nav-row"});
    nav.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{
      if(S.current<S.questions.length-1){S.current++;S.chosen=null;render();}
      else{clearInterval(timerInt);doFinish(false);}
    }},S.current<S.questions.length-1?"Prossima domanda →":"Vedi il risultato →"));
    card.appendChild(nav);
  }
  f.appendChild(card);
  setTimeout(()=>{
    const el=document.getElementById("tmr");
    if(el){const m=Math.floor(S.timeLeft/60).toString().padStart(2,"0");const s=(S.timeLeft%60).toString().padStart(2,"0");el.textContent="⏱ "+m+":"+s;el.className="timer"+(S.timeLeft<300?" danger":S.timeLeft<600?" warn":"");}
  },30);
  return f;
}

function renderResult(){
  const f=document.createDocumentFragment();
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  S.questions.forEach((q,i)=>{if(cs[q.cat]){cs[q.cat].tot++;if(S.answers[i]===q.a)cs[q.cat].ok++;}});
  const fs=Object.keys(S.answers).filter(i=>S.answers[i]===S.questions[i]?.a).length;
  const vd=VERDICT(fs);
  const hero=h("div",{className:"result-hero"});
  hero.appendChild(h("div",{className:"result-code"},"CODICE SESSIONE: "+S.code));
  hero.appendChild(h("div",{className:"result-name"},S.form.nome+" "+S.form.cognome));
  hero.appendChild(h("div",{className:"result-date"},S.form.data));
  hero.appendChild(h("div",{className:"result-score"},[document.createTextNode(fs),h("span",{},"/"+S.questions.length)]));
  hero.appendChild(h("div",{className:"result-pct"},Math.round((fs/S.questions.length)*100)+"% di risposte corrette"));
  hero.appendChild(h("span",{className:"verdict-pill",style:"background:"+vd.bg+";color:"+vd.color},vd.label));
  hero.appendChild(h("div",{className:"verdict-desc"},vd.desc));
  hero.appendChild(h("div",{className:"verdict-scale"},"0–10 Resisti! · 11–18 Ci siamo quasi! · 19–24 Campione · 25–30 Leggenda"));
  hero.appendChild(h("div",{className:"email-banner eb-sending",id:"ebanner"},"⏳ Invio risultati in corso..."));
  f.appendChild(hero);

  f.appendChild(h("div",{className:"sec-label"},"Punteggio per categoria"));
  const grid=h("div",{className:"cat-grid",style:"margin-bottom:2rem"});
  CATS.forEach(c=>{
    const p=h("div",{className:"cat-pill"});
    p.appendChild(h("div",{className:"cl"},CAT_LABELS[c]));
    p.appendChild(h("div",{className:"cv"},(cs[c]?.ok||0)+"/"+(cs[c]?.tot||0)));
    grid.appendChild(p);
  });
  f.appendChild(grid);

  f.appendChild(h("div",{className:"sec-label"},"Riepilogo risposte"));
  const list=h("div",{className:"review-list"});
  S.questions.forEach((q,i)=>{
    const ok=S.answers[i]===q.a;
    const item=h("div",{className:"review-item"});
    item.appendChild(h("span",{className:"ri-icon "+(ok?"ri-ok":"ri-err")},ok?"✓":"✗"));
    const body=h("div",{className:"ri-body"});
    body.appendChild(h("div",{className:"ri-q"},q.q));
    if(!ok)body.appendChild(h("div",{className:"ri-wrong"},"Risposta data: "+(q.opts[S.answers[i]]||"Non risposta")));
    body.appendChild(h("div",{className:"ri-right"},"Corretta: "+q.opts[q.a]));
    item.appendChild(body);
    item.appendChild(h("span",{className:"ri-cat"},CAT_LABELS[q.cat]));
    list.appendChild(item);
  });
  f.appendChild(list);

  const btnRow=h("div",{className:"btn-row"});
  btnRow.appendChild(h("button",{className:"btn btn-outline",onClick:()=>window.print()},"Stampa / Salva PDF"));
  btnRow.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{clearInterval(timerInt);S={phase:"intro",form:{nome:"",cognome:"",data:""},questions:[],current:0,answers:{},chosen:null,code:genCode(),emailStatus:"idle",timeLeft:TOTAL_TIME};render();}},"Nuovo test"));
  f.appendChild(btnRow);
  return f;
}

render();
</script>
