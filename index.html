function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQ(){const p=[];CATS.forEach(c=>{const pool=ALL_QUESTIONS.filter(q=>q.cat===c);p.push(...shuffle(pool).slice(0,PER_CAT[c]));});return shuffle(p);}
function genCode(){return Math.random().toString(36).substr(2,8).toUpperCase();}

function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="className")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v);});
  if(children){if(Array.isArray(children))children.forEach(c=>c&&el.appendChild(typeof c==="string"?document.createTextNode(c):c));else el.appendChild(typeof children==="string"?document.createTextNode(children):children);}
  return el;
}

async function sendEmail(){
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  state.questions.forEach((q,i)=>{cs[q.cat].tot++;if(state.answers[i]===q.a)cs[q.cat].ok++;});
  const det=CATS.map(c=>`${CAT_LABELS[c]}: ${cs[c].ok}/${cs[c].tot}`).join("\n");
  const fs=Object.keys(state.answers).filter(i=>state.answers[i]===state.questions[i].a).length;
  const vd=fs<=15?"Insufficiente":fs<=22?"Sufficiente":fs<=27?"Buono":"Ottimo";
  const res=await fetch("https://api.emailjs.com/api/v1.0/email/send",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({service_id:EMAILJS_SERVICE,template_id:EMAILJS_TEMPLATE,user_id:EMAILJS_KEY,
      template_params:{nome:state.form.nome,cognome:state.form.cognome,data:state.form.data,codice:state.code,punteggio:String(fs),giudizio:vd,dettaglio:det}})
  });
  if(!res.ok)throw new Error("err");
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(state.phase==="info")app.appendChild(renderInfo());
  else if(state.phase==="quiz")app.appendChild(renderQuiz());
  else app.appendChild(renderResult());
}

function renderInfo(){
  const wrap=document.createElement("div");
  wrap.className="card";
  wrap.innerHTML=`
    <label>Nome</label>
    <input id="f-nome" type="text" value="${state.form.nome}" placeholder="Es. Marco">
    <label>Cognome</label>
    <input id="f-cognome" type="text" value="${state.form.cognome}" placeholder="Es. Rossi">
    <label>Data</label>
    <input id="f-data" type="date" value="${state.form.data}">
    <div id="f-err" class="err" style="display:none"></div>
    <p class="note">Le domande vengono selezionate casualmente da una banca di ${ALL_QUESTIONS.length} domande. Ogni sessione è diversa dalla precedente.</p>
  `;
  const btn=h("button",{className:"btn-primary",onClick:()=>{
    const n=document.getElementById("f-nome").value.trim();
    const c=document.getElementById("f-cognome").value.trim();
    const d=document.getElementById("f-data").value;
    const err=document.getElementById("f-err");
    if(!n||!c||!d){err.textContent="Compila tutti i campi per iniziare.";err.style.display="block";return;}
    state.form={nome:n,cognome:c,data:d};
    state.questions=pickQ();state.current=0;state.answers={};state.chosen=null;state.score=0;
    state.phase="quiz";render();
  }},"Inizia il quiz →");
  wrap.appendChild(btn);
  return wrap;
}

function renderQuiz(){
  const frag=document.createDocumentFragment();
  const q=state.questions[state.current];
  const pct=Math.round((state.current/state.questions.length)*100);

  const meta=h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem"},[
    h("span",{style:"font-size:14px;color:#666"},`${state.form.nome} ${state.form.cognome}`),
    h("span",{style:"font-size:13px;color:#888"},`${state.current+1} / ${state.questions.length}`)
  ]);
  const prog=h("div",{className:"prog-wrap"},[h("div",{className:"prog-fill",style:`width:${pct}%`})]);
  frag.appendChild(meta);frag.appendChild(prog);

  const card=h("div",{className:"card"});
  const qmeta=h("div",{className:"q-meta"},[
    h("span",{className:"q-cat"},CAT_LABELS[q.cat]),
    h("span",{className:"q-num"},`Domanda ${state.current+1}`)
  ]);
  card.appendChild(qmeta);
  card.appendChild(h("div",{className:"q-text"},q.q));

  q.opts.forEach((o,i)=>{
    let cls="opt";
    if(state.chosen!==null){if(i===q.a)cls+=" correct";else if(i===state.chosen&&state.chosen!==q.a)cls+=" wrong";}
    const btn=h("button",{className:cls,onClick:()=>{
      if(state.chosen!==null)return;
      state.chosen=i;state.answers[state.current]=i;
      if(i===q.a)state.score++;
      render();
    }},`${String.fromCharCode(65+i)}. ${o}`);
    if(state.chosen!==null)btn.disabled=true;
    card.appendChild(btn);
  });

  if(state.chosen!==null){
    card.appendChild(h("div",{className:"feedback"},`${state.chosen===q.a?"✓ Corretto! ":"✗ Risposta errata. "}${q.exp}`));
    const nav=h("div",{className:"nav-row"});
    const nb=h("button",{className:"btn-primary",onClick:()=>{
      if(state.current<state.questions.length-1){state.current++;state.chosen=null;render();}
      else{state.phase="result";state.emailStatus="sending";render();sendEmail().then(()=>{state.emailStatus="sent";render();}).catch(()=>{state.emailStatus="error";render();});}
    }},state.current<state.questions.length-1?"Prossima →":"Vedi risultato →");
    nav.appendChild(nb);card.appendChild(nav);
  }
  frag.appendChild(card);
  return frag;
}

function renderResult(){
  const frag=document.createDocumentFragment();
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  state.questions.forEach((q,i)=>{cs[q.cat].tot++;if(state.answers[i]===q.a)cs[q.cat].ok++;});
  const fs=Object.keys(state.answers).filter(i=>state.answers[i]===state.questions[i].a).length;
  const vd=fs<=15?{l:"Insufficiente",c:"#c0392b",bg:"#fdedec"}:fs<=22?{l:"Sufficiente",c:"#d35400",bg:"#fef5e7"}:fs<=27?{l:"Buono",c:"#1e8449",bg:"#eafaf1"}:{l:"Ottimo",c:"#0e6655",bg:"#e8f8f5"};

  const top=h("div",{className:"card",style:"text-align:center"});
  top.appendChild(h("div",{style:"font-size:13px;color:#888;margin-bottom:4px"},`Codice sessione: ${state.code}`));
  top.appendChild(h("div",{style:"font-size:15px;font-weight:600;margin-bottom:2px"},`${state.form.nome} ${state.form.cognome}`));
  top.appendChild(h("div",{style:"font-size:13px;color:#888;margin-bottom:16px"},state.form.data));
  top.appendChild(h("div",{className:"score-big"},[`${fs}`,h("span",{style:"font-size:28px;color:#888"},`/${state.questions.length}`)]));
  top.appendChild(h("div",{className:"score-sub"},`${Math.round((fs/state.questions.length)*100)}% di risposte corrette`));
  top.appendChild(h("span",{className:"verdict",style:`background:${vd.bg};color:${vd.c}`},vd.l));
  top.appendChild(h("div",{style:"font-size:12px;color:#888;margin-top:8px"},"0–15 Insufficiente · 16–22 Sufficiente · 23–27 Buono · 28–30 Ottimo"));

  const esCls=state.emailStatus==="sending"?"es-sending":state.emailStatus==="sent"?"es-sent":"es-error";
  const esToxt=state.emailStatus==="sending"?"⏳ Invio risultati in corso...":state.emailStatus==="sent"?"✓ Risultati inviati via email al responsabile":"⚠ Invio email fallito — salva il PDF manualmente";
  if(state.emailStatus!=="idle")top.appendChild(h("div",{className:`email-status ${esCls}`},esToxt));
  frag.appendChild(top);

  frag.appendChild(h("div",{style:"font-size:14px;font-weight:500;color:#666;margin-bottom:8px"},"Punteggio per categoria"));
  const grid=h("div",{className:"cat-grid"});
  CATS.forEach(c=>{
    const p=h("div",{className:"cat-pill"});
    p.appendChild(h("div",{className:"cl"},CAT_LABELS[c]));
    p.appendChild(h("div",{className:"cv"},`${cs[c].ok}/${cs[c].tot}`));
    grid.appendChild(p);
  });
  frag.appendChild(grid);

  frag.appendChild(h("div",{style:"font-size:14px;font-weight:500;color:#666;margin-bottom:8px"},"Riepilogo risposte"));
  state.questions.forEach((q,i)=>{
    const ok=state.answers[i]===q.a;
    const card=h("div",{className:"card",style:"padding:0.9rem 1.2rem;margin-bottom:8px"});
    const row=h("div",{className:"review-item"});
    row.appendChild(h("span",{className:ok?"review-ok":"review-err"},ok?"✓":"✗"));
    const info=h("div",{style:"flex:1"});
    info.appendChild(h("div",{style:"font-size:13px;font-weight:500;margin-bottom:3px"},q.q));
    if(!ok)info.appendChild(h("div",{style:"font-size:12px;color:#c0392b"},`Risposta data: ${q.opts[state.answers[i]]}`));
    info.appendChild(h("div",{style:"font-size:12px;color:#27ae60"},`Corretta: ${q.opts[q.a]}`));
    row.appendChild(info);
    row.appendChild(h("span",{style:"font-size:11px;padding:2px 8px;border-radius:6px;background:#f0f0f0;color:#666;white-space:nowrap"},CAT_LABELS[q.cat]));
    card.appendChild(row);frag.appendChild(card);
  });

  const btnRow=h("div",{className:"btn-row"});
  btnRow.appendChild(h("button",{className:"btn-secondary",onClick:()=>window.print()},"Stampa / Salva PDF"));
  btnRow.appendChild(h("button",{className:"btn-primary",onClick:()=>{
    state={phase:"info",form:{nome:"",cognome:"",data:""},questions:[],current:0,answers:{},chosen:null,score:0,code:genCode(),emailStatus:"idle"};
    render();
  }},"Nuovo test"));
  frag.appendChild(btnRow);
  return frag;
}

render();
</script>
</body>
</html>
