<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Valutation — Kaplet</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',sans-serif;background:#f7f8fc;color:#1a1a2e;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e8eaf0;padding:0 2.5rem;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-logo{display:flex;align-items:center;gap:14px}
.header-badge{font-size:11px;font-weight:600;color:#0D1B6E;background:#e8ecf8;padding:5px 14px;border-radius:999px;letter-spacing:1px;text-transform:uppercase}
.wrap{max-width:720px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.intro-hero{text-align:center;padding:2.5rem 0 2rem}
.intro-hero .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#0D1B6E;background:#e8ecf8;padding:5px 16px;border-radius:999px;margin-bottom:20px}
.intro-hero h1{font-size:32px;font-weight:700;color:#0D1B6E;line-height:1.2;margin-bottom:12px}
.intro-hero p{font-size:16px;color:#555;line-height:1.7;max-width:520px;margin:0 auto}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:2rem 0}
.intro-card{background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:1.25rem 1.5rem;display:flex;gap:14px;align-items:flex-start}
.intro-card-icon{width:40px;height:40px;border-radius:10px;background:#e8ecf8;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.intro-card-text h3{font-size:14px;font-weight:600;color:#0D1B6E;margin-bottom:4px}
.intro-card-text p{font-size:13px;color:#666;line-height:1.6}
.warning-strip{background:#fff8e1;border:1px solid #ffe082;border-left:4px solid #f59e0b;border-radius:8px;padding:1rem 1.25rem;font-size:13px;color:#7a5100;line-height:1.6;margin-bottom:2rem}
.cta-center{text-align:center}
.form-card{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2rem;margin-bottom:1.5rem}
.form-card h2{font-size:20px;font-weight:700;color:#0D1B6E;margin-bottom:6px}
.form-card .sub{font-size:14px;color:#888;margin-bottom:1.5rem}
.field{margin-bottom:16px}
.field label{font-size:13px;font-weight:500;color:#444;display:block;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1.5px solid #dde1ef;border-radius:8px;font-size:14px;font-family:'Roboto',sans-serif;color:#1a1a2e;background:#fff;transition:border-color 0.2s}
.field input:focus{outline:none;border-color:#0D1B6E}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;font-family:'Roboto',sans-serif;cursor:pointer;transition:all 0.2s;border:none}
.btn-primary{background:#0D1B6E;color:#fff}
.btn-primary:hover{background:#0a1558}
.btn-outline{background:#fff;color:#0D1B6E;border:1.5px solid #0D1B6E}
.btn-outline:hover{background:#e8ecf8}
.btn-lg{padding:14px 36px;font-size:15px;border-radius:10px}
.err{font-size:13px;color:#c0392b;margin-top:8px;display:none}
.quiz-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.quiz-name{font-size:14px;color:#666}
.quiz-right{display:flex;align-items:center;gap:12px}
.quiz-counter{font-size:13px;color:#999}
.timer{font-size:14px;font-weight:700;padding:6px 14px;border-radius:8px;border:2px solid #0D1B6E;color:#0D1B6E;background:#e8ecf8;font-family:'Roboto',sans-serif}
.timer.warn{border-color:#d97706;color:#d97706;background:#fff8e1}
.timer.danger{border-color:#dc2626;color:#dc2626;background:#fef2f2}
.prog-wrap{height:4px;background:#e8eaf0;border-radius:2px;margin-bottom:2rem;overflow:hidden}
.prog-fill{height:100%;background:#0D1B6E;border-radius:2px;transition:width 0.4s}
.q-card{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2rem}
.q-cat-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0D1B6E;background:#e8ecf8;padding:4px 12px;border-radius:999px;margin-bottom:16px}
.q-text{font-size:16px;font-weight:500;color:#1a1a2e;line-height:1.6;margin-bottom:1.25rem}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:10px;background:#f7f8fc;border:1.5px solid #e8eaf0;border-radius:10px;font-size:14px;font-family:'Roboto',sans-serif;color:#1a1a2e;cursor:pointer;transition:all 0.15s;line-height:1.5}
.opt:hover:not(:disabled){background:#e8ecf8;border-color:#0D1B6E}
.opt.correct{background:#f0fdf4;border-color:#16a34a;color:#15803d;font-weight:500}
.opt.wrong{background:#fef2f2;border-color:#dc2626;color:#b91c1c;font-weight:500}
.opt:disabled{cursor:default}
.feedback{font-size:13px;margin-top:14px;padding:12px 16px;border-radius:10px;border-left:4px solid #0D1B6E;line-height:1.7}
.feedback.ok{border-left-color:#16a34a;background:#f0fdf4;color:#166534}
.feedback.ko{border-left-color:#dc2626;background:#fef2f2;color:#991b1b}
.nav-row{display:flex;justify-content:flex-end;margin-top:1.5rem}
.result-hero{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1.5rem}
.result-code{font-size:12px;color:#aaa;margin-bottom:6px;letter-spacing:1px}
.result-name{font-size:17px;font-weight:600;color:#1a1a2e;margin-bottom:2px}
.result-date{font-size:13px;color:#aaa;margin-bottom:20px}
.result-score{font-size:56px;font-weight:700;color:#0D1B6E;line-height:1}
.result-score span{font-size:30px;color:#aaa;font-weight:400}
.result-pct{font-size:14px;color:#888;margin-top:6px}
.verdict-pill{display:inline-block;margin-top:16px;padding:10px 28px;border-radius:999px;font-size:17px;font-weight:700}
.verdict-desc{font-size:14px;color:#555;margin-top:10px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto}
.verdict-scale{font-size:11px;color:#bbb;margin-top:10px}
.email-banner{margin-top:18px;font-size:13px;padding:10px 18px;border-radius:8px;display:inline-block;font-weight:500}
.eb-sending{background:#e8ecf8;color:#0D1B6E}
.eb-sent{background:#f0fdf4;color:#15803d}
.eb-error{background:#fef2f2;color:#b91c1c}
.sec-label{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin-bottom:10px}
.cat-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2rem}
.cat-pill{flex:1;min-width:120px;background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:12px 14px;text-align:center}
.cat-pill .cl{font-size:11px;color:#aaa;font-weight:500}
.cat-pill .cv{font-size:22px;font-weight:700;color:#0D1B6E;margin-top:4px}
.review-list{display:flex;flex-direction:column;gap:10px;margin-bottom:2rem}
.review-item{background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:1rem 1.25rem;display:flex;gap:10px;align-items:flex-start}
.ri-icon{font-size:14px;font-weight:700;min-width:20px;margin-top:1px}
.ri-ok{color:#16a34a}
.ri-err{color:#dc2626}
.ri-body{flex:1}
.ri-q{font-size:13px;font-weight:500;color:#1a1a2e;margin-bottom:4px}
.ri-wrong{font-size:12px;color:#dc2626;margin-bottom:2px}
.ri-right{font-size:12px;color:#16a34a}
.ri-cat{font-size:11px;padding:2px 10px;border-radius:999px;background:#e8ecf8;color:#0D1B6E;white-space:nowrap;font-weight:500;align-self:flex-start;flex-shrink:0}
.btn-row{display:flex;gap:12px;justify-content:center;margin-top:2rem;flex-wrap:wrap}
.footer{text-align:center;padding:2rem 0 1rem;font-size:12px;color:#ccc}
@media(max-width:600px){.intro-grid{grid-template-columns:1fr}.btn-row{flex-direction:column;align-items:center}}
@media print{.header,.btn-row,.timer,.prog-wrap,.footer{display:none}body{background:#fff}.wrap{padding:1rem}}
</style>
</head>

<script>
const ES="service_it8h9pa",ET="template_ylarf5y",EK="BFRiR1c_sncLKV-cp",TT=30*60;

// REGOLA: tutte le 4 opzioni hanno lunghezza simile — nessuna risposta corretta è più lunga delle altre
const NQ=[
  {c:"Networking",q:"Cosa identifica un indirizzo IP in una rete?",o:["Il tipo di cavo usato","Un dispositivo nella rete","La velocità del link","Il produttore della NIC"],a:1,e:"L'indirizzo IP identifica univocamente un dispositivo all'interno di una rete."},
  {c:"Networking",q:"Quanti bit compongono un indirizzo IPv4?",o:["16 bit","64 bit","32 bit","128 bit"],a:2,e:"IPv4 usa 32 bit, scritti come 4 ottetti decimali separati da punti."},
  {c:"Networking",q:"Quanti bit compongono un indirizzo IPv6?",o:["32 bit","64 bit","96 bit","128 bit"],a:3,e:"IPv6 usa 128 bit in notazione esadecimale separata da due punti."},
  {c:"Networking",q:"Quale indirizzo appartiene al range privato classe A?",o:["192.168.1.1","172.20.0.1","8.8.8.8","10.5.0.1"],a:3,e:"Il range 10.0.0.0/8 è il blocco privato di classe A (RFC 1918)."},
  {c:"Networking",q:"Quale indirizzo appartiene al range privato classe C?",o:["10.0.0.1","172.16.5.1","169.254.1.1","192.168.5.1"],a:3,e:"Il range 192.168.0.0/16 è riservato alle reti private di classe C."},
  {c:"Networking",q:"Qual è l'indirizzo di loopback standard IPv4?",o:["0.0.0.0","192.168.0.1","255.255.255.0","127.0.0.1"],a:3,e:"127.0.0.1 è il loopback: il traffico non lascia mai il dispositivo."},
  {c:"Networking",q:"Cosa indica /24 nella notazione CIDR?",o:["24 host disponibili","24 reti separate","24 byte di payload","24 bit identificano la rete"],a:3,e:"In CIDR, /24 significa che i primi 24 bit sono la porzione di rete."},
  {c:"Networking",q:"Qual è il broadcast della rete 192.168.1.0/24?",o:["192.168.1.0","192.168.1.1","192.168.1.128","192.168.1.255"],a:3,e:"Il broadcast è l'ultimo IP della sottorete, con tutti i bit host a 1."},
  {c:"Networking",q:"Cosa fa il protocollo NAT?",o:["Cifra il traffico LAN","Assegna MAC address","Filtra pacchetti ICMP","Traduce IP privati in IP pubblici"],a:3,e:"NAT traduce IP privati in IP pubblici per l'accesso a Internet."},
  {c:"Networking",q:"Cosa rappresenta il TTL in un pacchetto IP?",o:["Il tempo di latenza","La dimensione del frame","Il tipo di protocollo","Il numero massimo di hop consentiti"],a:3,e:"TTL viene decrementato da ogni router. A 0 il pacchetto viene scartato."},
  {c:"Networking",q:"Quanti indirizzi totali ha una rete /28?",o:["8 indirizzi","32 indirizzi","64 indirizzi","16 indirizzi"],a:3,e:"Una /28 ha 2^4 = 16 indirizzi totali (14 host utilizzabili)."},
  {c:"Networking",q:"A cosa serve la subnet mask?",o:["Cifrare i dati in LAN","Assegnare IP ai client","Filtrare il traffico web","Separare rete e host nell'IP"],a:3,e:"La subnet mask distingue la porzione di rete dalla porzione host."},
  {c:"Networking",q:"Quanti host utilizzabili ha una rete /24?",o:["256 host","255 host","128 host","254 host"],a:3,e:"256 totali meno rete e broadcast = 254 host utilizzabili."},
  {c:"Networking",q:"Quanti host utilizzabili ha una rete /25?",o:["128 host","254 host","62 host","126 host"],a:3,e:"/25 ha 128 indirizzi totali meno 2 = 126 host utilizzabili."},
  {c:"Networking",q:"Quanti host utilizzabili ha una rete /30?",o:["4 host","6 host","30 host","2 host"],a:3,e:"/30 ha 4 indirizzi: rete, broadcast e 2 host. Usato per link punto-punto."},
  {c:"Networking",q:"Quale subnet mask corrisponde a /16?",o:["255.255.255.0","255.0.0.0","255.255.255.128","255.255.0.0"],a:3,e:"255.255.0.0 ha 16 bit a 1, corrisponde a /16 CIDR."},
  {c:"Networking",q:"Quale subnet mask corrisponde a /8?",o:["255.255.0.0","255.255.255.0","255.128.0.0","255.0.0.0"],a:3,e:"255.0.0.0 ha 8 bit a 1, corrisponde a /8 CIDR (classe A)."},
  {c:"Networking",q:"Quante sottoreti /26 si ottengono da una /24?",o:["2 sottoreti","8 sottoreti","16 sottoreti","4 sottoreti"],a:3,e:"Da /24 a /26 si aggiungono 2 bit: 2^2 = 4 sottoreti."},
  {c:"Networking",q:"Qual è la funzione del default gateway?",o:["Assegnare IP via DHCP","Risolvere i nomi DNS","Proteggere da attacchi esterni","Instradare pacchetti verso reti esterne"],a:3,e:"Il default gateway instrada i pacchetti destinati a reti diverse da quella locale."},
  {c:"Networking",q:"A quale livello OSI operano i router?",o:["Livello 1 — Fisico","Livello 4 — Trasporto","Livello 2 — Data Link","Livello 3 — Rete"],a:3,e:"I router operano al livello 3 (Rete) del modello OSI."},
  {c:"Networking",q:"Quale comando mostra il gateway su Windows?",o:["tracert 8.8.8.8","ping /all","netstat -rn","ipconfig"],a:3,e:"'ipconfig' mostra la configurazione di rete incluso il default gateway."},
  {c:"Networking",q:"Qual è la funzione principale del DNS?",o:["Cifrare il traffico web","Assegnare IP dinamici","Instradare i pacchetti IP","Tradurre nomi di dominio in IP"],a:3,e:"Il DNS traduce i nomi di dominio negli indirizzi IP corrispondenti."},
  {c:"Networking",q:"Su quale porta opera il DNS per le query standard?",o:["TCP 80","TCP 443","TCP 25","UDP 53"],a:3,e:"Il DNS usa la porta UDP 53 per le query di risoluzione nomi."},
  {c:"Networking",q:"Cosa fa il server DHCP?",o:["Traduce nomi in IP","Autentica gli utenti","Filtra il traffico","Assegna IP e parametri di rete"],a:3,e:"Il DHCP assegna automaticamente IP, subnet mask, gateway e DNS."},
  {c:"Networking",q:"Qual è il primo messaggio del processo DHCP?",o:["DHCP Acknowledge","DHCP Offer","DHCP Request","DHCP Discover"],a:3,e:"Il client invia DHCP Discover in broadcast per trovare server DHCP."},
  {c:"Networking",q:"Cos'è un indirizzo MAC?",o:["Un IP privato della LAN","Il serial number del router","Il nome host del device","Identificatore hardware a 48 bit della NIC"],a:3,e:"Il MAC address è un identificatore hardware univoco della scheda di rete."},
  {c:"Networking",q:"Cosa misura il comando ping?",o:["Apertura delle porte TCP","Velocità massima del link","Configurazione DNS locale","Raggiungibilità e RTT verso un host"],a:3,e:"Ping invia ICMP Echo Request e misura il round-trip time verso un host."},
  {c:"Networking",q:"Cos'è una VLAN?",o:["Un tipo di cavo schermato","Un protocollo di routing","Una rete wireless dedicata","Segmentazione logica di una rete fisica"],a:3,e:"Una VLAN divide logicamente una rete fisica in più reti virtuali separate."},
  {c:"Networking",q:"Quanti livelli ha il modello OSI?",o:["4 livelli","5 livelli","10 livelli","7 livelli"],a:3,e:"Il modello OSI ha 7 livelli: Fisico, Data Link, Rete, Trasporto, Sessione, Presentazione, Applicazione."},
  {c:"Networking",q:"Differenza principale tra TCP e UDP?",o:["UDP è un protocollo obsoleto","TCP è molto più veloce di UDP","Non c'è differenza rilevante","TCP garantisce la consegna, UDP no"],a:3,e:"TCP è affidabile con controllo errori; UDP è connectionless e più veloce."},
  {c:"Networking",q:"Su quale porta opera HTTP?",o:["443","21","25","80"],a:3,e:"HTTP opera sulla porta TCP 80."},
  {c:"Networking",q:"Su quale porta opera HTTPS?",o:["80","8080","8443","443"],a:3,e:"HTTPS opera sulla porta TCP 443 cifrando il traffico con TLS."},
  {c:"Networking",q:"Cosa fa ARP?",o:["Cifra il traffico LAN","Assegna IP dinamici","Traduce domini in IP","Risolve un IP nel MAC corrispondente"],a:3,e:"ARP traduce un IP noto nel MAC address per la comunicazione L2."},
  {c:"Networking",q:"Cosa mostra tracert/traceroute?",o:["Le porte TCP aperte","La risoluzione DNS","La velocità del collegamento","Il percorso hop per hop verso la destinazione"],a:3,e:"Tracert/traceroute mostra ogni router attraversato con i relativi RTT."},
  {c:"Networking",q:"Cos'è una DMZ in ambito networking?",o:["Una zona LAN senza AP","Un tipo di tunnel VPN","Un protocollo di routing","Sottorete esposta separata dalla rete interna"],a:3,e:"La DMZ ospita server pubblici separandoli dalla rete interna."},
  {c:"Networking",q:"Quale comando svuota la DNS cache su Windows?",o:["ping /cleardns","nslookup /reset","netstat -flush","ipconfig /flushdns"],a:3,e:"'ipconfig /flushdns' svuota la cache DNS locale di Windows."},
  {c:"Networking",q:"Cosa fa il protocollo ICMP?",o:["Trasferisce file in rete","Assegna indirizzi IP","Cifra il traffico dati","Invia messaggi di controllo ed errore"],a:3,e:"ICMP gestisce messaggi diagnostici come ping e notifiche di errore."},
  {c:"Networking",q:"A quale livello OSI opera uno switch L2?",o:["Livello 3 — Rete","Livello 4 — Trasporto","Livello 1 — Fisico","Livello 2 — Data Link"],a:3,e:"Uno switch L2 opera al livello Data Link usando la tabella MAC."},
  {c:"Networking",q:"Cos'è APIPA?",o:["IP assegnato da DHCP","IP riservato ai server","IP usato per multicast","IP auto-assegnato in 169.254.x.x senza DHCP"],a:3,e:"APIPA assegna un IP 169.254.x.x quando non trova un server DHCP."},
  {c:"Networking",q:"Quale range è riservato al multicast IPv4?",o:["172.16.0.0-172.31.255.255","10.0.0.0-10.255.255.255","192.168.0.0-192.168.255.255","224.0.0.0-239.255.255.255"],a:3,e:"Il range 224.0.0.0-239.255.255.255 è riservato al multicast IPv4."},
  {c:"Networking",q:"Cos'è il lease time DHCP?",o:["Il tempo dell'handshake TCP","L'intervallo tra due ARP","Il tempo di risposta del DNS","La durata di validità dell'IP assegnato"],a:3,e:"Il lease time è il periodo durante cui l'IP assegnato dal DHCP rimane valido."},
  {c:"Networking",q:"Cosa fa il comando nslookup?",o:["Mostra le connessioni TCP","Configura il DHCP client","Mostra la tabella ARP","Interroga un DNS per risolvere nomi o IP"],a:3,e:"nslookup interroga manualmente un server DNS per risoluzioni dirette e inverse."},
  {c:"Networking",q:"Cos'è un record DNS di tipo A?",o:["Un alias per un nome","Un record obsoleto","Associa un nome a IPv6","Associa un nome a un IPv4"],a:3,e:"Il record A mappa un nome di dominio a un indirizzo IPv4."},
  {c:"Networking",q:"Cos'è un record DNS di tipo AAAA?",o:["Un alias per un nome","Associa un nome a IPv4","Definisce il server mail","Associa un nome a un IPv6"],a:3,e:"Il record AAAA mappa un nome di dominio a un indirizzo IPv6."},
  {c:"Networking",q:"Su quale porta opera FTP?",o:["25","80","443","21"],a:3,e:"FTP usa TCP 21 per il controllo e TCP 20 per il trasferimento dati."},
  {c:"Networking",q:"Su quale porta opera SSH?",o:["23","80","443","22"],a:3,e:"SSH opera sulla porta TCP 22 e fornisce accesso remoto cifrato."},
  {c:"Networking",q:"Su quale porta opera SMTP?",o:["110","143","80","25"],a:3,e:"SMTP usa la porta TCP 25 per l'invio di email."},
  {c:"Networking",q:"Cosa indica una metrica di routing bassa?",o:["Il gateway è offline","Il link è più lento","Il percorso è meno usato","Il percorso è quello preferito"],a:3,e:"Metrica più bassa = percorso preferito nelle tabelle di routing."},
  {c:"Networking",q:"Cos'è il routing statico?",o:["Route apprese da protocolli","Route assegnate dal DHCP","Route apprese via ARP","Route configurate manualmente"],a:3,e:"Il routing statico usa route configurate manualmente dall'amministratore."},
  {c:"Networking",q:"Cos'è la DNS cache?",o:["Il file di config DNS","Un registro globale DNS","Una lista di IP bloccati","Memoria temporanea delle risoluzioni DNS"],a:3,e:"La DNS cache memorizza risoluzioni recenti per ridurre query ripetute."},
  {c:"Networking",q:"Cosa restituisce IP AND subnet mask?",o:["L'indirizzo del gateway","Il numero totale di host","L'indirizzo di broadcast","L'indirizzo di rete"],a:3,e:"L'AND bit a bit tra IP e subnet mask restituisce il network address."},
  {c:"Networking",q:"Su quale porta opera Telnet?",o:["21","22","25","23"],a:3,e:"Telnet usa la porta TCP 23. Non cifra il traffico, è stato sostituito da SSH."},
  {c:"Networking",q:"Cosa si intende per full-duplex?",o:["Trasmissione in un solo senso","Trasmissione alternata nei due sensi","Trasmissione solo in download","Trasmissione simultanea nei due sensi"],a:3,e:"Full-duplex permette trasmissione e ricezione simultanee sullo stesso canale."},
  {c:"Networking",q:"Cos'è il protocollo OSPF?",o:["Protocollo per cifrare i dati","Protocollo per assegnare IP","Protocollo per risolvere DNS","Protocollo di routing dinamico link-state"],a:3,e:"OSPF è un protocollo di routing dinamico che usa l'algoritmo Dijkstra per calcolare i percorsi."},
  {c:"Networking",q:"Cosa fa il protocollo STP (Spanning Tree)?",o:["Cifra il traffico LAN","Assegna VLAN ai port","Bilancia il carico tra server","Previene i loop nelle reti con switch ridondanti"],a:3,e:"STP elimina i loop logici in reti con switch ridondanti bloccando porte superflue."},
  {c:"Networking",q:"Qual è la dimensione standard di un frame Ethernet?",o:["512 byte","1024 byte","2048 byte","64-1518 byte"],a:3,e:"Un frame Ethernet standard va da 64 a 1518 byte (o 1522 con tag VLAN)."},
  {c:"Networking",q:"Cosa si intende per bandwidth throttling?",o:["Aumento artificiale della banda","Cifratura del traffico dati","Reset della connessione TCP","Limitazione intenzionale della banda disponibile"],a:3,e:"Il throttling è la limitazione intenzionale della banda da parte del provider o di un sistema."},
  {c:"Networking",q:"Cosa fa un proxy server?",o:["Assegna IP dinamici","Bilancia carico tra server","Cifra il traffico VPN","Agisce da intermediario tra client e Internet"],a:3,e:"Un proxy server intercetta le richieste dei client verso Internet, potendo caching, filtrare o anonimizzare."},
  {c:"Networking",q:"Cos'è il protocollo NTP?",o:["Protocollo per routing dinamico","Protocollo per trasferire file","Protocollo per cifrare dati","Protocollo per sincronizzare l'ora dei dispositivi"],a:3,e:"NTP (Network Time Protocol) sincronizza l'orologio dei dispositivi di rete."},
  {c:"Networking",q:"Cosa si intende per QoS?",o:["Quantità di server attivi","Qualità della cifratura VPN","Numero di VLAN configurate","Gestione priorità del traffico di rete"],a:3,e:"QoS (Quality of Service) assegna priorità ai flussi di traffico per garantire prestazioni critiche."},
  {c:"Networking",q:"Cosa fa il comando 'netstat'?",o:["Svuota la cache DNS","Testa raggiungibilità host","Traccia il percorso dei pacchetti","Mostra connessioni di rete attive e porte"],a:3,e:"'netstat' mostra le connessioni TCP/UDP attive, le porte in ascolto e le statistiche di rete."},
  {c:"Networking",q:"Cos'è un trunk port in ambito VLAN?",o:["Una porta con banda limitata","Una porta solo per il management","Una porta che trasporta solo una VLAN","Una porta che trasporta più VLAN contemporaneamente"],a:3,e:"Una trunk port trasporta traffico di più VLAN usando tag (es. 802.1Q) per distinguerle."},
  {c:"Networking",q:"Cosa si intende per default route?",o:["La route con metrica più alta","La route verso la LAN locale","La route verso il server DNS","La route usata quando nessuna altra corrisponde"],a:3,e:"La default route (0.0.0.0/0) è usata quando nessuna route specifica corrisponde alla destinazione."},
];

const EQ=[
  {c:"Inglese Tecnico",q:"What does 'IP address' stand for?",o:["Input Protocol address","Interface Protocol address","Internal Protocol address","Internet Protocol address"],a:3,e:"IP stands for Internet Protocol. An IP address uniquely identifies a device on a network."},
  {c:"Inglese Tecnico",q:"What is a 'subnet mask' used for?",o:["To encrypt all traffic","To assign IP automatically","To filter web content","To separate network from host in an IP"],a:3,e:"A subnet mask distinguishes the network portion from the host portion of an IP address."},
  {c:"Inglese Tecnico",q:"What does 'DHCP' stand for?",o:["Distributed Host Communication Protocol","Direct Host Connection Protocol","Dynamic Host Control Program","Dynamic Host Configuration Protocol"],a:3,e:"DHCP automatically assigns IP addresses and network settings to clients."},
  {c:"Inglese Tecnico",q:"What does 'troubleshoot' mean in IT?",o:["To install new software","To back up data files","To upgrade hardware parts","To identify and fix technical problems"],a:3,e:"Troubleshooting is the systematic process of diagnosing and resolving technical issues."},
  {c:"Inglese Tecnico",q:"What does 'VPN' stand for?",o:["Verified Private Node","Virtual Protocol Network","Very Protected Node","Virtual Private Network"],a:3,e:"VPN stands for Virtual Private Network — it creates a secure encrypted tunnel over the internet."},
  {c:"Inglese Tecnico",q:"What is 'latency' in networking?",o:["The maximum link speed","The number of lost packets","The encryption level used","The delay between sending and receiving data"],a:3,e:"Latency is the round-trip delay in data communication, measured in milliseconds."},
  {c:"Inglese Tecnico",q:"What does 'escalate' mean in IT support?",o:["To immediately close a ticket","To mark a ticket as low priority","To reassign to a same-level peer","To pass an issue to a higher support tier"],a:3,e:"Escalating means transferring an unresolved issue to a higher level of expertise."},
  {c:"Inglese Tecnico",q:"What does 'uptime' refer to in IT?",o:["Time needed to restart servers","Speed of the internet line","Time to configure a new device","How long a system runs without interruption"],a:3,e:"Uptime is the continuous period a system has been operational and available."},
  {c:"Inglese Tecnico",q:"What does 'deploy' mean in IT?",o:["To test in a sandbox only","To remove outdated software","To create a full system backup","To release software into production"],a:3,e:"Deploying means releasing software or infrastructure into a live production environment."},
  {c:"Inglese Tecnico",q:"What is a 'backup' in IT?",o:["Removing old files to free space","Increasing available bandwidth","Restarting a failed service","A copy of data stored for recovery"],a:3,e:"A backup is a data copy kept separately so it can be restored if the original is lost."},
  {c:"Inglese Tecnico",q:"What is a 'firewall' used for?",o:["Amplifying Wi-Fi signal","Transferring files between hosts","Assigning IP addresses to clients","Monitoring and filtering network traffic"],a:3,e:"A firewall enforces security rules by filtering incoming and outgoing network traffic."},
  {c:"Inglese Tecnico",q:"What does 'configure' mean in IT?",o:["To physically install hardware","To repair a broken device","To monitor live network traffic","To set up settings on a device or app"],a:3,e:"Configuring means adjusting parameters so hardware or software works as required."},
  {c:"Inglese Tecnico",q:"What is 'bandwidth' in networking?",o:["The physical cable length","The count of connected devices","The encryption strength applied","The maximum data transfer rate"],a:3,e:"Bandwidth is the maximum data transfer capacity of a network link, in Mbps or Gbps."},
  {c:"Inglese Tecnico",q:"What is a 'patch' in IT?",o:["A cable repair method","A network diagram type","A backup configuration file","A software update fixing bugs or flaws"],a:3,e:"A patch is a targeted software update addressing specific bugs or vulnerabilities."},
  {c:"Inglese Tecnico",q:"What is an IT 'log' file?",o:["A printed hardware list","A cable routing document","A complete OS backup copy","A file recording system events and errors"],a:3,e:"A log file records timestamped events and errors for monitoring and troubleshooting."},
  {c:"Inglese Tecnico",q:"What does 'proactive' mean at work?",o:["Waiting for issues to arise","Doing only what is requested","Avoiding extra responsibilities","Acting before problems occur"],a:3,e:"Being proactive means anticipating issues and taking initiative without being asked."},
  {c:"Inglese Tecnico",q:"What does 'remote access' mean in IT?",o:["Entering the server room after hours","A specific type of VPN protocol","An email encryption standard","Connecting to a system from another location"],a:3,e:"Remote access lets users or technicians connect to systems from different physical locations."},
  {c:"Inglese Tecnico",q:"What does 'redundancy' mean in networking?",o:["Removing unused network devices","Compressing transmitted data packets","Encrypting all traffic by default","Duplicate components ensuring availability if one fails"],a:3,e:"Redundancy provides backup components or paths so the network keeps working after failures."},
  {c:"Inglese Tecnico",q:"What does 'SLA' stand for?",o:["System Level Authorization","Software License Activation","Standard Login Access","Service Level Agreement"],a:3,e:"SLA defines agreed service levels including response times, uptime and performance targets."},
  {c:"Inglese Tecnico",q:"What does 'roll back' mean in IT?",o:["Applying the next pending update","Deleting a configuration file","Restarting all affected services","Reverting to a previous system state"],a:3,e:"Rolling back means restoring a system to its state before a problematic change."},
  {c:"Inglese Tecnico",q:"What is 'throughput' in networking?",o:["The theoretical maximum speed","The count of active connections","The encryption standard in use","The actual data transfer rate achieved"],a:3,e:"Throughput is the real transfer rate achieved, which may be lower than the bandwidth."},
  {c:"Inglese Tecnico",q:"What does 'downtime' mean in IT?",o:["Time needed to reboot servers","A scheduled patching window","Time required to deploy software","Period when a system is unavailable"],a:3,e:"Downtime is the period when a system is not operational, planned or unplanned."},
  {c:"Inglese Tecnico",q:"What is a 'workaround' in IT support?",o:["A definitive fix to the root cause","A method to bypass security controls","An automated maintenance script","A temporary fix while the real solution is developed"],a:3,e:"A workaround keeps operations running temporarily while the root cause is being resolved."},
  {c:"Inglese Tecnico",q:"What does 'end user' mean in IT?",o:["The IT technician on duty","The software development team","The manager who owns the system","The person who uses the system daily"],a:3,e:"An end user is the person who actually uses a system or application in their work."},
  {c:"Inglese Tecnico",q:"What does 'network segmentation' achieve?",o:["Physically splitting network cables","Combining multiple LANs into one","Encrypting all inter-device traffic","Dividing a network into smaller logical zones"],a:3,e:"Segmentation limits security blast radius and improves network performance and control."},
  {c:"Inglese Tecnico",q:"What does 'accountability' mean professionally?",o:["Avoiding blame for mistakes","Delegating all decisions upward","Being responsible only for listed tasks","Owning your actions and their outcomes"],a:3,e:"Accountability means taking ownership of your work, including mistakes, and fixing them."},
  {c:"Inglese Tecnico",q:"What is a 'default gateway'?",o:["A server that assigns IP addresses","A device that encrypts all traffic","A dedicated DNS resolution server","The router forwarding traffic to other networks"],a:3,e:"The default gateway routes packets to destinations outside the local network."},
  {c:"Inglese Tecnico",q:"What does 'ping' do in networking?",o:["Transfers files between two hosts","Shows open ports on a target","Configures a network interface","Tests host reachability and measures RTT"],a:3,e:"Ping sends ICMP Echo Requests and measures the round-trip time to a host."},
  {c:"Inglese Tecnico",q:"What is a network 'switch'?",o:["A Layer 3 routing device","A wireless access point","An IP address assignment server","A device forwarding frames using MAC addresses"],a:3,e:"A network switch operates at Layer 2 and forwards frames based on MAC address tables."},
  {c:"Inglese Tecnico",q:"What does 'SSID' stand for?",o:["Secure Signal ID Device","System Security Identifier","Standard Signal Interface Device","Service Set Identifier — a Wi-Fi network name"],a:3,e:"SSID is the name a Wi-Fi network broadcasts so devices can identify and connect to it."},
  {c:"Inglese Tecnico",q:"What is 'packet loss'?",o:["A physically damaged cable","A memory error on a router","A device disconnected from LAN","When packets fail to reach their destination"],a:3,e:"Packet loss occurs when transmitted packets do not arrive at their intended destination."},
  {c:"Inglese Tecnico",q:"What does 'document' mean in IT work?",o:["Deleting old configuration files","Encrypting all sensitive records","Creating a full system backup","Writing down procedures and changes for reference"],a:3,e:"Documentation means recording technical details and changes so others can understand and reproduce them."},
  {c:"Inglese Tecnico",q:"What does 'prioritize' mean at work?",o:["Handling all tasks at the same time","Delegating every task to colleagues","Ignoring tasks below a threshold","Addressing the most critical tasks first"],a:3,e:"Prioritizing means identifying the most important tasks and addressing them before others."},
  {c:"Inglese Tecnico",q:"What is a 'network topology'?",o:["The GPS location of each device","The speed of data transmission","The security protocol in use","The arrangement of devices in a network"],a:3,e:"Network topology describes how devices are arranged and interconnected (star, ring, mesh, etc.)."},
  {c:"Inglese Tecnico",q:"What does 'MAC address' stand for?",o:["Machine Access Code","Main Address Controller","Managed Access Certificate","Media Access Control address"],a:3,e:"MAC address is a unique hardware identifier assigned to a network interface card."},
  {c:"Inglese Tecnico",q:"What does 'escalate a ticket' mean?",o:["Closing a ticket without resolution","Adding notes to an existing ticket","Assigning the ticket to a colleague","Transferring it to a higher support level"],a:3,e:"Escalating a ticket means passing it to a higher tier when current support cannot resolve it."},
  {c:"Inglese Tecnico",q:"What does 'infrastructure as code' mean?",o:["Writing code inside a data center","Using code to monitor servers","Storing backups in a code repository","Managing infrastructure through machine-readable config files"],a:3,e:"Infrastructure as Code (IaC) means managing servers and networks using versioned configuration files."},
  {c:"Inglese Tecnico",q:"What is a 'knowledge base' in IT support?",o:["A list of open support tickets","A log of all system errors","A database of user credentials","A repository of documented solutions and guides"],a:3,e:"A knowledge base is a searchable collection of articles and solutions used to resolve common IT issues."},
  {c:"Inglese Tecnico",q:"What does 'root cause analysis' mean?",o:["Rebooting a failed system","Replacing faulty hardware","Updating system software","Identifying the underlying cause of a problem"],a:3,e:"Root cause analysis investigates why a problem occurred to prevent it from recurring."},
  {c:"Inglese Tecnico",q:"What is a 'change request' in IT?",o:["A request to close a ticket","A report of a system failure","A request for a new user account","A formal proposal to modify a system or process"],a:3,e:"A change request is a formal document submitted before making modifications to IT systems."},
  {c:"Inglese Tecnico",q:"What does 'monitoring' mean in IT operations?",o:["Restarting services periodically","Backing up data at intervals","Assigning IP addresses to devices","Continuously observing system health and performance"],a:3,e:"IT monitoring tracks system metrics in real time to detect issues before they impact users."},
  {c:"Inglese Tecnico",q:"What is 'on-premises' vs 'cloud'?",o:["On-premises is cheaper always","Cloud is always more secure","On-premises uses virtual machines only","On-premises means local hardware; cloud means remote hosted services"],a:3,e:"On-premises infrastructure is physically owned and hosted locally; cloud services are hosted by a third-party provider."},
  {c:"Inglese Tecnico",q:"What does 'ticket resolution time' mean?",o:["Time to assign the ticket","Time before the ticket expires","Time to first respond to the ticket","Time from ticket creation to final resolution"],a:3,e:"Resolution time measures how long it takes from when a ticket is opened to when the issue is fully resolved."},
  {c:"Inglese Tecnico",q:"What does 'handover' mean in IT projects?",o:["Closing all open tickets","Restarting a project from scratch","Archiving completed documentation","Transferring responsibility and knowledge to another team"],a:3,e:"A handover is the formal process of transferring ownership, documentation and knowledge between teams."},
  {c:"Inglese Tecnico",q:"What is 'escalation path' in support?",o:["The list of open incidents","The route packets take in a network","The schedule for system updates","The defined chain of support levels for unresolved issues"],a:3,e:"An escalation path defines which team or person receives an issue when the current tier cannot resolve it."},
  {c:"Inglese Tecnico",q:"What does 'scope creep' mean in a project?",o:["A project finishing early","A bug found late in development","A reduction in project budget","Uncontrolled growth of project requirements"],a:3,e:"Scope creep is the gradual, unplanned expansion of project requirements beyond the original agreement."},
  {c:"Inglese Tecnico",q:"What is a 'snapshot' in IT?",o:["A screenshot of a web page","A log of network traffic","A full hardware inventory","A point-in-time copy of a system's state"],a:3,e:"A snapshot captures the exact state of a system at a specific moment, used for backup or rollback."},
  {c:"Inglese Tecnico",q:"What does 'vendor' mean in IT?",o:["A junior IT technician","An end user of the system","The company's IT department","A company that supplies technology products or services"],a:3,e:"A vendor is an external company that provides hardware, software or IT services to an organization."},
  {c:"Inglese Tecnico",q:"What is a 'service desk'?",o:["A hardware repair workshop","A place to store IT equipment","A team managing software licenses","A centralized team handling IT support requests"],a:3,e:"A service desk is the central point of contact between IT and users, managing incidents and requests."},
  {c:"Inglese Tecnico",q:"What does 'incident' mean in ITIL?",o:["A planned system upgrade","A scheduled maintenance window","A new feature request from a user","An unplanned interruption affecting service"],a:3,e:"In ITIL, an incident is any unplanned event that disrupts or reduces the quality of a service."},

  {c:"Problem Solving",q:"Un utente dice 'il computer non funziona'. Come procedi?",o:["Riavvii subito senza chiedere","Sostituisci il PC direttamente","Reinstalli il sistema operativo","Fai domande specifiche sul problema"],a:3,e:"Raccogliere informazioni precise prima di intervenire è fondamentale per una diagnosi corretta."},
  {c:"Problem Solving",q:"Server giù, PC lento, stampante rotta: da dove inizi?",o:["Dalla stampante, più semplice","Dal PC lento, più veloce","Da tutte e tre insieme","Dal server, impatta più utenti"],a:3,e:"La priorità va al problema con il maggiore impatto sul business: il server giù blocca tutti."},

  {c:"Problem Solving",q:"Un cliente chiede una soluzione tecnicamente scorretta. Come agisci?",o:["La implementi senza obiezioni","La rifiuti senza spiegazioni","La implementi senza approfondire","Spieghi i rischi e proponi alternative"],a:3,e:"Un buon tecnico comunica le proprie competenze in modo costruttivo proponendo alternative."},

  {c:"Problem Solving",q:"Come gestisci un progetto con scadenza ravvicinata?",o:["Lavori senza alcuna pianificazione","Chiedi proroga senza provare","Dici che non è possibile farlo","Pianifichi priorità e comunichi i rischi"],a:3,e:"Pianificazione e comunicazione proattiva dei rischi sono fondamentali sotto pressione."},
  {c:"Problem Solving",q:"Un cliente chiama fuori orario per un'emergenza. Cosa fai?",o:["Non rispondi alla chiamata","Dici che non è il tuo turno","Aspetti il giorno dopo senza scrivere","Valuti la gravità e gestisci la comunicazione"],a:3,e:"In IT la gestione delle emergenze richiede valutazione della gravità e comunicazione responsabile."},
  {c:"Problem Solving",q:"Come verifichi il successo di un intervento di manutenzione?",o:["Chiudi il ticket senza testare","Dici al cliente che è risolto","Aspetti che il cliente segnali problemi","Testi le funzionalità e confermi con l'utente"],a:3,e:"Verificare il funzionamento prima di chiudere garantisce qualità e soddisfazione del cliente."},
  {c:"Problem Solving",q:"Ricevi un feedback negativo su un tuo intervento. Come reagisci?",o:["Lo ignori senza rispondere","Ti giustifichi senza ascoltare","Ti arrabbi con il cliente","Ascolti, comprendi e impari per migliorare"],a:3,e:"Il feedback negativo è un'opportunità di crescita. Ascoltare e migliorare è la risposta professionale."},
  {c:"Problem Solving",q:"Cosa fai se non capisci una richiesta del cliente?",o:["Procedi come meglio credi","Ignori la richiesta","Invii una soluzione a caso","Chiedi chiarimenti prima di procedere"],a:3,e:"Chiarire i requisiti prima di agire evita lavoro inutile e malintesi costosi."},
  {c:"Problem Solving",q:"Hai troppe attività aperte contemporaneamente. Come gestisci?",o:["Lavori su tutte insieme","Chiudi quelle difficili senza risolverle","Nascondi le attività in ritardo","Crei una lista ordinata per priorità e impatto"],a:3,e:"Prioritizzare per impatto e urgenza è la chiave per gestire un carico di lavoro elevato."},
  {c:"Problem Solving",q:"Devi spiegare un problema tecnico a un cliente non tecnico. Come lo fai?",o:["Usi termini tecnici precisi","Invii la documentazione tecnica","Gli dici di non preoccuparsi","Usi analogie semplici e linguaggio chiaro"],a:3,e:"Comunicare in modo comprensibile al cliente, senza gergo tecnico, è una competenza fondamentale."},
  {c:"Problem Solving",q:"Ricevi una richiesta di cambio configurazione senza documentazione. Cosa fai?",o:["Procedi lo stesso senza chiedere","Rifiuti di eseguire la richiesta","Applichi la modifica più logica","Richiedi documentazione prima di procedere"],a:3,e:"Richiedere documentazione formale prima di modifiche protegge te, il team e il cliente."},
  {c:"Problem Solving",q:"Un servizio critico è andato giù di notte. Come gestisci la situazione?",o:["Aspetti il mattino per intervenire","Provi a risolvere senza avvisare nessuno","Invii email e aspetti risposta","Applichi il piano di emergenza e avvisi i responsabili"],a:3,e:"Per servizi critici esistono procedure di escalation: vanno applicate subito, di giorno o di notte."},
  {c:"Problem Solving",q:"Quale approccio è corretto quando si introduce una nuova tecnologia?",o:["Adottarla subito in produzione","Ignorarla finché non è obbligatoria","Affidarsi solo all'esperienza passata","Testarla in ambiente di sviluppo prima"],a:3,e:"Testare in un ambiente non produttivo prima di rilasciare riduce drasticamente i rischi."},
  {c:"Problem Solving",q:"Stai lavorando da remoto e perdi la connessione VPN. Prima cosa?",o:["Riavvii tutto il PC","Reinstalli il client VPN","Chiami il cliente per scusarti","Verifichi connessione locale e poi la VPN"],a:3,e:"Verificare prima la connessione locale permette di escludere problemi di rete prima di agire sulla VPN."},
  {c:"Problem Solving",q:"Come gestisci la conoscenza acquisita su un problema risolto?",o:["La tieni per te","La elimini dopo la chiusura","La condividi solo se richiesto","La documenti e la condividi nel team"],a:3,e:"Documentare e condividere soluzioni costruisce la knowledge base aziendale e accelera i futuri interventi."},
  {c:"Problem Solving",q:"Cosa fai se una procedura aziendale ti sembra inefficiente?",o:["La ignori e procedi a modo tuo","Non la applichi e basta","Ti lamenti senza proporre nulla","La segui e proponi miglioramenti formalmente"],a:3,e:"Seguire le procedure e proporre miglioramenti nel modo corretto è il comportamento professionale ideale."},
  {c:"Problem Solving",q:"Come ti comporti durante il periodo di onboarding in una nuova azienda?",o:["Aspetti che ti dicano tutto","Eviti di fare domande per non sembrare inesperto","Critichi le procedure esistenti","Osservi, fai domande e ti adatti attivamente"],a:3,e:"Un onboarding efficace richiede curiosità, ascolto attivo e adattamento proattivo al nuovo contesto."},
  {c:"Problem Solving",q:"Cosa fai se un utente chiede qualcosa fuori dal tuo perimetro di competenza?",o:["Provi comunque senza dirlo","Dici che non ti riguarda","Inventi una soluzione approssimativa","Lo indirizzi alla persona o team competente"],a:3,e:"Indirizzare la richiesta al team giusto è professionale e garantisce all'utente la soluzione migliore."},
];

const CATS=["Networking","Inglese Tecnico","Problem Solving"];
const CL={"Networking":"Networking","Inglese Tecnico":"Inglese Tecnico","Problem Solving":"Problem Solving"};

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function shuffleOpts(q){
  const ct=q.o[q.a];
  const sh=shuffle([...q.o]);
  return{...q,o:sh,a:sh.indexOf(ct)};
}

function pickQ(){
  const n=shuffle(NQ).slice(0,10).map(shuffleOpts);
  const e=shuffle(EQ).slice(0,10).map(shuffleOpts);
  const l=shuffle(LQ).slice(0,10).map(shuffleOpts);
  return shuffle([...n,...e,...l]);
}

function genCode(){return Math.random().toString(36).substr(2,8).toUpperCase();}

const VERDICT=s=>{
  if(s<=10)return{label:"Resisti!",color:"#92400e",bg:"#fef3c7",desc:"Il percorso è ancora lungo, ma con impegno si cresce!"};
  if(s<=18)return{label:"Ci siamo quasi!",color:"#1d4ed8",bg:"#dbeafe",desc:"Buone basi e qualche lacuna da colmare. Il potenziale c'è!"};
  if(s<=24)return{label:"Campione",color:"#166534",bg:"#dcfce7",desc:"Solide competenze tecniche e buona autonomia operativa!"};
  return{label:"Leggenda",color:"#0D1B6E",bg:"#e8ecf8",desc:"Eccellente preparazione su tutti i fronti. Benvenuto nel team Kaplet!"};
};

async function sendEmail(p){
  const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:ES,template_id:ET,user_id:EK,template_params:p})});
  if(!r.ok)throw new Error("err");
}

function h(tag,attrs,ch){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="className")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v);});
  if(ch){if(Array.isArray(ch))ch.forEach(c=>c!=null&&el.appendChild(typeof c==="string"?document.createTextNode(c):c));else el.appendChild(typeof ch==="string"?document.createTextNode(ch):ch);}
  return el;
}

let S={phase:"intro",form:{nome:"",cognome:"",data:""},questions:[],cur:0,answers:{},chosen:null,code:genCode(),timeLeft:TT};
let tmrInt=null;

function startTimer(){
  clearInterval(tmrInt);
  tmrInt=setInterval(()=>{
    S.timeLeft--;
    const el=document.getElementById("tmr");
    if(el){
      const m=Math.floor(S.timeLeft/60).toString().padStart(2,"0");
      const s=(S.timeLeft%60).toString().padStart(2,"0");
      el.textContent="⏱ "+m+":"+s;
      el.className="timer"+(S.timeLeft<300?" danger":S.timeLeft<600?" warn":"");
    }
    if(S.timeLeft<=0){clearInterval(tmrInt);doFinish(true);}
  },1000);
}

function doFinish(timeout){
  const fs=Object.keys(S.answers).filter(i=>S.answers[i]===S.questions[i]?.a).length;
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  S.questions.forEach((q,i)=>{if(cs[q.c]){cs[q.c].tot++;if(S.answers[i]===q.a)cs[q.c].ok++;}});
  const det=CATS.map(c=>`${CL[c]}: ${cs[c]?.ok||0}/${cs[c]?.tot||0}`).join("\n");
  const vd=VERDICT(fs);
  S.phase="result";render();
  sendEmail({nome:S.form.nome,cognome:S.form.cognome,data:S.form.data,codice:S.code,punteggio:fs+(timeout?" (tempo scaduto)":""),giudizio:vd.label,dettaglio:det})
    .then(()=>{const el=document.getElementById("eb");if(el){el.className="email-banner eb-sent";el.textContent="✓ Risultati inviati al team Kaplet";}})
    .catch(()=>{const el=document.getElementById("eb");if(el){el.className="email-banner eb-error";el.textContent="⚠ Invio non riuscito — salva il PDF";}});
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(S.phase==="intro")app.appendChild(rIntro());
  else if(S.phase==="info")app.appendChild(rInfo());
  else if(S.phase==="quiz")app.appendChild(rQuiz());
  else app.appendChild(rResult());
}

function rIntro(){
  const f=document.createDocumentFragment();
  const hero=h("div",{className:"intro-hero"});
  hero.appendChild(h("div",{className:"tag"},"Selezione Tecnici"));
  hero.appendChild(h("h1",{},"Onboarding Valutation"));
  hero.appendChild(h("p",{},"Un test per valutare le tue competenze tecniche, l'inglese professionale e la capacità di problem solving sul lavoro."));
  f.appendChild(hero);
  const grid=h("div",{className:"intro-grid"});
  [["📋","30 domande","10 Networking, 10 Inglese Tecnico, 10 Problem Solving. Domande diverse ad ogni sessione."],
   ["⏱","30 minuti","Il timer parte non appena inizi. Se scade, il test si chiude automaticamente."],
   ["🎯","Sii onesto","Non ci sono risposte trappola. Il test valuta il tuo livello reale."],
   ["📧","Risultati immediati","Vedrai il punteggio con dettaglio per categoria. I risultati vanno al team Kaplet."]
  ].forEach(([icon,title,text])=>{
    const c=h("div",{className:"intro-card"});
    c.appendChild(h("div",{className:"intro-card-icon"},icon));
    const t=h("div",{className:"intro-card-text"});
    t.appendChild(h("h3",{},title));t.appendChild(h("p",{},text));
    c.appendChild(t);grid.appendChild(c);
  });
  f.appendChild(grid);
  const w=h("div",{className:"warning-strip"});
  w.innerHTML="<strong>⚠ Prima di iniziare:</strong> assicurati di avere 30 minuti liberi e connessione stabile. Il timer non si ferma.";
  f.appendChild(w);
  f.appendChild(h("div",{className:"cta-center"},[h("button",{className:"btn btn-primary btn-lg",onClick:()=>{S.phase="info";render();}},"Inizia ora →")]));
  return f;
}

function rInfo(){
  const card=h("div",{className:"form-card"});
  card.appendChild(h("h2",{},"I tuoi dati"));
  card.appendChild(h("div",{className:"sub"},"Inserisci nome, cognome e data. Verranno inviati con il risultato."));
  [["nome","Nome","text","Es. Marco"],["cognome","Cognome","text","Es. Rossi"],["data","Data","date",""]].forEach(([id,lbl,type,ph])=>{
    const fd=h("div",{className:"field"});
    fd.appendChild(h("label",{},lbl));
    const inp=document.createElement("input");
    inp.type=type;inp.id=id;inp.placeholder=ph;inp.value=S.form[id]||"";
    fd.appendChild(inp);card.appendChild(fd);
  });
  const err=h("div",{className:"err",id:"ferr"},"Compila tutti i campi per continuare.");
  card.appendChild(err);
  card.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{
    const n=document.getElementById("nome").value.trim();
    const c=document.getElementById("cognome").value.trim();
    const d=document.getElementById("data").value;
    if(!n||!c||!d){document.getElementById("ferr").style.display="block";return;}
    S.form={nome:n,cognome:c,data:d};
    S.questions=pickQ();S.cur=0;S.answers={};S.chosen=null;S.timeLeft=TT;
    S.phase="quiz";render();startTimer();
  }},"Inizia il quiz →"));
  return card;
}

function rQuiz(){
  const f=document.createDocumentFragment();
  const q=S.questions[S.cur];
  const pct=Math.round((S.cur/S.questions.length)*100);
  const top=h("div",{className:"quiz-topbar"});
  top.appendChild(h("span",{className:"quiz-name"},S.form.nome+" "+S.form.cognome));
  const right=h("div",{className:"quiz-right"});
  right.appendChild(h("span",{className:"quiz-counter"},(S.cur+1)+"/"+S.questions.length));
  right.appendChild(h("div",{className:"timer",id:"tmr"},"⏱ 30:00"));
  top.appendChild(right);f.appendChild(top);
  f.appendChild(h("div",{className:"prog-wrap"},[h("div",{className:"prog-fill",style:"width:"+pct+"%"})]));
  const card=h("div",{className:"q-card"});
  card.appendChild(h("span",{className:"q-cat-tag"},CL[q.c]));
  card.appendChild(h("div",{className:"q-text"},q.q));
  const answered=S.answers[S.cur]!==undefined;
  q.o.forEach((opt,i)=>{
    let cls="opt";
    if(answered){if(i===q.a)cls+=" correct";else if(i===S.answers[S.cur])cls+=" wrong";}
    const btn=h("button",{className:cls,onClick:()=>{
      if(answered)return;
      S.answers[S.cur]=i;render();
    }},String.fromCharCode(65+i)+". "+opt);
    if(answered)btn.disabled=true;
    card.appendChild(btn);
  });
  if(answered){
    const ok=S.answers[S.cur]===q.a;
    card.appendChild(h("div",{className:"feedback "+(ok?"ok":"ko")},(ok?"✓ Corretto! ":"✗ Risposta errata. ")+q.e));
    const nav=h("div",{className:"nav-row"});
    nav.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{
      if(S.cur<S.questions.length-1){S.cur++;S.chosen=null;render();}
      else{clearInterval(tmrInt);doFinish(false);}
    }},S.cur<S.questions.length-1?"Prossima domanda →":"Vedi il risultato →"));
    card.appendChild(nav);
  }
  f.appendChild(card);
  setTimeout(()=>{
    const el=document.getElementById("tmr");
    if(el){const m=Math.floor(S.timeLeft/60).toString().padStart(2,"0");const s=(S.timeLeft%60).toString().padStart(2,"0");el.textContent="⏱ "+m+":"+s;el.className="timer"+(S.timeLeft<300?" danger":S.timeLeft<600?" warn":"");}
  },30);
  return f;
}

function rResult(){
  const f=document.createDocumentFragment();
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  S.questions.forEach((q,i)=>{if(cs[q.c]){cs[q.c].tot++;if(S.answers[i]===q.a)cs[q.c].ok++;}});
  const fs=Object.keys(S.answers).filter(i=>S.answers[i]===S.questions[i]?.a).length;
  const vd=VERDICT(fs);
  const hero=h("div",{className:"result-hero"});
  hero.appendChild(h("div",{className:"result-code"},"CODICE SESSIONE: "+S.code));
  hero.appendChild(h("div",{className:"result-name"},S.form.nome+" "+S.form.cognome));
  hero.appendChild(h("div",{className:"result-date"},S.form.data));
  hero.appendChild(h("div",{className:"result-score"},[document.createTextNode(fs),h("span",{},"/"+S.questions.length)]));
  hero.appendChild(h("div",{className:"result-pct"},Math.round((fs/S.questions.length)*100)+"% di risposte corrette"));
  hero.appendChild(h("span",{className:"verdict-pill",style:"background:"+vd.bg+";color:"+vd.color},vd.label));
  hero.appendChild(h("div",{className:"verdict-desc"},vd.desc));
  hero.appendChild(h("div",{className:"verdict-scale"},"0–10 Resisti! · 11–18 Ci siamo quasi! · 19–24 Campione · 25–30 Leggenda"));
  hero.appendChild(h("div",{className:"email-banner eb-sending",id:"eb"},"⏳ Invio risultati in corso..."));
  f.appendChild(hero);
  f.appendChild(h("div",{className:"sec-label"},"Punteggio per categoria"));
  const grid=h("div",{className:"cat-grid"});
  CATS.forEach(c=>{
    const p=h("div",{className:"cat-pill"});
    p.appendChild(h("div",{className:"cl"},CL[c]));
    p.appendChild(h("div",{className:"cv"},(cs[c]?.ok||0)+"/"+(cs[c]?.tot||0)));
    grid.appendChild(p);
  });
  f.appendChild(grid);
  f.appendChild(h("div",{className:"sec-label"},"Riepilogo risposte"));
  const list=h("div",{className:"review-list"});
  S.questions.forEach((q,i)=>{
    const ok=S.answers[i]===q.a;
    const item=h("div",{className:"review-item"});
    item.appendChild(h("span",{className:"ri-icon "+(ok?"ri-ok":"ri-err")},ok?"✓":"✗"));
    const body=h("div",{className:"ri-body"});
    body.appendChild(h("div",{className:"ri-q"},q.q));
    if(!ok){
      if(S.answers[i]!==undefined)body.appendChild(h("div",{className:"ri-wrong"},"Risposta data: "+q.o[S.answers[i]]));
      body.appendChild(h("div",{className:"ri-right"},"Corretta: "+q.o[q.a]));
    }
    item.appendChild(body);
    item.appendChild(h("span",{className:"ri-cat"},CL[q.c]));
    list.appendChild(item);
  });
  f.appendChild(list);
  const btnRow=h("div",{className:"btn-row"});
  btnRow.appendChild(h("button",{className:"btn btn-outline",onClick:()=>window.print()},"Stampa / Salva PDF"));
  btnRow.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{clearInterval(tmrInt);S={phase:"intro",form:{nome:"",cognome:"",data:""},questions:[],cur:0,answers:{},chosen:null,code:genCode(),timeLeft:TT};render();}},"Nuovo test"));
  f.appendChild(btnRow);
  return f;
}

render();
</script>
