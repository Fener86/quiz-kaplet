<!DOCTYPE html>

<head>

<title>Onboarding Valutation — Kaplet</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',sans-serif;background:#f7f8fc;color:#1a1a2e;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e8eaf0;padding:0 2.5rem;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-logo{display:flex;align-items:center;gap:14px}
.header-badge{font-size:11px;font-weight:600;color:#0D1B6E;background:#e8ecf8;padding:5px 14px;border-radius:999px;letter-spacing:1px;text-transform:uppercase}
.wrap{max-width:720px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.intro-hero{text-align:center;padding:2.5rem 0 2rem}
.intro-hero .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#0D1B6E;background:#e8ecf8;padding:5px 16px;border-radius:999px;margin-bottom:20px}
.intro-hero h1{font-size:32px;font-weight:700;color:#0D1B6E;line-height:1.2;margin-bottom:12px}
.intro-hero p{font-size:16px;color:#555;line-height:1.7;max-width:520px;margin:0 auto}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:2rem 0}
.intro-card{background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:1.25rem 1.5rem;display:flex;gap:14px;align-items:flex-start}
.intro-card-icon{width:40px;height:40px;border-radius:10px;background:#e8ecf8;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.intro-card-text h3{font-size:14px;font-weight:600;color:#0D1B6E;margin-bottom:4px}
.intro-card-text p{font-size:13px;color:#666;line-height:1.6}
.warning-strip{background:#fff8e1;border:1px solid #ffe082;border-left:4px solid #f59e0b;border-radius:8px;padding:1rem 1.25rem;font-size:13px;color:#7a5100;line-height:1.6;margin-bottom:2rem}
.cta-center{text-align:center}
.form-card{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2rem;margin-bottom:1.5rem}
.form-card h2{font-size:20px;font-weight:700;color:#0D1B6E;margin-bottom:6px}
.form-card .sub{font-size:14px;color:#888;margin-bottom:1.5rem}
.field{margin-bottom:16px}
.field label{font-size:13px;font-weight:500;color:#444;display:block;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1.5px solid #dde1ef;border-radius:8px;font-size:14px;font-family:'Roboto',sans-serif;color:#1a1a2e;background:#fff;transition:border-color 0.2s}
.field input:focus{outline:none;border-color:#0D1B6E}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;font-family:'Roboto',sans-serif;cursor:pointer;transition:all 0.2s;border:none}
.btn-primary{background:#0D1B6E;color:#fff}
.btn-primary:hover{background:#0a1558}
.btn-outline{background:#fff;color:#0D1B6E;border:1.5px solid #0D1B6E}
.btn-outline:hover{background:#e8ecf8}
.btn-lg{padding:14px 36px;font-size:15px;border-radius:10px}
.err{font-size:13px;color:#c0392b;margin-top:8px;display:none}
.quiz-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.quiz-name{font-size:14px;color:#666}
.quiz-right{display:flex;align-items:center;gap:12px}
.quiz-counter{font-size:13px;color:#999}
.timer{font-size:14px;font-weight:700;padding:6px 14px;border-radius:8px;border:2px solid #0D1B6E;color:#0D1B6E;background:#e8ecf8;font-family:'Roboto',sans-serif}
.timer.warn{border-color:#d97706;color:#d97706;background:#fff8e1}
.timer.danger{border-color:#dc2626;color:#dc2626;background:#fef2f2}
.prog-wrap{height:4px;background:#e8eaf0;border-radius:2px;margin-bottom:2rem;overflow:hidden}
.prog-fill{height:100%;background:#0D1B6E;border-radius:2px;transition:width 0.4s}
.q-card{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2rem}
.q-tags{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.q-cat-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0D1B6E;background:#e8ecf8;padding:4px 12px;border-radius:999px}
.q-multi-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#7c3aed;background:#ede9fe;padding:4px 12px;border-radius:999px}
.q-text{font-size:16px;font-weight:500;color:#1a1a2e;line-height:1.6;margin-bottom:6px}
.q-hint{font-size:13px;color:#888;margin-bottom:1.25rem;font-style:italic}
/* Risposta singola */
.opt{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:10px;background:#f7f8fc;border:1.5px solid #e8eaf0;border-radius:10px;font-size:14px;font-family:'Roboto',sans-serif;color:#1a1a2e;cursor:pointer;transition:all 0.15s}
.opt:hover:not(:disabled){background:#e8ecf8;border-color:#0D1B6E}
.opt.correct{background:#f0fdf4;border-color:#16a34a;color:#15803d;font-weight:500}
.opt.wrong{background:#fef2f2;border-color:#dc2626;color:#b91c1c;font-weight:500}
.opt:disabled{cursor:default}
/* Risposta multipla */
.mopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;margin-bottom:10px;background:#f7f8fc;border:1.5px solid #e8eaf0;border-radius:10px;font-size:14px;font-family:'Roboto',sans-serif;color:#1a1a2e;cursor:pointer;transition:all 0.15s;user-select:none}
.mopt:hover:not(.disabled){background:#ede9fe;border-color:#7c3aed}
.mopt.selected{background:#ede9fe;border-color:#7c3aed;color:#5b21b6;font-weight:500}
.mopt.correct-checked{background:#f0fdf4;border-color:#16a34a;color:#15803d;font-weight:500}
.mopt.wrong-checked{background:#fef2f2;border-color:#dc2626;color:#b91c1c;font-weight:500}
.mopt.correct-missed{background:#fef9c3;border-color:#ca8a04;color:#92400e;font-weight:500}
.mopt.disabled{cursor:default}
.mopt-box{width:18px;height:18px;border:2px solid #7c3aed;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.mopt.selected .mopt-box{background:#7c3aed}
.mopt.correct-checked .mopt-box{background:#16a34a;border-color:#16a34a}
.mopt.wrong-checked .mopt-box{background:#dc2626;border-color:#dc2626}
.mopt.correct-missed .mopt-box{background:#ca8a04;border-color:#ca8a04}
.confirm-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;font-family:'Roboto',sans-serif;cursor:pointer;background:#7c3aed;color:#fff;border:none;margin-top:8px;transition:background 0.2s}
.confirm-btn:hover{background:#6d28d9}
.confirm-btn:disabled{background:#c4b5fd;cursor:default}
.feedback{font-size:13px;color:#444;margin-top:14px;padding:12px 16px;background:#f7f8fc;border-radius:10px;border-left:4px solid #0D1B6E;line-height:1.7}
.feedback.ok{border-left-color:#16a34a;background:#f0fdf4;color:#166534}
.feedback.ko{border-left-color:#dc2626;background:#fef2f2;color:#991b1b}
.nav-row{display:flex;justify-content:flex-end;margin-top:1.5rem}
.result-hero{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1.5rem}
.result-code{font-size:12px;color:#aaa;margin-bottom:6px;letter-spacing:1px}
.result-name{font-size:17px;font-weight:600;color:#1a1a2e;margin-bottom:2px}
.result-date{font-size:13px;color:#aaa;margin-bottom:20px}
.result-score{font-size:56px;font-weight:700;color:#0D1B6E;line-height:1}
.result-score span{font-size:30px;color:#aaa;font-weight:400}
.result-pct{font-size:14px;color:#888;margin-top:6px}
.verdict-pill{display:inline-block;margin-top:16px;padding:10px 28px;border-radius:999px;font-size:17px;font-weight:700}
.verdict-desc{font-size:14px;color:#555;margin-top:10px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto}
.verdict-scale{font-size:11px;color:#bbb;margin-top:10px;letter-spacing:0.5px}
.email-banner{margin-top:18px;font-size:13px;padding:10px 18px;border-radius:8px;display:inline-block;font-weight:500}
.eb-sending{background:#e8ecf8;color:#0D1B6E}
.eb-sent{background:#f0fdf4;color:#15803d}
.eb-error{background:#fef2f2;color:#b91c1c}
.sec-label{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin-bottom:10px}
.cat-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2rem}
.cat-pill{flex:1;min-width:120px;background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:12px 14px;text-align:center}
.cat-pill .cl{font-size:11px;color:#aaa;font-weight:500}
.cat-pill .cv{font-size:22px;font-weight:700;color:#0D1B6E;margin-top:4px}
.review-list{display:flex;flex-direction:column;gap:10px;margin-bottom:2rem}
.review-item{background:#fff;border:1px solid #e8eaf0;border-radius:12px;padding:1rem 1.25rem;display:flex;gap:10px;align-items:flex-start}
.ri-icon{font-size:14px;font-weight:700;min-width:20px;margin-top:1px}
.ri-ok{color:#16a34a}
.ri-err{color:#dc2626}
.ri-body{flex:1}
.ri-q{font-size:13px;font-weight:500;color:#1a1a2e;margin-bottom:4px}
.ri-wrong{font-size:12px;color:#dc2626;margin-bottom:2px}
.ri-right{font-size:12px;color:#16a34a}
.ri-cat{font-size:11px;padding:2px 10px;border-radius:999px;background:#e8ecf8;color:#0D1B6E;white-space:nowrap;font-weight:500;align-self:flex-start;flex-shrink:0}
.btn-row{display:flex;gap:12px;justify-content:center;margin-top:2rem;flex-wrap:wrap}
.footer{text-align:center;padding:2rem 0 1rem;font-size:12px;color:#ccc}
@media(max-width:600px){.intro-grid{grid-template-columns:1fr}.btn-row{flex-direction:column;align-items:center}}
@media print{.header,.btn-row,.timer,.prog-wrap,.footer{display:none}body{background:#fff}.wrap{padding:1rem}}
</style>
</head>

<script>
const EMAILJS_SERVICE="service_it8h9pa",EMAILJS_TEMPLATE="template_ylarf5y",EMAILJS_KEY="BFRiR1c_sncLKV-cp",TOTAL_TIME=30*60;

// type: "single" o "multi" (multi ha array a:[])
const NETWORKING_Q=[
  {cat:"Networking",type:"single",q:"Cosa identifica un indirizzo IP all'interno di una rete?",opts:["Il produttore della scheda di rete","Un dispositivo connesso alla rete","La velocità massima di connessione","Il protocollo di trasmissione usato"],a:1,exp:"L'indirizzo IP identifica univocamente un dispositivo all'interno di una rete."},
  {cat:"Networking",type:"single",q:"Quanti bit compongono un indirizzo IPv4?",opts:["16 bit","64 bit","32 bit","128 bit"],a:2,exp:"IPv4 utilizza indirizzi a 32 bit, rappresentati come 4 ottetti decimali separati da punti."},
  {cat:"Networking",type:"single",q:"Quanti bit compongono un indirizzo IPv6?",opts:["32 bit","256 bit","64 bit","128 bit"],a:3,exp:"IPv6 utilizza indirizzi a 128 bit, scritti in notazione esadecimale separata da due punti."},
  {cat:"Networking",type:"single",q:"Quale dei seguenti è un indirizzo IP privato di classe A?",opts:["192.168.1.1","8.8.8.8","172.16.0.1","10.0.0.1"],a:3,exp:"Il range 10.0.0.0/8 è il blocco di indirizzi privati di classe A definito dalla RFC 1918."},
  {cat:"Networking",type:"single",q:"Quale dei seguenti è un indirizzo IP privato di classe C?",opts:["10.0.0.1","169.254.1.1","192.168.1.1","172.16.0.1"],a:2,exp:"Il range 192.168.0.0/16 è riservato alle reti private di classe C."},
  {cat:"Networking",type:"single",q:"Qual è l'indirizzo di loopback standard in IPv4?",opts:["192.168.0.1","255.255.255.255","0.0.0.0","127.0.0.1"],a:3,exp:"127.0.0.1 è l'indirizzo di loopback: il traffico inviato qui non lascia mai il dispositivo."},
  {cat:"Networking",type:"single",q:"Cosa indica il prefisso /24 nella notazione CIDR?",opts:["24 host disponibili","24 byte di payload","I primi 24 bit identificano la rete","24 reti disponibili"],a:2,exp:"In CIDR, /24 significa che i primi 24 bit identificano la rete, lasciando 8 bit per gli host."},
  {cat:"Networking",type:"single",q:"Qual è l'indirizzo di broadcast di una rete 192.168.1.0/24?",opts:["192.168.1.0","192.168.1.254","192.168.1.1","192.168.1.255"],a:3,exp:"L'indirizzo broadcast è sempre l'ultimo indirizzo della sottorete, con tutti i bit host a 1."},
  {cat:"Networking",type:"single",q:"Cosa fa il NAT (Network Address Translation)?",opts:["Cifra il traffico di rete","Definisce percorsi statici di routing","Traduce IP privati in IP pubblici per accedere a Internet","Assegna indirizzi MAC univoci"],a:2,exp:"Il NAT traduce gli indirizzi IP privati in IP pubblici permettendo a più dispositivi di condividere una connessione Internet."},
  {cat:"Networking",type:"single",q:"Cosa rappresenta il campo TTL in un pacchetto IP?",opts:["Il tempo totale di latenza","La dimensione massima del pacchetto","Il tipo di protocollo incapsulato","Il numero massimo di hop prima che il pacchetto venga scartato"],a:3,exp:"TTL è un contatore decrementato da ogni router. A 0 il pacchetto viene scartato, evitando loop infiniti."},
  {cat:"Networking",type:"single",q:"Quanti indirizzi IP totali contiene una rete /28?",opts:["32","64","8","16"],a:3,exp:"Una rete /28 lascia 4 bit per gli host: 2^4 = 16 indirizzi totali (14 host utilizzabili)."},
  {cat:"Networking",type:"single",q:"Qual è lo scopo della subnet mask?",opts:["Assegnare automaticamente IP ai dispositivi","Cifrare i dati trasmessi","Filtrare il traffico da Internet","Separare la parte di rete dalla parte host dell'IP"],a:3,exp:"La subnet mask consente di distinguere la porzione di rete dalla porzione host di un indirizzo IP."},
  {cat:"Networking",type:"single",q:"Quanti host utilizzabili offre una rete /24?",opts:["256","255","128","254"],a:3,exp:"256 indirizzi totali meno 1 per la rete e 1 per il broadcast = 254 host utilizzabili."},
  {cat:"Networking",type:"single",q:"Quanti host utilizzabili offre una rete /25?",opts:["128","62","254","126"],a:3,exp:"/25 lascia 7 bit host: 128 indirizzi totali meno 2 = 126 host utilizzabili."},
  {cat:"Networking",type:"single",q:"Quanti host utilizzabili offre una rete /30?",opts:["4","6","2","30"],a:2,exp:"/30 ha 4 indirizzi totali: 1 rete, 1 broadcast, 2 host utilizzabili. Tipico per link punto-punto."},
  {cat:"Networking",type:"single",q:"Quale subnet mask corrisponde al prefisso /16?",opts:["255.255.255.0","255.0.0.0","255.255.255.128","255.255.0.0"],a:3,exp:"255.255.0.0 ha 16 bit a 1, corrispondente a /16 in CIDR."},
  {cat:"Networking",type:"single",q:"Quale subnet mask corrisponde al prefisso /8?",opts:["255.255.0.0","255.128.0.0","255.255.255.0","255.0.0.0"],a:3,exp:"255.0.0.0 ha 8 bit a 1, corrispondente a /8 in CIDR (reti di classe A)."},
  {cat:"Networking",type:"single",q:"Quante sottoreti /26 si ricavano da una rete /24?",opts:["2","8","16","4"],a:3,exp:"Da /24 a /26 si aggiungono 2 bit: 2^2 = 4 sottoreti /26."},
  {cat:"Networking",type:"single",q:"Qual è la funzione principale del default gateway?",opts:["Fornire IP ai client tramite DHCP","Risolvere i nomi DNS","Proteggere la rete da accessi non autorizzati","Instradare il traffico verso reti diverse da quella locale"],a:3,exp:"Il default gateway è il router a cui si inviano i pacchetti destinati a reti esterne."},
  {cat:"Networking",type:"single",q:"Su quale livello OSI operano i router?",opts:["Livello 1 — Fisico","Livello 4 — Trasporto","Livello 2 — Data Link","Livello 3 — Rete"],a:3,exp:"I router operano al livello 3 (Rete), analizzando gli indirizzi IP per l'instradamento."},
  {cat:"Networking",type:"single",q:"Quale comando Windows mostra il default gateway configurato?",opts:["tracert 8.8.8.8","ping gateway","netstat -r","ipconfig"],a:3,exp:"Il comando 'ipconfig' mostra la configurazione completa di rete, incluso il default gateway."},
  {cat:"Networking",type:"single",q:"Qual è la funzione principale del protocollo DNS?",opts:["Cifrare il traffico web","Assegnare IP dinamicamente","Instradare pacchetti tra reti","Tradurre nomi di dominio in indirizzi IP"],a:3,exp:"Il DNS traduce i nomi di dominio (es. google.com) nei corrispondenti indirizzi IP."},
  {cat:"Networking",type:"single",q:"Su quale porta opera il DNS per le query standard?",opts:["TCP 80","TCP 443","TCP 25","UDP 53"],a:3,exp:"Il DNS usa la porta UDP 53 per le query standard di risoluzione nomi."},
  {cat:"Networking",type:"single",q:"Cosa fa il server DHCP?",opts:["Traduce nomi in IP","Autentica gli utenti","Filtra il traffico in ingresso","Assegna automaticamente IP e parametri di rete ai client"],a:3,exp:"Il DHCP assegna dinamicamente IP, subnet mask, gateway e DNS agli host della rete."},
  {cat:"Networking",type:"single",q:"Quale è il primo messaggio inviato da un client DHCP?",opts:["DHCP Acknowledge","DHCP Offer","DHCP Request","DHCP Discover"],a:3,exp:"Il client invia un DHCP Discover in broadcast per trovare server DHCP disponibili."},
  {cat:"Networking",type:"single",q:"Cos'è un indirizzo MAC?",opts:["Il nome del dispositivo in rete","Il numero di serie del router","Un indirizzo IP privato","Un identificatore hardware univoco a 48 bit della scheda di rete"],a:3,exp:"Il MAC address è un identificatore hardware a 48 bit assegnato in fabbrica alla scheda di rete."},
  {cat:"Networking",type:"single",q:"Cosa testa il comando ping?",opts:["La configurazione DNS","L'apertura delle porte TCP","La velocità massima della connessione","La raggiungibilità di un host e il tempo di risposta"],a:3,exp:"Ping invia pacchetti ICMP Echo Request e misura il tempo di risposta (RTT)."},
  {cat:"Networking",type:"single",q:"Cos'è una VLAN?",opts:["Un tipo di cavo Ethernet","Un protocollo di routing dinamico","Una rete wireless virtuale","Una segmentazione logica di una rete fisica in reti virtuali separate"],a:3,exp:"Una VLAN permette di suddividere logicamente una rete fisica in più reti separate."},
  {cat:"Networking",type:"single",q:"Quanti livelli ha il modello OSI?",opts:["4","5","10","7"],a:3,exp:"Il modello OSI ha 7 livelli: Fisico, Data Link, Rete, Trasporto, Sessione, Presentazione, Applicazione."},
  {cat:"Networking",type:"single",q:"Qual è la differenza principale tra TCP e UDP?",opts:["UDP è obsoleto","TCP è più veloce","Non esiste differenza sostanziale","TCP garantisce consegna ordinata con controllo errori; UDP è più veloce ma senza garanzie"],a:3,exp:"TCP è affidabile con handshake e ritrasmissioni; UDP è connectionless e più veloce ma senza garanzie."},
  {cat:"Networking",type:"single",q:"Su quale porta opera HTTP?",opts:["443","21","25","80"],a:3,exp:"HTTP opera sulla porta TCP 80."},
  {cat:"Networking",type:"single",q:"Su quale porta opera HTTPS?",opts:["80","8080","8443","443"],a:3,exp:"HTTPS opera sulla porta TCP 443, cifrando il traffico con TLS."},
  {cat:"Networking",type:"single",q:"Cosa fa il protocollo ARP?",opts:["Cifra il traffico tra host","Assegna IP dinamicamente","Traduce nomi DNS","Risolve un indirizzo IP in un indirizzo MAC nella stessa rete"],a:3,exp:"ARP traduce un IP noto in un indirizzo MAC per la comunicazione al livello Data Link."},
  {cat:"Networking",type:"single",q:"Cosa mostra il comando tracert/traceroute?",opts:["Le porte aperte su un host","La risoluzione DNS","La velocità della connessione","Il percorso hop per hop verso la destinazione con i tempi di risposta"],a:3,exp:"Tracert/traceroute mostra ogni router attraversato e il relativo RTT verso la destinazione."},
  {cat:"Networking",type:"single",q:"Cos'è una DMZ in ambito networking?",opts:["Una zona LAN senza Wi-Fi","Un tipo di VPN","Un protocollo di routing","Una sottorete separata che espone servizi pubblici proteggendo la rete interna"],a:3,exp:"La DMZ è una sottorete intermedia tra Internet e la rete interna dove si collocano server pubblici."},
  {cat:"Networking",type:"single",q:"Quale comando svuota la cache DNS su Windows?",opts:["ping /cleardns","nslookup /clear","netstat -flush","ipconfig /flushdns"],a:3,exp:"Il comando 'ipconfig /flushdns' svuota la cache DNS locale di Windows."},
  {cat:"Networking",type:"single",q:"Cosa fa il protocollo ICMP?",opts:["Trasferisce file","Assegna IP","Cifra le comunicazioni","Invia messaggi di controllo ed errore relativi alla rete"],a:3,exp:"ICMP è usato per messaggi diagnostici come ping (Echo Request/Reply) e traceroute."},
  {cat:"Networking",type:"single",q:"A quale livello OSI opera uno switch layer 2?",opts:["Livello 3","Livello 4","Livello 1","Livello 2"],a:3,exp:"Uno switch L2 opera al livello Data Link e instrada i frame usando la tabella MAC."},
  {cat:"Networking",type:"single",q:"Cosa si intende per APIPA?",opts:["IP assegnato da DHCP remoto","IP riservato ai server","IP di multicast","IP auto-assegnato nel range 169.254.x.x in assenza di DHCP"],a:3,exp:"APIPA assegna automaticamente un IP 169.254.x.x quando il client non trova un server DHCP."},
  {cat:"Networking",type:"single",q:"Quale range è riservato al multicast IPv4?",opts:["172.16.0.0-172.31.255.255","10.0.0.0-10.255.255.255","240.0.0.0-255.255.255.255","224.0.0.0-239.255.255.255"],a:3,exp:"Il range 224.0.0.0-239.255.255.255 è riservato agli indirizzi multicast (classe D)."},
  {cat:"Networking",type:"single",q:"Cos'è il lease time nel DHCP?",opts:["Il tempo dell'handshake TCP","L'intervallo tra due ARP request","Il tempo di risposta del DNS","La durata per cui un IP assegnato dal DHCP rimane valido"],a:3,exp:"Il lease time è il periodo di validità dell'IP assegnato dal DHCP; alla scadenza il client deve rinnovarlo."},
  {cat:"Networking",type:"single",q:"Cosa fa il comando nslookup?",opts:["Mostra le connessioni TCP attive","Configura il DHCP client","Mostra la tabella ARP","Interroga un server DNS per risolvere nomi o IP"],a:3,exp:"nslookup permette di interrogare manualmente un server DNS per risolvere nomi in IP o viceversa."},
  {cat:"Networking",type:"single",q:"Cos'è un record DNS di tipo A?",opts:["Un alias per un altro nome","Un record obsoleto","Associa un nome a un IPv6","Associa un nome di dominio a un indirizzo IPv4"],a:3,exp:"Il record A (Address) mappa un nome di dominio a un indirizzo IPv4."},
  {cat:"Networking",type:"single",q:"Cos'è un record DNS di tipo AAAA?",opts:["Un alias per un altro nome","Associa un nome a un IPv4","Definisce il server di posta","Associa un nome di dominio a un indirizzo IPv6"],a:3,exp:"Il record AAAA mappa un nome di dominio a un indirizzo IPv6 (128 bit)."},
  {cat:"Networking",type:"single",q:"Su quale porta opera FTP per il trasferimento dati?",opts:["25","80","443","21"],a:3,exp:"FTP usa la porta TCP 21 per il controllo e la porta TCP 20 per il trasferimento dati attivo."},
  {cat:"Networking",type:"single",q:"Su quale porta opera SSH?",opts:["23","80","443","22"],a:3,exp:"SSH (Secure Shell) opera sulla porta TCP 22 e fornisce accesso remoto cifrato."},
  {cat:"Networking",type:"single",q:"Su quale porta opera SMTP?",opts:["110","143","80","25"],a:3,exp:"SMTP (Simple Mail Transfer Protocol) usa la porta TCP 25 per l'invio di email."},
  {cat:"Networking",type:"single",q:"Cosa indica una metrica di routing più bassa?",opts:["Un gateway non raggiungibile","Una connessione più lenta","Un percorso meno preferito","Un percorso preferito rispetto ad altri con metrica più alta"],a:3,exp:"Una metrica più bassa indica un percorso preferito nelle tabelle di routing."},
  {cat:"Networking",type:"single",q:"Cos'è il routing statico?",opts:["Route apprese automaticamente tramite protocolli","Route assegnate dal DHCP","Route apprese tramite ARP","Route configurate manualmente dall'amministratore"],a:3,exp:"Il routing statico prevede route configurate manualmente, senza protocolli di routing dinamico."},
  {cat:"Networking",type:"single",q:"Cos'è la DNS cache?",opts:["Il file di configurazione del DNS","Un database di tutti i nomi mondiali","Una lista di IP bloccati","Una memoria temporanea delle risoluzioni DNS già effettuate"],a:3,exp:"La DNS cache memorizza temporaneamente le risoluzioni per ridurre le query ripetute."},
  {cat:"Networking",type:"single",q:"Cosa si ottiene con l'AND bit a bit tra IP e subnet mask?",opts:["L'indirizzo del gateway","Il numero totale di host","L'indirizzo broadcast","L'indirizzo di rete (network address)"],a:3,exp:"L'AND bit a bit tra IP e subnet mask restituisce l'indirizzo di rete."},
  {cat:"Networking",type:"multi",q:"Quali dei seguenti sono indirizzi IP privati secondo RFC 1918?",opts:["10.0.0.1","8.8.8.8","192.168.100.5","172.20.0.1","1.1.1.1"],a:[0,2,3],exp:"Gli indirizzi privati RFC 1918 sono: 10.0.0.0/8, 192.168.0.0/16 e 172.16.0.0/12."},
  {cat:"Networking",type:"multi",q:"Quali protocolli operano sulla porta 443?",opts:["HTTP","HTTPS","TLS/SSL su HTTP","FTP","SSH"],a:[1,2],exp:"HTTPS usa la porta 443 cifrando il traffico HTTP tramite TLS/SSL."},
  {cat:"Networking",type:"multi",q:"Quali affermazioni sul protocollo TCP sono corrette?",opts:["È connectionless","Usa un three-way handshake","Garantisce la consegna ordinata dei dati","Non ha controllo degli errori","Ritrasmette i pacchetti persi"],a:[1,2,4],exp:"TCP usa SYN/SYN-ACK/ACK per stabilire la connessione, garantisce l'ordine dei dati e ritrasmette i pacchetti persi."},
  {cat:"Networking",type:"multi",q:"Quali livelli fanno parte del modello OSI?",opts:["Fisico","Sessione","Accesso","Presentazione","Collegamento"],a:[0,1,3],exp:"I 7 livelli OSI sono: Fisico, Data Link, Rete, Trasporto, Sessione, Presentazione, Applicazione."},
  {cat:"Networking",type:"multi",q:"Quali comandi Windows sono utili per la diagnostica di rete?",opts:["ipconfig","format","ping","tracert","defrag"],a:[0,2,3],exp:"ipconfig mostra la configurazione, ping testa la raggiungibilità, tracert mostra il percorso dei pacchetti."},
  {cat:"Networking",type:"multi",q:"Quali caratteristiche ha una VLAN?",opts:["Segmenta logicamente la rete","Richiede router separati fisicamente","Migliora la sicurezza","Riduce il broadcast domain","Richiede switch dedicati per ogni VLAN"],a:[0,2,3],exp:"Una VLAN segmenta logicamente la rete, migliora la sicurezza e riduce i broadcast domain."},
  {cat:"Networking",type:"multi",q:"Quali messaggi fanno parte del processo DHCP DORA?",opts:["DHCP Discover","DHCP Sync","DHCP Offer","DHCP Request","DHCP Acknowledge"],a:[0,2,3,4],exp:"Il processo DHCP DORA è: Discover → Offer → Request → Acknowledge."},
  {cat:"Networking",type:"multi",q:"Quali sono porte standard di protocolli comuni?",opts:["HTTP: 80","DNS: 53","SSH: 22","FTP: 443","SMTP: 25"],a:[0,1,2,4],exp:"HTTP usa 80, DNS usa 53, SSH usa 22, SMTP usa 25. FTP usa 21, non 443."},
  {cat:"Networking",type:"multi",q:"Quali affermazioni su IPv6 sono corrette?",opts:["Usa 128 bit","Usa 32 bit","Ha un spazio di indirizzi molto più grande di IPv4","Usa notazione esadecimale","È incompatibile con IPv4 nativamente"],a:[0,2,3,4],exp:"IPv6 usa 128 bit in notazione esadecimale, ha uno spazio enormemente più grande di IPv4 e non è nativamente compatibile con esso."},
  {cat:"Networking",type:"multi",q:"Quali record DNS esistono?",opts:["Record A (IPv4)","Record AAAA (IPv6)","Record IP (routing)","Record MX (mail)","Record CNAME (alias)"],a:[0,1,3,4],exp:"I principali record DNS sono: A (IPv4), AAAA (IPv6), MX (mail server), CNAME (alias), TXT e altri."},
  {cat:"Networking",type:"multi",q:"Quali affermazioni sulla subnet mask /30 sono corrette?",opts:["Contiene 4 indirizzi totali","Ha 30 host utilizzabili","È ideale per link punto-punto","Ha 2 host utilizzabili","Corrisponde a 255.255.255.252"],a:[0,2,3,4],exp:"Una /30 ha 4 indirizzi totali (2^2), 2 host utilizzabili, ed è la scelta standard per link punto-punto tra router."},
];

const ENGLISH_Q=[
  {cat:"Inglese Tecnico",type:"single",q:"What does 'IP address' stand for?",opts:["Input Protocol address","Interface Protocol address","Internal Protocol address","Internet Protocol address"],a:3,exp:"IP stands for Internet Protocol. An IP address uniquely identifies a device on a network."},
  {cat:"Inglese Tecnico",type:"single",q:"What is a 'subnet mask' used for?",opts:["To encrypt traffic","To assign IP addresses automatically","To filter web content","To separate the network portion from the host portion of an IP address"],a:3,exp:"A subnet mask distinguishes the network part from the host part of an IP address."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'DHCP' stand for?",opts:["Distributed Host Communication Protocol","Direct Host Connection Protocol","Dynamic Host Control Program","Dynamic Host Configuration Protocol"],a:3,exp:"DHCP stands for Dynamic Host Configuration Protocol. It automatically assigns IP addresses and parameters."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'troubleshoot' mean in IT?",opts:["To install new software","To back up data","To upgrade hardware","To systematically identify, diagnose and fix technical problems"],a:3,exp:"Troubleshooting is the systematic process of identifying root causes and resolving technical issues."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'VPN' stand for?",opts:["Verified Private Node","Virtual Protocol Network","Very Protected Node","Virtual Private Network"],a:3,exp:"VPN stands for Virtual Private Network. It creates an encrypted tunnel over the internet."},
  {cat:"Inglese Tecnico",type:"single",q:"What is 'latency' in networking?",opts:["The maximum connection speed","The number of lost packets","The encryption level","The delay between sending a packet and receiving a response"],a:3,exp:"Latency is the round-trip delay in data communication, measured in milliseconds."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'escalate' mean in IT support?",opts:["To close a ticket","To mark a ticket as low priority","To assign to a colleague at same level","To transfer an unresolved issue to a higher level of support"],a:3,exp:"Escalating means passing an issue to a higher tier when the current level cannot resolve it."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'uptime' refer to?",opts:["Time to restart a server","Speed of internet connection","Time to configure a device","The continuous period a system is operational and available"],a:3,exp:"Uptime is the duration a system has been running continuously and available to users."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'deploy' mean in IT?",opts:["To test software in development","To remove outdated software","To back up a server","To release and make a system available for production use"],a:3,exp:"Deploying means releasing software into production so it is available for end users."},
  {cat:"Inglese Tecnico",type:"single",q:"What is a 'backup'?",opts:["Removing old files","Increasing bandwidth","Restarting a service","A copy of data stored separately to enable recovery in case of loss"],a:3,exp:"A backup is a copy of data that can be restored if the original is lost or corrupted."},
  {cat:"Inglese Tecnico",type:"single",q:"What is a 'firewall'?",opts:["A Wi-Fi booster","A cable type","A file transfer protocol","A security system that monitors and controls network traffic based on rules"],a:3,exp:"A firewall enforces security policies by filtering network traffic and blocking unauthorized access."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'configure' mean in IT?",opts:["To physically install hardware","To repair a broken device","To monitor traffic","To set up and adjust settings of a device or application"],a:3,exp:"Configuring means adjusting parameters and settings to make hardware or software work as required."},
  {cat:"Inglese Tecnico",type:"single",q:"What is 'bandwidth'?",opts:["The physical cable length","The number of devices connected","The encryption strength","The maximum data transfer rate of a network connection"],a:3,exp:"Bandwidth is the maximum data transfer capacity of a network link, measured in Mbps or Gbps."},
  {cat:"Inglese Tecnico",type:"single",q:"What is a 'patch' in IT?",opts:["A cable repair","A network diagram","A backup file","A software update that fixes bugs or security vulnerabilities"],a:3,exp:"A patch is a targeted software update that addresses specific bugs or security vulnerabilities."},
  {cat:"Inglese Tecnico",type:"single",q:"What is an IT 'log'?",opts:["A hardware inventory","A cable management document","An OS backup","A file that records events, errors and activities in a system"],a:3,exp:"A log file records timestamped events and errors generated by systems and applications."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'proactive' mean in work?",opts:["Waiting for problems to arise","Doing only what is requested","Avoiding responsibilities","Anticipating issues and taking initiative before being asked"],a:3,exp:"Being proactive means anticipating needs and acting before being told, rather than reacting."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'remote access' mean?",opts:["Accessing a server room physically","A type of VPN protocol","A method for encrypting emails","The ability to connect to a computer or network from a different location"],a:3,exp:"Remote access lets technicians and users connect to systems from different physical locations."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'redundancy' mean in networking?",opts:["Removing unused devices","Compressing data","Encrypting all traffic","Having duplicate components to maintain availability if one fails"],a:3,exp:"Redundancy means backup components or paths so the network keeps working if a failure occurs."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'SLA' stand for?",opts:["System Level Authorization","Software License Activation","Standard Login Access","Service Level Agreement"],a:3,exp:"SLA stands for Service Level Agreement, defining expected service levels between provider and client."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'roll back' mean in IT?",opts:["To apply an update","To delete a config file","To restart a server","To revert a system to its previous state after a failed change"],a:3,exp:"Rolling back means restoring the system to its state before a change that caused problems."},
  {cat:"Inglese Tecnico",type:"single",q:"What is 'throughput'?",opts:["The maximum theoretical speed","The number of connections","The encryption standard","The actual data transfer rate achieved, which may be lower than bandwidth"],a:3,exp:"Throughput is the real data transfer rate, which may be less than the theoretical bandwidth."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'downtime' mean?",opts:["Time to reboot a server","A maintenance window","Time to deploy an update","The period when a system is unavailable due to failure or maintenance"],a:3,exp:"Downtime is the period during which a system is not available to users."},
  {cat:"Inglese Tecnico",type:"single",q:"What is a 'workaround'?",opts:["A permanent fix","A method to bypass security","An automation script","A temporary solution to continue working while a permanent fix is developed"],a:3,exp:"A workaround is a temporary measure allowing operations to continue while the root cause is resolved."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'end user' mean?",opts:["The IT technician","The software developer","The manager who purchased the system","The person who uses a system or application in their daily work"],a:3,exp:"An end user is the person who actually uses a system, as opposed to IT professionals who manage it."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'network segmentation' achieve?",opts:["It cuts a network with cable splitters","It combines multiple networks","It encrypts all traffic","It divides a network into smaller logical parts to improve security and performance"],a:3,exp:"Network segmentation limits the impact of security incidents and improves performance."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'accountability' mean professionally?",opts:["Avoiding responsibility","Delegating everything","Only being responsible for listed tasks","Taking ownership of your actions and their outcomes, including mistakes"],a:3,exp:"Accountability means owning your work and its results, being transparent about mistakes."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'default gateway' mean?",opts:["A server that assigns IP addresses","A device that encrypts data","A DNS server","The router that forwards traffic to networks outside the local network"],a:3,exp:"The default gateway routes packets to external networks when no specific route exists."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'ping' do?",opts:["Transfers files","Displays open ports","Configures interfaces","Tests the reachability of a host and measures response time"],a:3,exp:"Ping sends ICMP Echo Request packets and measures the round-trip time to a host."},
  {cat:"Inglese Tecnico",type:"single",q:"What is a 'switch' in networking?",opts:["A Layer 3 router","An IP address assigner","A Wi-Fi amplifier","A device that connects LAN devices and forwards frames using MAC addresses"],a:3,exp:"A network switch operates at Layer 2 and forwards frames based on MAC address tables."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'SSID' stand for?",opts:["Secure Signal ID Device","System Signal ID","Standard Security Interface Device","Service Set Identifier — the name of a Wi-Fi network"],a:3,exp:"SSID stands for Service Set Identifier, which is the name broadcast by a Wi-Fi network."},
  {cat:"Inglese Tecnico",type:"single",q:"What is 'packet loss'?",opts:["A damaged cable","A router memory issue","A disconnected device","When data packets fail to reach their destination"],a:3,exp:"Packet loss occurs when transmitted packets fail to arrive at their destination."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'document' mean in IT work?",opts:["To delete old files","To encrypt sensitive data","To back up a server","To write down technical details and procedures for future reference"],a:3,exp:"Documentation means recording technical information and changes so others can understand and reproduce them."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'prioritize' mean at work?",opts:["To do all tasks simultaneously","To delegate everything","To ignore less important tasks","To decide which tasks are most important and address them first"],a:3,exp:"Prioritizing means identifying critical tasks and addressing them first to maximize efficiency."},
  {cat:"Inglese Tecnico",type:"single",q:"What is a 'network topology'?",opts:["The physical location of devices","The speed of transmission","The security protocol used","The arrangement and interconnection of devices in a network"],a:3,exp:"Network topology describes how devices are arranged and connected in a network (star, ring, mesh, etc.)."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'MAC address' stand for?",opts:["Machine Access Code","Main Address Code","Managed Access Controller","Media Access Control address — a unique hardware identifier for a network interface"],a:3,exp:"MAC stands for Media Access Control. It is the unique hardware address assigned to a network interface."},
  {cat:"Inglese Tecnico",type:"single",q:"What does 'escalate a ticket' mean?",opts:["To close a ticket","To assign it at same level","To mark it low priority","To transfer it to a higher level of technical support for resolution"],a:3,exp:"Escalating a ticket means passing it to a higher tier because the current team cannot resolve it."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which of the following are valid reasons to escalate a support ticket?",opts:["The problem exceeds your technical expertise","You want to avoid working on it","The issue requires access you don't have","The problem has been unresolved beyond the SLA time","You don't know the customer"],a:[0,2,3],exp:"Escalation is appropriate when the issue exceeds your expertise, requires higher access, or violates SLA timelines."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which of the following are good documentation practices in IT?",opts:["Recording every configuration change","Keeping notes private so no one copies your work","Writing step-by-step procedures","Documenting troubleshooting steps even when unsuccessful","Updating documentation when systems change"],a:[0,2,3,4],exp:"Good documentation includes recording changes, procedures, troubleshooting steps, and keeping docs updated."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which statements about a VPN are correct?",opts:["It encrypts traffic over the internet","It increases connection speed","It allows secure remote access","It hides the user's IP address from external sites","It requires dedicated hardware always"],a:[0,2,3],exp:"A VPN encrypts internet traffic, enables secure remote access, and masks the user's IP address."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which of the following describe 'proactive' behavior at work?",opts:["Waiting for a problem to escalate before acting","Reporting a potential issue before it becomes critical","Preparing for a meeting by reviewing relevant materials","Asking for more tasks when current ones are complete","Doing only what is explicitly requested"],a:[1,2,3],exp:"Proactive behavior includes anticipating problems, preparing in advance, and seeking additional responsibilities."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which are characteristics of a Service Level Agreement (SLA)?",opts:["Defines response and resolution times","Is optional for enterprise clients","Sets performance benchmarks","Defines penalties for not meeting targets","Applies only to hardware contracts"],a:[0,2,3],exp:"An SLA defines response/resolution times, performance benchmarks, and penalties for not meeting agreed targets."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which statements about 'downtime' are correct?",opts:["It refers to a period of system unavailability","It always implies a security breach","It can be planned (maintenance) or unplanned (failure)","Minimizing it is critical for business continuity","It only applies to servers"],a:[0,2,3],exp:"Downtime is any period of unavailability, planned or unplanned, and minimizing it is key to business continuity."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which of the following are examples of network redundancy?",opts:["Having two internet connections from different ISPs","Using a single switch for all devices","Dual power supplies in a server","A secondary firewall in standby mode","Storing all backups in one location"],a:[0,2,3],exp:"Redundancy includes dual ISP links, dual power supplies, and standby failover devices."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which of the following are part of a proper backup strategy?",opts:["Regular automated backups","Storing backups only on the same machine","Testing backup restoration periodically","Offsite or cloud backup copies","Documenting the backup procedure"],a:[0,2,3,4],exp:"A solid backup strategy includes automation, periodic restore testing, offsite copies, and documented procedures."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which statements about 'bandwidth' vs 'throughput' are correct?",opts:["Bandwidth is the theoretical maximum capacity","Throughput is the actual transfer rate achieved","They are always equal in practice","Throughput can be affected by latency and packet loss","Bandwidth is measured in milliseconds"],a:[0,1,3],exp:"Bandwidth is theoretical max; throughput is what's actually achieved and is affected by latency and packet loss."},
  {cat:"Inglese Tecnico",type:"multi",q:"Which of the following are true about a 'rollback'?",opts:["It reverts a system to a previous state","It should be planned before making changes","It is only used for database operations","It requires a prior backup or snapshot","It is a last resort after a failed change"],a:[0,1,3,4],exp:"A rollback reverts to a previous state, requires prior preparation (backup/snapshot), and is used after failed changes."},
];

const CATS=["Networking","Inglese Tecnico","Problem Solving"];
const CAT_LABELS={"Networking":"Networking","Inglese Tecnico":"Inglese Tecnico","Problem Solving":"Problem Solving"};

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function shuffleOpts(q){
  if(q.type==="multi"){
    const correctTexts=q.a.map(i=>q.opts[i]);
    const shuffled=shuffle([...q.opts]);
    return {...q,opts:shuffled,a:correctTexts.map(t=>shuffled.indexOf(t))};
  }
  const correctText=q.opts[q.a];
  const shuffled=shuffle([...q.opts]);
  return {...q,opts:shuffled,a:shuffled.indexOf(correctText)};
}

function pickQ(){
  const net=shuffle(NETWORKING_Q).slice(0,10).map(shuffleOpts);
  const eng=shuffle(ENGLISH_Q).slice(0,10).map(shuffleOpts);
  const log=shuffle(LOGIC_Q).slice(0,10).map(shuffleOpts);
  return shuffle([...net,...eng,...log]);
}

function genCode(){return Math.random().toString(36).substr(2,8).toUpperCase();}

const VERDICT=s=>{
  if(s<=10)return{label:"Resisti!",color:"#92400e",bg:"#fef3c7",desc:"Il percorso è ancora lungo, ma con impegno si cresce!"};
  if(s<=18)return{label:"Ci siamo quasi!",color:"#1d4ed8",bg:"#dbeafe",desc:"Buone basi e qualche lacuna da colmare. Il potenziale c'è!"};
  if(s<=24)return{label:"Campione",color:"#166534",bg:"#dcfce7",desc:"Solide competenze tecniche e buona autonomia operativa!"};
  return{label:"Leggenda",color:"#0D1B6E",bg:"#e8ecf8",desc:"Preparazione eccellente su tutti i fronti. Benvenuto nel team Kaplet!"};
};

async function sendEmail(p){
  const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:EMAILJS_SERVICE,template_id:EMAILJS_TEMPLATE,user_id:EMAILJS_KEY,template_params:p})});
  if(!r.ok)throw new Error("err");
}

function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="className")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v);});
  if(children){if(Array.isArray(children))children.forEach(c=>c&&el.appendChild(typeof c==="string"?document.createTextNode(c):c));else el.appendChild(typeof children==="string"?document.createTextNode(children):children);}
  return el;
}

let S={phase:"intro",form:{nome:"",cognome:"",data:""},questions:[],current:0,answers:{},chosen:null,multiSelected:[],code:genCode(),emailStatus:"idle",timeLeft:TOTAL_TIME};
let timerInt=null;

function startTimer(){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    S.timeLeft--;
    const el=document.getElementById("tmr");
    if(el){
      const m=Math.floor(S.timeLeft/60).toString().padStart(2,"0");
      const s=(S.timeLeft%60).toString().padStart(2,"0");
      el.textContent="⏱ "+m+":"+s;
      el.className="timer"+(S.timeLeft<300?" danger":S.timeLeft<600?" warn":"");
    }
    if(S.timeLeft<=0){clearInterval(timerInt);doFinish(true);}
  },1000);
}

function isCorrect(q,ans){
  if(q.type==="multi"){
    const sorted=a=>[...a].sort((x,y)=>x-y);
    return JSON.stringify(sorted(ans))===JSON.stringify(sorted(q.a));
  }
  return ans===q.a;
}

function doFinish(timeout){
  const fs=S.questions.reduce((sum,q,i)=>sum+(S.answers[i]!==undefined&&isCorrect(q,S.answers[i])?1:0),0);
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  S.questions.forEach((q,i)=>{if(cs[q.cat]){cs[q.cat].tot++;if(S.answers[i]!==undefined&&isCorrect(q,S.answers[i]))cs[q.cat].ok++;}});
  const det=CATS.map(c=>`${CAT_LABELS[c]}: ${cs[c]?.ok||0}/${cs[c]?.tot||0}`).join("\n");
  const vd=VERDICT(fs);
  S.phase="result";S.emailStatus="sending";
  render();
  sendEmail({nome:S.form.nome,cognome:S.form.cognome,data:S.form.data,codice:S.code,punteggio:fs+(timeout?" (tempo scaduto)":""),giudizio:vd.label,dettaglio:det})
    .then(()=>{S.emailStatus="sent";const el=document.getElementById("ebanner");if(el){el.className="email-banner eb-sent";el.textContent="✓ Risultati inviati al team Kaplet";}})
    .catch(()=>{S.emailStatus="error";const el=document.getElementById("ebanner");if(el){el.className="email-banner eb-error";el.textContent="⚠ Invio non riuscito — salva il PDF";}});
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(S.phase==="intro")app.appendChild(renderIntro());
  else if(S.phase==="info")app.appendChild(renderInfo());
  else if(S.phase==="quiz")app.appendChild(renderQuiz());
  else app.appendChild(renderResult());
}

function renderIntro(){
  const f=document.createDocumentFragment();
  const hero=h("div",{className:"intro-hero"});
  hero.appendChild(h("div",{className:"tag"},"Selezione Tecnici"));
  hero.appendChild(h("h1",{},"Onboarding Valutation"));
  hero.appendChild(h("p",{},"Un test strutturato per valutare competenze tecniche, inglese professionale e capacità di problem solving. Alcune domande richiedono più risposte corrette."));
  f.appendChild(hero);
  const grid=h("div",{className:"intro-grid"});
  [["📋","30 domande","10 Networking, 10 Inglese Tecnico, 10 Problem Solving. Mix di domande a risposta singola e multipla."],
   ["⏱","30 minuti","Il timer parte non appena inizi. Se scade il test si chiude automaticamente."],
   ["🎯","Valutazione onesta","Non ci sono risposte 'trappola'. Il test valuta il tuo livello reale. Sii sincero."],
   ["📧","Risultati immediati","Vedrai punteggio e dettaglio per categoria. I risultati saranno inviati al team Kaplet."]
  ].forEach(([icon,title,text])=>{
    const c=h("div",{className:"intro-card"});
    c.appendChild(h("div",{className:"intro-card-icon"},icon));
    const t=h("div",{className:"intro-card-text"});
    t.appendChild(h("h3",{},title));t.appendChild(h("p",{},text));
    c.appendChild(t);grid.appendChild(c);
  });

  f.appendChild(warn);
  f.appendChild(h("div",{className:"cta-center"},[h("button",{className:"btn btn-primary btn-lg",onClick:()=>{S.phase="info";render();}},"Inizia ora →")]));
  return f;
}

function renderInfo(){
  const card=h("div",{className:"form-card"});
  card.appendChild(h("h2",{},"I tuoi dati"));
  card.appendChild(h("div",{className:"sub"},"Inserisci nome, cognome e data. Verranno inviati insieme al risultato."));
  [["nome","Nome","text","Es. Marco"],["cognome","Cognome","text","Es. Rossi"],["data","Data","date",""]].forEach(([id,lbl,type,ph])=>{
    const fd=h("div",{className:"field"});
    fd.appendChild(h("label",{},lbl));
    const inp=document.createElement("input");
    inp.type=type;inp.id=id;inp.placeholder=ph;inp.value=S.form[id]||"";
    fd.appendChild(inp);card.appendChild(fd);
  });
  const err=h("div",{className:"err",id:"ferr"},"Compila tutti i campi per continuare.");
  card.appendChild(err);
  card.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{
    const n=document.getElementById("nome").value.trim();
    const c=document.getElementById("cognome").value.trim();
    const d=document.getElementById("data").value;
    if(!n||!c||!d){document.getElementById("ferr").style.display="block";return;}
    S.form={nome:n,cognome:c,data:d};
    S.questions=pickQ();S.current=0;S.answers={};S.chosen=null;S.multiSelected=[];S.timeLeft=TOTAL_TIME;
    S.phase="quiz";render();startTimer();
  }},"Inizia il quiz →"));
  return card;
}

function renderQuiz(){
  const f=document.createDocumentFragment();
  const q=S.questions[S.current];
  const pct=Math.round((S.current/S.questions.length)*100);
  const top=h("div",{className:"quiz-topbar"});
  top.appendChild(h("span",{className:"quiz-name"},S.form.nome+" "+S.form.cognome));
  const right=h("div",{className:"quiz-right"});
  right.appendChild(h("span",{className:"quiz-counter"},(S.current+1)+"/"+S.questions.length));
  right.appendChild(h("div",{className:"timer",id:"tmr"},"⏱ 30:00"));
  top.appendChild(right);f.appendChild(top);
  f.appendChild(h("div",{className:"prog-wrap"},[h("div",{className:"prog-fill",style:"width:"+pct+"%"})]));
  const card=h("div",{className:"q-card"});
  const tags=h("div",{className:"q-tags"});
  tags.appendChild(h("span",{className:"q-cat-tag"},CAT_LABELS[q.cat]));
  if(q.type==="multi")tags.appendChild(h("span",{className:"q-multi-tag"},"Risposta multipla"));
  card.appendChild(tags);
  card.appendChild(h("div",{className:"q-text"},q.q));
  if(q.type==="multi")card.appendChild(h("div",{className:"q-hint"},"Seleziona tutte le risposte corrette, poi clicca Conferma."));

  const answered=S.answers[S.current]!==undefined;

  if(q.type==="single"){
    q.opts.forEach((o,i)=>{
      let cls="opt";
      if(answered){if(i===q.a)cls+=" correct";else if(i===S.answers[S.current])cls+=" wrong";}
      const btn=h("button",{className:cls,onClick:()=>{
        if(answered)return;
        S.answers[S.current]=i;S.chosen=i;render();
      }},String.fromCharCode(65+i)+". "+o);
      if(answered)btn.disabled=true;
      card.appendChild(btn);
    });
  } else {
    const sel=answered?S.answers[S.current]:(S.multiSelected||[]);
    q.opts.forEach((o,i)=>{
      let cls="mopt";
      if(answered){
        const isCorrectOpt=q.a.includes(i);
        const wasSelected=S.answers[S.current].includes(i);
        if(isCorrectOpt&&wasSelected)cls+=" correct-checked";
        else if(!isCorrectOpt&&wasSelected)cls+=" wrong-checked";
        else if(isCorrectOpt&&!wasSelected)cls+=" correct-missed";
        cls+=" disabled";
      } else {
        if(sel.includes(i))cls+=" selected";
      }
      const box=h("div",{className:"mopt-box"},[sel.includes(i)||answered&&q.a.includes(i)&&S.answers[S.current].includes(i)?h("svg",{viewBox:"0 0 12 12",width:"12",height:"12"},[(() => {const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d","M2 6l3 3 5-5");p.setAttribute("stroke","#fff");p.setAttribute("stroke-width","2");p.setAttribute("fill","none");return p;})()]):document.createTextNode("")]);
      const row=h("div",{className:cls,onClick:()=>{
        if(answered)return;
        const idx=S.multiSelected.indexOf(i);
        if(idx===-1)S.multiSelected.push(i);else S.multiSelected.splice(idx,1);
        render();
      }},[box,document.createTextNode(String.fromCharCode(65+i)+". "+o)]);
      card.appendChild(row);
    });
    if(!answered){
      const confirmBtn=h("button",{className:"confirm-btn",onClick:()=>{
        if(!S.multiSelected||S.multiSelected.length===0)return;
        S.answers[S.current]=[...S.multiSelected];S.multiSelected=[];render();
      }},"Conferma risposta");
      if(!S.multiSelected||S.multiSelected.length===0)confirmBtn.disabled=true;
      card.appendChild(confirmBtn);
    }
  }

  if(answered){
    const ok=isCorrect(q,S.answers[S.current]);
    card.appendChild(h("div",{className:"feedback "+(ok?"ok":"ko")},(ok?"✓ Corretto! ":"✗ Risposta errata. ")+q.exp));
    const nav=h("div",{className:"nav-row"});
    nav.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{
      if(S.current<S.questions.length-1){S.current++;S.chosen=null;S.multiSelected=[];render();}
      else{clearInterval(timerInt);doFinish(false);}
    }},S.current<S.questions.length-1?"Prossima domanda →":"Vedi il risultato →"));
    card.appendChild(nav);
  }
  f.appendChild(card);
  setTimeout(()=>{
    const el=document.getElementById("tmr");
    if(el){const m=Math.floor(S.timeLeft/60).toString().padStart(2,"0");const s=(S.timeLeft%60).toString().padStart(2,"0");el.textContent="⏱ "+m+":"+s;el.className="timer"+(S.timeLeft<300?" danger":S.timeLeft<600?" warn":"");}
  },30);
  return f;
}

function renderResult(){
  const f=document.createDocumentFragment();
  const cs={};CATS.forEach(c=>{cs[c]={ok:0,tot:0};});
  S.questions.forEach((q,i)=>{if(cs[q.cat]){cs[q.cat].tot++;if(S.answers[i]!==undefined&&isCorrect(q,S.answers[i]))cs[q.cat].ok++;}});
  const fs=S.questions.reduce((sum,q,i)=>sum+(S.answers[i]!==undefined&&isCorrect(q,S.answers[i])?1:0),0);
  const vd=VERDICT(fs);
  const hero=h("div",{className:"result-hero"});
  hero.appendChild(h("div",{className:"result-code"},"CODICE SESSIONE: "+S.code));
  hero.appendChild(h("div",{className:"result-name"},S.form.nome+" "+S.form.cognome));
  hero.appendChild(h("div",{className:"result-date"},S.form.data));
  hero.appendChild(h("div",{className:"result-score"},[document.createTextNode(fs),h("span",{},"/"+S.questions.length)]));
  hero.appendChild(h("div",{className:"result-pct"},Math.round((fs/S.questions.length)*100)+"% di risposte corrette"));
  hero.appendChild(h("span",{className:"verdict-pill",style:"background:"+vd.bg+";color:"+vd.color},vd.label));
  hero.appendChild(h("div",{className:"verdict-desc"},vd.desc));
  hero.appendChild(h("div",{className:"verdict-scale"},"0–10 Resisti! · 11–18 Ci siamo quasi! · 19–24 Campione · 25–30 Leggenda"));
  hero.appendChild(h("div",{className:"email-banner eb-sending",id:"ebanner"},"⏳ Invio risultati in corso..."));
  f.appendChild(hero);
  f.appendChild(h("div",{className:"sec-label"},"Punteggio per categoria"));
  const grid=h("div",{className:"cat-grid"});
  CATS.forEach(c=>{
    const p=h("div",{className:"cat-pill"});
    p.appendChild(h("div",{className:"cl"},CAT_LABELS[c]));
    p.appendChild(h("div",{className:"cv"},(cs[c]?.ok||0)+"/"+(cs[c]?.tot||0)));
    grid.appendChild(p);
  });
  f.appendChild(grid);
  f.appendChild(h("div",{className:"sec-label"},"Riepilogo risposte"));
  const list=h("div",{className:"review-list"});
  S.questions.forEach((q,i)=>{
    const ok=S.answers[i]!==undefined&&isCorrect(q,S.answers[i]);
    const item=h("div",{className:"review-item"});
    item.appendChild(h("span",{className:"ri-icon "+(ok?"ri-ok":"ri-err")},ok?"✓":"✗"));
    const body=h("div",{className:"ri-body"});
    body.appendChild(h("div",{className:"ri-q"},q.q));
    if(!ok&&S.answers[i]!==undefined){
      if(q.type==="multi"){
        const givenTexts=(S.answers[i]||[]).map(idx=>q.opts[idx]).join(", ");
        const correctTexts=q.a.map(idx=>q.opts[idx]).join(", ");
        body.appendChild(h("div",{className:"ri-wrong"},"Risposta data: "+givenTexts));
        body.appendChild(h("div",{className:"ri-right"},"Corrette: "+correctTexts));
      } else {
        body.appendChild(h("div",{className:"ri-wrong"},"Risposta data: "+q.opts[S.answers[i]]));
        body.appendChild(h("div",{className:"ri-right"},"Corretta: "+q.opts[q.a]));
      }
    } else if(S.answers[i]===undefined){
      body.appendChild(h("div",{className:"ri-wrong"},"Non risposta"));
      if(q.type==="multi")body.appendChild(h("div",{className:"ri-right"},"Corrette: "+q.a.map(idx=>q.opts[idx]).join(", ")));
      else body.appendChild(h("div",{className:"ri-right"},"Corretta: "+q.opts[q.a]));
    }
    item.appendChild(body);
    const catTag=h("div",{style:"display:flex;flex-direction:column;gap:4px;align-items:flex-end"});
    catTag.appendChild(h("span",{className:"ri-cat"},CAT_LABELS[q.cat]));
    if(q.type==="multi")catTag.appendChild(h("span",{style:"font-size:10px;padding:2px 8px;border-radius:999px;background:#ede9fe;color:#5b21b6;white-space:nowrap;font-weight:500"},"multipla"));
    item.appendChild(catTag);
    list.appendChild(item);
  });
  f.appendChild(list);
  const btnRow=h("div",{className:"btn-row"});
  btnRow.appendChild(h("button",{className:"btn btn-outline",onClick:()=>window.print()},"Stampa / Salva PDF"));
  btnRow.appendChild(h("button",{className:"btn btn-primary",onClick:()=>{clearInterval(timerInt);S={phase:"intro",form:{nome:"",cognome:"",data:""},questions:[],current:0,answers:{},chosen:null,multiSelected:[],code:genCode(),emailStatus:"idle",timeLeft:TOTAL_TIME};render();}},"Nuovo test"));
  f.appendChild(btnRow);
  return f;
}

render();
</script>
</body>
</html>
